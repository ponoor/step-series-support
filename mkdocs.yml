# MkDocs configuration (Material). All pages are in docs/en and docs/ja.
# The old pages are removed (moved to docs/en and docs/ja); docs/_redirects_map.md keeps the old URLs. exclude_docs leaves out the two notes in docs/.
# site_url is where the site is published (ponoor.com/docs/step-series/). Japanese is the default language (the top); English is under en/. The header design of ponoor.com goes into overrides/.
site_name: STEP Series
site_description: Documentation of the STEP400 / STEP800 stepper motor controllers
site_url: https://ponoor.com/docs/step-series/
docs_dir: docs
use_directory_urls: true
hooks:
- tools/mkdocs_hooks.py   # search index per language (see the file)
theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: custom
    accent: custom
  font: false   # no Google Fonts; the font stack is in assets/extra.css (the designer decides the final one)
  features:
  - navigation.sections
  - navigation.top
  - search.suggest
  - content.code.copy
extra_css:
- assets/extra.css
plugins:
- search
- i18n:
    docs_structure: folder
    fallback_to_default: true
    reconfigure_material: true
    reconfigure_search: true
    languages:
    - locale: ja
      default: true
      name: 日本語
      build: true
    - locale: en
      name: English
      build: true
      nav_translations:
        はじめに: Getting started
        接続と設定: Connections and settings
        機能ガイド: Functional guides
        OSCリファレンス: OSC reference
        ハードウェア: Hardware
        保守: Maintenance
        STEP100 / STEP200: STEP100 / STEP200
markdown_extensions:
- attr_list
- tables
- admonition
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
validation:
  anchors: warn   # a link to a heading that does not exist stops the strict build
exclude_docs: '/README.md

  /_redirects_map.md

  '
nav:
- index.md
- はじめに:
  - getting-started/index.md
  - getting-started/quickstart.md
- 接続と設定:
  - connections/power-supply-and-motor.md
  - connections/sensors-and-switches.md
  - connections/network-and-dip-switch.md
  - connections/electromagnetic-brake-wiring.md
  - connections/how-settings-work.md
  - connections/microsd-card.md
  - connections/browser-config-tool.md
  - connections/configuration-items.md
  - connections/example-parameters.md
- 機能ガイド:
  - guides/communication-and-messages.md
  - guides/voltage-and-current-mode.md
  - guides/speed-profile-and-motions.md
  - guides/homing-and-position.md
  - guides/servo-mode.md
  - guides/electromagnetic-brake.md
  - guides/alarms-and-protection.md
- OSCリファレンス:
  - reference/index.md
  - reference/command-list.md
  - reference/system-settings.md
  - reference/motor-driver-settings.md
  - reference/alarm-settings.md
  - reference/voltage-and-current-mode-settings.md
  - reference/speed-profile.md
  - reference/homing.md
  - reference/home-and-limit-sensors.md
  - reference/position-management.md
  - reference/motor-control.md
  - reference/brake.md
  - reference/servo-mode_reference.md
  - reference/automatically-sent-messages.md
  - reference/differences-step400-step800.md
- ハードウェア:
  - hardware/step400.md
  - hardware/step800.md
  - hardware/emb-step400.md
- 保守:
  - maintenance/firmware-update.md
  - maintenance/compile-the-arduino-sketch.md
  - maintenance/usb-serial-diagnosis.md
  - maintenance/troubleshooting.md
  - maintenance/changelog.md
  - maintenance/migration-guide.md
- STEP100 / STEP200:
  - step100-200/index.md
  - step100-200/get-the-materials.md
  - step100-200/assemble/index.md
  - step100-200/assemble/step100.md
  - step100-200/assemble/step200.md
  - step100-200/assemble/connections.md
  - step100-200/upload-the-sketch.md
  - step100-200/usage.md
