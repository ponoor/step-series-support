    default: 41
    commands: [/setDecayModeParam]

  # --- servoMode ---
  - key: servoMode.kP
    section: servoMode
    label: {en: kP, ja: kP}
    type: float
    per_motor: true
    default: 0.06
    commands: [/setServoParam]

  - key: servoMode.kI
    section: servoMode
    label: {en: kI, ja: kI}
