# OSC command specification of the STEP series (STEP400 / STEP800)
#
# Format: spec/osc-commands.schema.json
# Check:  python tools/validate_spec.py
#         python tools/check_firmware.py --firmware <step-series-unified-firmware> --ref <tag or branch>
#
# The contents follow the firmware source of the version below. Addresses are the
# strings in the firmware's routes. Message argument types are the OSC type tags the
# firmware actually sends (int = i, float = f, string = s). Since 2.2.0 the firmware
# never sends the T / F type tags.

schema_version: 1
firmware: "2.2.0"

boards:
  STEP400: {driver: PowerSTEP01, motors: 4}
  STEP800: {driver: L6470, motors: 8}

timings:
  always: {en: Always, ja: 常時}
  stopped: {en: When the motor is stopped, ja: モータ停止時}
  hiz: {en: High Z state, ja: HiZ状態}
  motion_start: {en: In motion start condition, ja: 動作開始条件時}

groups:
  system: {page: system-settings, en: System settings, ja: 基板全体の設定}
  driver: {page: motor-driver-settings, en: Motor driver settings, ja: モータドライバの設定}
  alarm: {page: alarm-settings, en: Alarm settings, ja: アラーム}
  drive_mode: {page: voltage-and-current-mode-settings, en: Voltage and current mode settings, ja: 電圧モードと電流モード}
  speed_profile: {page: speed-profile, en: Speed profile, ja: スピードプロファイル}
  homing: {page: homing, en: Homing, ja: 原点復帰}
  sensors: {page: home-and-limit-sensors, en: HOME and LIMIT sensors, ja: HOME/LIMITセンサ}
  position: {page: position-management, en: Position management, ja: 座標}
  motion: {page: motor-control, en: Motor control, ja: モータの回転・停止}
  brake: {page: brake, en: Electromagnetic brake, ja: 電磁ブレーキ}
  servo: {page: servo-mode_reference, en: Servo mode, ja: サーボモード}

params:
  motorID:
    type: int
    range: {STEP400: [1, 4], STEP800: [1, 8]}
    all: 255
    description: {en: Motor ID, ja: モータのID}
  enable:
    type: bool
    values:
      - {value: 1, en: Enable, ja: 有効}
      - {value: 0, en: Disable, ja: 無効}

# =============================================================================
# Settings (the JSON configuration file on the microSD card)
# key: JSON path read by loadConfig.cpp. default: built-in value of the firmware
# (used when the file or the key is missing). template: value in
# configGenerator/configTemplate_*.json, only when it differs from default.
# =============================================================================

settings:
  # --- information ---
  - key: information.configName
    section: information
    label: {en: Configuration name, ja: Configuration name}
    type: string
    default: Default
    template: ""
    commands: [/setConfigName]
    description:
      en: Configuration file name. Can be set freely.
      ja: 設定ファイルの名称で、自由に設定できます。

  - key: information.configVersion
    section: information
    label: {en: Configuration version, ja: Configuration version}
    type: version
    default: [0, 0]
    template: [1, 2]
    description:
      en: Version number of the Config Tool. Unable to modify.
      ja: Config Toolsのバージョン番号で、変更できません。

  - key: information.targetProduct
    section: information
    label: {en: Target product, ja: Target product}
    type: string
    default: "---"
    template: {STEP400: STEP400, STEP800: STEP800}
    description:
      en: Name of the target product for the config file. Unable to modify.
      ja: 設定ファイルの対象機種名で、変更できません。

  # --- network ---
  - key: network.myIp
    section: network
    label: {en: My IP address, ja: My IP address}
    type: ip
    default: [10, 0, 0, 100]
    description:
      en: Set the IP address. if `ID adds to my IP` is checked, ID value added to this address becomes the actual IP address. For example if the IP address is set to `10.0.0.100` and ID switch is set to 1, `10.0.0.101` will be the actual address. Be cautious not the added value to exceed 254.
      ja: IPアドレスを設定します。`ID adds to my IP`にチェックが入っている場合は、この数値にIDが加算されたものが実際のIPアドレスになります。例えば`10.0.0.100`に設定してIDスイッチが1になっている場合は、`10.0.0.101`が実際のアドレスになります。加算した数値が254を超えないようにしてください。

  - key: network.isMyIpAddId
    section: network
    label: {en: ID adds to my IP, ja: ID adds to my IP}
    type: bool
    default: true
    description:
      en: |-
        If the address with the ID added would be beyond .254 (ID 155 or more with the default 10.0.0.100), the ID is not added: the configured address is used and a warning is printed on USB serial.
      ja: ""

  - key: network.destIp
    section: network
    label: {en: Destination IP, ja: Destination IP}
    type: ip
    default: [10, 0, 0, 10]
    commands: [/setDestIp]

  - key: network.dns
    section: network
    label: {en: DNS, ja: DNS}
    type: ip
    default: [10, 0, 0, 1]

  - key: network.gateway
    section: network
    label: {en: Gateway, ja: Gateway}
    type: ip
    default: [10, 0, 0, 1]

  - key: network.subnet
    section: network
    label: {en: Subnet mask, ja: Subnet mask}
    type: ip
    default: [255, 255, 255, 0]

  - key: network.inPort
    section: network
    label: {en: Incoming port, ja: Incoming port}
    type: int
    default: 50000
    description:
      en: The port number that the device receives OSC messages.
      ja: 本デバイスがOSCを受信するポート番号です。

  - key: network.outPort
    section: network
    label: {en: Outgoing port, ja: Outgoing port}
    type: int
    default: 50100
    description:
      en: The port number that the device send out OSC message. If `ID adds to Outgoing port` check box is checked, the ID value will be added to the port number.
      ja: 本デバイスがOSCを送信するポート番号です。`ID adds to Outgoing port`にチェックが入っていると、この数値にIDが加算されます。

  - key: network.isOutPortAddId
    section: network
    label: {en: ID adds to Outgoing port, ja: ID adds to Outgoing port}
    type: bool
    default: true
    description:
      en: |-
        If the port with the ID added would be beyond 65535, the ID is not added: the configured port is used and a warning is printed on USB serial.
      ja: ""

  - key: network.mac
    section: network
    label: {en: MAC address, ja: MAC address}
    type: mac
    default: [96, 149, 206, 16, 6, 0]
    template: {STEP400: [96, 149, 206, 16, 2, 0], STEP800: [96, 149, 206, 16, 3, 0]}
    description:
      en: You can switch decimal and hexadecimal display by clicking the check box `Hex`.
      ja: "`Hex`チェックボックスで、16進数表示と10進数表示を切替できます。"

  - key: network.isMacAddId
    section: network
    label: {en: ID adds to MAC address, ja: ID adds to MAC address}
    type: bool
    default: true
    description:
      en: When this check box is checked, the ID value will be added to the lowest byte of the MAC address.
      ja: このチェックボックスが入っていると、MACアドレスの最終バイトにIDが加算されます。

  - key: network.bootedMsgEnable
    section: network
    label: {en: Booted message enable, ja: Booted message enable}
    type: bool
    default: true
    description:
      en: Enables or disables the auto message [[/booted]] on ethernet link establishment on start.
      ja: 起動時にイーサネットがリンクすると自動で送られる[[/booted]]メッセージの有効無効を切り替えます。

  - key: network.canSendMsgBeforeDestIp
    section: network
    label: {en: Allow OSC reply before /setDestIp, ja: Allow OSC reply before /setDestIp}
    type: bool
    default: false
    description:
      en: In initial state, the controller does not send OSC response until receiving `/setDestIp`. However if this check box is checked, the controller will sends out OSC message immediately after boot up.
      ja: 初期状態では`/setDestIp`を受信するまではOSCの返送を行わないようになっていますが、このチェックボックスが入っていると、起動してすぐからOSC返送するようにします。

  - key: network.reportError
    section: network
    label: {en: Report errors, ja: Report errors}
    type: bool
    default: true
    commands: [/reportError]

  # --- alarmAndReport ---
  - key: alarmAndReport.reportBUSY
    section: alarmAndReport
    label: {en: Report BUSY, ja: Report BUSY}
    type: bool
    per_motor: true
    default: false
    commands: [/enableBusyReport]

  - key: alarmAndReport.reportHiZ
    section: alarmAndReport
    label: {en: Report HiZ, ja: Report HiZ}
    type: bool
    per_motor: true
    default: false
    commands: [/enableHizReport]

  - key: alarmAndReport.reportHomeSwStatus
    section: alarmAndReport
    label: {en: Report HOME switch status, ja: Report HOME switch status}
    type: bool
    per_motor: true
    default: false
    commands: [/enableHomeSwReport]

  - key: alarmAndReport.reportLimitSwStatus
    section: alarmAndReport
    label: {en: Report LIMIT switch status, ja: Report LIMIT switch status}
    type: bool
    per_motor: true
    boards: [STEP400]
    default: false
    commands: [/enableLimitSwReport]

  - key: alarmAndReport.reportDir
    section: alarmAndReport
    label: {en: Report motor direction, ja: Report motor direction}
    type: bool
    per_motor: true
    default: false
    commands: [/enableDirReport]

  - key: alarmAndReport.reportMotorStatus
    section: alarmAndReport
    label: {en: Report Motor Status, ja: Report Motor Status}
    type: bool
    per_motor: true
    default: false
    commands: [/enableMotorStatusReport]

  - key: alarmAndReport.reportSwEvn
    section: alarmAndReport
    label: {en: Report HOME switch event, ja: Report HOME switch event}
    type: bool
    per_motor: true
    default: false
    commands: [/enableSwEventReport]

  - key: alarmAndReport.reportUVLO
    section: alarmAndReport
    label: {en: Report undervoltage lockout, ja: Report undervoltage lockout}
    type: bool
    per_motor: true
    default: true
    commands: [/enableUvloReport]

  - key: alarmAndReport.reportThermalStatus
    section: alarmAndReport
    label: {en: Report thermal status of driver chip, ja: Report thermal status of driver chip}
    type: bool
    per_motor: true
    default: true
    commands: [/enableThermalStatusReport]

  - key: alarmAndReport.reportOCD
    section: alarmAndReport
    label: {en: "", ja: ""}
    type: bool
    per_motor: true
    default: true
    commands: [/enableOverCurrentReport]

  - key: alarmAndReport.reportStall
    section: alarmAndReport
    label: {en: Report motor stall detection, ja: Report motor stall detection}
    type: bool
    per_motor: true
    default: false
    commands: [/enableStallReport]

  - key: alarmAndReport.reportPositionInterval
    section: alarmAndReport
    label: {en: "", ja: ""}
    type: int
    unit: ms
    per_motor: true
    default: 0
    range: [0, 65535]
    commands: [/setPositionReportInterval]
    description:
      en: |-
        The interval of the position report ([[/position]]) of each motor. 0 turns the report off.

        The value is not range-checked when the configuration file is read (or written over USB serial): it is kept in a 16-bit variable, so a value outside 0-65535 wraps around (65536 becomes 0, which turns the report off; -1 becomes 65535). [[/setPositionReportInterval]] rejects a value above 65535 with `CommandIgnored`, and a negative value turns the report off.
      ja: ""

  - key: alarmAndReport.reportPositionListInterval
    section: alarmAndReport
    label: {en: "", ja: ""}
    type: int
    unit: ms
    default: 0
    range: [0, 65535]
    commands: [/setPositionListReportInterval]
    description:
      en: |-
        The interval of the position list report ([[/positionList]]). 0 turns the report off. When it is greater than 0, the position report of each motor ([[/position]]) is turned off.

        The value is not range-checked when the configuration file is read (or written over USB serial): it is kept in a 16-bit variable, so a value outside 0-65535 wraps around (65536 becomes 0, -1 becomes 65535). [[/setPositionListReportInterval]] rejects a value above 65535 with `CommandIgnored`.
      ja: ""

  - key: alarmAndReport.OCThreshold
    section: alarmAndReport
    label: {en: Overcurrent threshold, ja: Overcurrent threshold}
    type: int
    per_motor: true
    default: {STEP400: 15, STEP800: 7}
    template: {STEP800: 15}
    commands: [/setOverCurrentThreshold]

  # --- driverSettings ---
  - key: driverSettings.homingAtStartup
    section: driverSettings
    label: {en: Homing when the system starts, ja: Homing when the system starts}
    type: bool
    per_motor: true
    default: false
    description:
      en: |-
        Proceed to homing movement soon after boot when this check box is checked.

        With the electromagnetic brake enabled, the brake is released first, as [[/activate]] does, and the homing starts once the brake is released.
      ja: このチェックボックスが入っていると、起動すると直ちに原点復帰動作を行います。
    changes:
      - {version: "2.2.0", en: "With the electromagnetic brake enabled, the brake is released first, as `/activate 1` does, and the homing starts once the brake is released. Before, the homing failed because the brake was engaged, and the timeout of the homing later sent a hard stop to the HiZ motor.", ja: ""}

  - key: driverSettings.homingDirection
    section: driverSettings
    label: {en: Homing Direction, ja: Homing Direction}
    type: int
    per_motor: true
    default: 0
    values:
      - {value: 1, en: Forward, ja: 正転方向}
      - {value: 0, en: Reverse, ja: 逆転方向}
    commands: [/setHomingDirection]

  - key: driverSettings.homingSpeed
    section: driverSettings
    label: {en: Homing Speed, ja: Homing Speed}
    type: float
    unit: step/s
    per_motor: true
    default: 50
    commands: [/setHomingSpeed]

  - key: driverSettings.homeSwMode
    section: driverSettings
    label: {en: Home switch won't cause HardStop, ja: Home switch won't cause HardStop}
    type: bool
    per_motor: true
    default: true
    commands: [/setHomeSwMode]

  - key: driverSettings.prohibitMotionOnHomeSw
    section: driverSettings
    label: {en: Prohibit motions on HomeSw, ja: Prohibit motions on HomeSw}
    type: bool
    per_motor: true
    default: false
    commands: [/setProhibitMotionOnHomeSw]

  - key: driverSettings.limitSwMode
    section: driverSettings
    label: {en: Limit switch won't cause HardStop, ja: Limit switch won't cause HardStop}
    type: bool
    per_motor: true
    boards: [STEP400]
    default: true
    commands: [/setLimitSwMode]

  - key: driverSettings.prohibitMotionOnLimitSw
    section: driverSettings
    label: {en: Prohibit motions on LimitSw, ja: Prohibit motions on LimitSw}
    type: bool
    per_motor: true
    boards: [STEP400]
    default: false
    commands: [/setProhibitMotionOnLimitSw]

  - key: driverSettings.goUntilTimeout
    section: driverSettings
    label: {en: goUntil timeout duration, ja: goUntil timeout duration}
    type: int
    unit: ms
    per_motor: true
    default: 10000
    aliases: [driverSettings.goUnitlTimeout]
    commands: [/setGoUntilTimeout]

  - key: driverSettings.releaseSwTimeout
    section: driverSettings
    label: {en: releaseSw timeout duration, ja: releaseSw timeout duration}
    type: int
    unit: ms
    per_motor: true
    default: 10000
    commands: [/setReleaseSwTimeout]

  - key: driverSettings.stepMode
    section: driverSettings
    label: {en: Microstepping mode, ja: Microstepping mode}
    type: int
    per_motor: true
    default: 7
    commands: [/setMicrostepMode]

  - key: driverSettings.isCurrentMode
    section: driverSettings
    label: {en: Current mode, ja: Current mode}
    type: bool
    per_motor: true
    boards: [STEP400]
    default: false
    commands: [/setVoltageMode, /setCurrentMode]

  - key: driverSettings.slewRate
    section: driverSettings
    label: {en: Slew rate, ja: Slew rate}
    type: int
    per_motor: true
    default: {STEP400: 5, STEP800: 2}
    range: {STEP400: [0, 5], STEP800: [0, 2]}
    values:
      STEP400:
        - {value: 0, en: 114V/us, ja: 114V/us}
        - {value: 1, en: 220V/us, ja: 220V/us}
        - {value: 2, en: 400V/us, ja: 400V/us}
        - {value: 3, en: 520V/us, ja: 520V/us}
        - {value: 4, en: 790V/us, ja: 790V/us}
        - value: 5
          en: 980V/us
          ja: 980V/us
          changes:
            - {version: "2.2.0", en: "The driver is now really set to the 980 V/us of the datasheet (gate current 96 mA, TCC 375 ns). Firmware 2.1.0 and earlier, with driver library v1.1.0, wrote 64 mA and 2375 ns for this value by mistake, so the switching was slower than 980 V/us. This value is the initial value, so a board with the default setting switches faster than before. The values 0-4 are unchanged. The driver library recommends checking the temperature of the drivers and the EMI on the real hardware.", ja: ""}
      STEP800:
        - {value: 0, en: 180V/us, ja: 180V/us}
        - {value: 1, en: 290V/us, ja: 290V/us}
        - {value: 2, en: 530V/us, ja: 530V/us}
    description:
      en: |-
        Set the slew rate (steepness of rising) of motor control current from a motor driver in 6 steps for STEP400, 3 steps for STEP800.

        A value outside the range in the configuration file is not rejected: it is limited to the range (a negative value becomes 0, a larger one the highest value).
      ja: モータドライバから出力されるモータ制御電流のスリューレート（立ち上がりの鋭さ）をSTEP400では6段階、STEP800では3段階で指定します。

  - key: driverSettings.electromagnetBrakeEnable
    section: driverSettings
    label: {en: Electromagnetic brake enable, ja: Electromagnetic brake enable}
    type: bool
    per_motor: true
    default: false
    commands: [/enableElectromagnetBrake]

  - key: driverSettings.brakeTransitionDuration
    section: driverSettings
    label: {en: Brake transition duration, ja: Brake transition duration}
    type: int
    unit: ms
    per_motor: true
    default: 100
    range: [0, 65535]
    commands: [/setBrakeTransitionDuration]
    description:
      en: |-
        The time to wait for the brake to release or to engage. See [[/setBrakeTransitionDuration]].

        The value is not range-checked when the configuration file is read (or written over USB serial): it is kept in a 16-bit variable, so a value outside 0-65535 wraps around (65536 becomes 0, -1 becomes 65535). [[/setBrakeTransitionDuration]] rejects such a value with `CommandIgnored`.
      ja: ""

  # --- speedProfile ---
  - key: speedProfile.acc
    section: speedProfile
    label: {en: Acceleration, ja: Acceleration}
    type: float
    unit: step/s/s
    per_motor: true
    default: 1000
    template: 2000
    commands: [/setAcc, /setSpeedProfile]

  - key: speedProfile.dec
    section: speedProfile
    label: {en: Deceleration, ja: Deceleration}
    type: float
    unit: step/s/s
    per_motor: true
    default: 1000
    template: 2000
    commands: [/setDec, /setSpeedProfile]

  - key: speedProfile.maxSpeed
    section: speedProfile
    label: {en: Max speed, ja: Max speed}
    type: float
    unit: step/s
    per_motor: true
    default: 650
    template: 620
    commands: [/setMaxSpeed, /setSpeedProfile]

  - key: speedProfile.fullStepSpeed
    section: speedProfile
    label: {en: Transit to fullstep threshold speed, ja: Transit to fullstep threshold speed}
    type: float
    unit: step/s
    per_motor: true
    default: 15610
    template: 15625
    commands: [/setFullstepSpeed]

  - key: speedProfile.minSpeed
    section: speedProfile
    label: {en: "", ja: ""}
    type: float
    unit: step/s
    per_motor: true
    default: 0
    commands: [/setMinSpeed]

  # --- voltageMode ---
  - key: voltageMode.KVAL_HOLD
    section: voltageMode
    label: {en: KVAL_HOLD, ja: KVAL_HOLD}
    type: int
    per_motor: true
    default: 0
    commands: [/setKval, /setHoldKval]
    description:
      en: With the electromagnetic brake enabled, KVAL_HOLD is raised to at least half of KVAL_RUN whenever the motor is energized again; the raised value replaces the stored setting (so `/saveConfig` saves it) and is returned by [[/getKval]].
      ja: ""

  - key: voltageMode.KVAL_RUN
    section: voltageMode
    label: {en: KVAL_RUN, ja: KVAL_RUN}
    type: int
    per_motor: true
    default: 16
    commands: [/setKval, /setRunKval]

  - key: voltageMode.KVAL_ACC
    section: voltageMode
    label: {en: KVAL_ACC, ja: KVAL_ACC}
    type: int
    per_motor: true
    default: 16
    commands: [/setKval, /setAccKval]

  - key: voltageMode.KVAL_DEC
    section: voltageMode
    label: {en: KVAL_DEC, ja: KVAL_DEC}
    type: int
    per_motor: true
    default: 16
    commands: [/setKval, /setDecKval]

  - key: voltageMode.INT_SPEED
    section: voltageMode
    label: {en: INT_SPEED, ja: INT_SPEED}
    type: int
    per_motor: true
    default: 1032
    commands: [/setBemfParam]

  - key: voltageMode.ST_SLP
    section: voltageMode
    label: {en: ST_SLP, ja: ST_SLP}
    type: int
    per_motor: true
    default: 25
    commands: [/setBemfParam]

  - key: voltageMode.FN_SLP_ACC
    section: voltageMode
    label: {en: FN_SLP_ACC, ja: FN_SLP_ACC}
    type: int
    per_motor: true
    default: 41
    commands: [/setBemfParam]

  - key: voltageMode.FN_SLP_DEC
    section: voltageMode
    label: {en: FN_SLP_DEC, ja: FN_SLP_DEC}
    type: int
    per_motor: true
    default: 41
    commands: [/setBemfParam]

  - key: voltageMode.STALL_TH
    section: voltageMode
    label: {en: STALL_TH, ja: STALL_TH}
    type: int
    per_motor: true
    default: {STEP400: 31, STEP800: 127}
    commands: [/setStallThreshold]

  - key: voltageMode.lowSpeedOptimizeEnable
    section: voltageMode
    label: {en: "", ja: ""}
    type: bool
    per_motor: true
    default: false
    commands: [/enableLowSpeedOptimize]

  - key: voltageMode.lowSpeedOptimize
    section: voltageMode
    label: {en: lowSpeedOptimize, ja: lowSpeedOptimize}
    type: float
    unit: step/s
    per_motor: true
    default: 20
    commands: [/setLowSpeedOptimizeThreshold]

  # --- currentMode (STEP400) ---
  - key: currentMode.TVAL_HOLD
    section: currentMode
    label: {en: TVAL_HOLD, ja: TVAL_HOLD}
    type: int
    per_motor: true
    boards: [STEP400]
    default: 0
    commands: [/setTval, /setHoldTval]
    description:
      en: With the electromagnetic brake enabled, TVAL_HOLD is raised to at least half of TVAL_RUN whenever the motor is energized again; the raised value replaces the stored setting (so `/saveConfig` saves it) and is returned by [[/getTval]].
      ja: ""

  - key: currentMode.TVAL_RUN
    section: currentMode
    label: {en: TVAL_RUN, ja: TVAL_RUN}
    type: int
    per_motor: true
    boards: [STEP400]
    default: 16
    commands: [/setTval, /setRunTval]

  - key: currentMode.TVAL_ACC
    section: currentMode
    label: {en: TVAL_ACC, ja: TVAL_ACC}
    type: int
    per_motor: true
    boards: [STEP400]
    default: 16
    commands: [/setTval, /setAccTval]

  - key: currentMode.TVAL_DEC
    section: currentMode
    label: {en: TVAL_DEC, ja: TVAL_DEC}
    type: int
    per_motor: true
    boards: [STEP400]
    default: 16
    commands: [/setTval, /setDecTval]

  - key: currentMode.T_FAST
    section: currentMode
    label: {en: T_FAST, ja: T_FAST}
    type: int
    per_motor: true
    boards: [STEP400]
    default: 25
    commands: [/setDecayModeParam]

  - key: currentMode.TON_MIN
    section: currentMode
    label: {en: TON_MIN, ja: TON_MIN}
    type: int
    per_motor: true
    boards: [STEP400]
    default: 41
    commands: [/setDecayModeParam]

  - key: currentMode.TOFF_MIN
    section: currentMode
    label: {en: TOFF_MIN, ja: TOFF_MIN}
    type: int
    per_motor: true
    boards: [STEP400]
    default: 41
    commands: [/setDecayModeParam]

  # --- servoMode ---
  - key: servoMode.kP
    section: servoMode
    label: {en: kP, ja: kP}
    type: float
    per_motor: true
    default: 0.06
    commands: [/setServoParam]

  - key: servoMode.kI
    section: servoMode
    label: {en: kI, ja: kI}
    type: float
    per_motor: true
    default: 0
    commands: [/setServoParam]

  - key: servoMode.kD
    section: servoMode
    label: {en: kD, ja: kD}
    type: float
    per_motor: true
    default: 0
    commands: [/setServoParam]

# =============================================================================
# Commands (PC -> board)
# Grouped by `group`, in the order of the current reference pages.
# =============================================================================

commands:
  # ---------------------------------------------------------------------------
  # system
  # ---------------------------------------------------------------------------
  - address: /setDestIp
    group: system
    timing: always
    description:
      en: |
        Sets the destination IP address (`destIp`) to where the device should send messages to, when it replies to a query or report internal state changes, etc.
        The board sets the `destIp` to the sender of this message.

        Also, until `destIp` is set, no OSC (Open Sound Control) messages will be sent from the device, so send this command first. One single exception is the [[/booted]] message.

        From the configuration tool, you can set the board to start sending out the OSC message without waiting the `destIp` to be set.

        To resolve the MAC address, the board sends one byte of UDP to port 9 (discard) of the destination; a Mac answers with ICMP port unreachable, which has no effect on the board. To check that the board is alive, use a command with a reply such as [[/getVersion]], not `/setDestIp`.
      ja: |
        モータの状態に変化があったときに通知するメッセージや、問い合わせへ返答するメッセージなどの送り先IPアドレス(`destIp`)を指定します。このメッセージを送信したIPアドレスを`destIp`に設定します。

        また、`destIp`が設定されるまでは、本デバイスからOSCメッセージの送信は行いませんので、一番最初にこのコマンドを送信してください。唯一の例外は [[/booted]] メッセージです。

        Config Toolの設定を用いて、`destIp`が設定されていなくてもOSCメッセージを送信できるように設定できます。
    response: [/destIp]
    changes:
      - {version: "2.2.0", en: "When this `/setDestIp` starts the resolution of the MAC address of the destination, the reply `/destIp` is sent once it has been resolved, so it can come later than before (a few ms on a wired network, up to about 2 s on Wi-Fi). If it does not come, send `/setDestIp` again. A `/setDestIp` that starts no resolution (for example one sent every second as a heartbeat) is answered at once.", ja: ""}
      - {version: "2.2.0", en: "Messages to the destination (replies, reports, errors) are dropped while the MAC address is being resolved (up to 2 s). The broadcast `/booted` is still sent.", ja: ""}
      - {version: "2.2.0", en: "A `/setDestIp` from a different device with the same IP address (another PC or network adapter), sent 1.5 s or more after the last packet from the old one, now makes the board send to the new device. Before, the board kept sending to the old MAC address until it was restarted.", ja: ""}
      - {version: "2.2.0", en: "A send to a destination that has never answered ARP (for example a wrong destination address) blocks the processing for about 41 ms (1.6 s or more before). It no longer happens for every message: the sends to that destination are paused for 1 s: the messages in that time are dropped, not sent later. A packet received from that destination resumes the sends at once. The broadcast `/booted` is not affected.", ja: ""}

  - address: /getVersion
    group: system
    timing: always
    description:
      en: Returns the firmware version burnt on the chip.
      ja: 本体に書き込まれているファームウェアのバージョン情報を返します。
    response: [/version]

  - address: /getConfigName
    group: system
    timing: always
    description:
      en: Returns the name of the configuration file read from the microSD card on system boot.
      ja: 起動時にmicroSDカードから読み込まれたコンフィギュレーションファイルの名称を返します。
    response: [/configName]
    see_also: [/setConfigName]

  - address: /reportError
    group: system
    args:
      - {use: enable, setting: network.reportError}
    timing: always
    description:
      en: Enables or disables the automatic message notification for [[/error/command]] and [[/error/osc]].
      ja: "[[/error/command]] および [[/error/osc]] メッセージの自動送信の有効/無効を切り替えます。"
    notifies: [/error/command, /error/osc]

  - address: /setConfigName
    group: system
    since: "2.1.0"
    args:
      - name: configName
        type: string
        setting: information.configName
        description: {en: Configuration name string, ja: ""}
    timing: always
    description:
      en: Sets the configuration name stored in the device. This is a user-editable label for identifying configurations and is distinct from the on-disk filename.
      ja: ""
    see_also: [/getConfigName, /saveConfig]

  - address: /saveConfig
    group: system
    since: "2.1.0"
    timing: always
    description:
      en: Saves the current running configuration to the microSD card as a JSON file. The filename used is the one previously set, or the filename from which the configuration was originally loaded.
      ja: ""
    response:
      - message: /saveConfig
        when: {en: Saved, ja: 保存できたとき}
      - message: /error/saveConfig
        when: {en: Failed, ja: 保存できなかったとき}

  - address: /resetDevice
    group: system
    timing: always
    description:
      en: |-
        Resets the entire device. A programmatic version of physically pressing the RESET button.

        After the restart, [[/booted]] is sent with `resetCause` 5 (software reset).
      ja: 基板全体をリセットします。基板上のリセットスイッチを押した場合と同じ動作です。
    changes:
      - {version: "2.2.0", en: "First stops the turning motors that have the electromagnetic brake enabled and not engaged with a hard stop, engages their brakes and waits for the longest `brakeTransitionDuration` of them (at most 1 s), then restarts. Motors without the brake are not stopped by the firmware. Before, the board restarted at once.", ja: ""}
      - {version: "2.2.0", en: "Resets with a software reset: `/booted` reports `resetCause` 5. Before, it caused a HardFault and the watchdog timeout restarted the board.", ja: ""}

  # ---------------------------------------------------------------------------
  # driver
  # ---------------------------------------------------------------------------
  - address: /setMicrostepMode
    group: driver
    args:
      - use: motorID
      - name: STEP_SEL
        type: int
        range: [0, 7]
        setting: driverSettings.stepMode
        values:
          - {value: 0, en: Full-step, ja: Full-step}
          - {value: 1, en: Half-step, ja: Half-step}
          - {value: 2, en: 1/4 microstep, ja: 1/4 microstep}
          - {value: 3, en: 1/8 microstep, ja: 1/8 microstep}
          - {value: 4, en: 1/16 microstep, ja: 1/16 microstep}
          - {value: 5, en: 1/32 microstep, ja: 1/32 microstep}
          - {value: 6, en: 1/64 microstep, ja: 1/64 microstep}
          - {value: 7, en: 1/128 microstep, ja: 1/128 microstep}
        description: {en: Microstepping mode, ja: Micro stepping mode}
    timing: hiz
    description:
      en: |
        Sets the microstepping mode.
        In the constant-current control mode (current mode), only full-step to 1/16 microstep is available.

        The motor must be HiZ. A motor holding its position is not HiZ: send [[/softHiZ]] or [[/hardHiZ]] first, otherwise `MotorNotHiZ` is replied and nothing is applied. On STEP400 in the current mode, a step mode finer than 1/16 replies `CommandIgnored`.

        A value outside 0-7 is not rejected: it is converted to 8 bits and then limited to 0-7 (-1 becomes 7, 256 becomes 0).
      ja: |
        マイクロステッピングのモードを切り替えます。

        定電流制御モード (current mode) では、Full-stepから1/16 microstepまでしか使えません。
    errors: [MotorNotHiZ, CommandIgnored]
    changes:
      - {version: "2.2.0", en: "The motor must be HiZ; otherwise `/error/command MotorNotHiZ` is replied and nothing is applied. Before, the driver ignored the write while the firmware variable and the saved configuration took the new value.", ja: ""}
      - {version: "2.2.0", en: "STEP400 in the current mode: a step mode finer than 1/16 replies `CommandIgnored` (the PowerSTEP01 current mode goes up to 1/16).", ja: ""}
    see_also: [/getMicrostepMode, /setCurrentMode]

  - address: /getMicrostepMode
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the mode of microstepping. See [[/setMicrostepMode]] for STEP_SEL.
      ja: マイクロステッピングのモードを取得します。STEP_SELについては[[/setMicrostepMode]]の項目を参照してください。
    response: [/microstepMode]

  - address: /enableLowSpeedOptimize
    group: driver
    args:
      - use: motorID
      - {use: enable, setting: voltageMode.lowSpeedOptimizeEnable}
    timing: stopped
    description:
      en: Enable/disable low speed optimization feature which compensate phase current distortion at a very low speed using a small driving voltage. When this optimization is enabled, speed profile minimum speed (`Min speed`) is force to zero. Only work with voltage mode. See data sheets for details.
      ja: 低速回転時の相電流ひずみ補正 (Low speed optimization) の有効無効を切り替えます。この設定が有効になっていると、`Min Speed` は自動的に0になります。この補正は電圧モードでのみ利用可能です。詳しくは対応するデータシートの "Low speed optimization"を参照してください。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and nothing is applied.", ja: ""}
    see_also: [/setLowSpeedOptimizeThreshold, /setMinSpeed]

  - address: /setLowSpeedOptimizeThreshold
    group: driver
    args:
      - use: motorID
      - name: lowSpeedOptimizationThreshold
        type: float
        range: [0.0, 976.3]
        unit: step/s
        setting: voltageMode.lowSpeedOptimize
        description: {en: Low speed optimization threshold, ja: Low speed optimization threshold}
    timing: always
    description:
      en: |-
        Set the threshold for phase current distortion compensation at very low speed. For details, refer to "Low speed optimization" section in the corresponding datasheet.

        No reply is sent. Read the value back with [[/getLowSpeedOptimizeThreshold]].

        While the low speed optimization is enabled, the motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and nothing is applied.
      ja: 低速回転時の相電流ひずみ補正を行う閾値を設定します。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "While the low speed optimization is enabled, a turning motor replies `/error/command MotorNotStopped` and nothing is applied.", ja: ""}
    see_also: [/getLowSpeedOptimizeThreshold, /enableLowSpeedOptimize]

  - address: /getLowSpeedOptimizeThreshold
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the current value of the low speed optimization threshold.
      ja: Low speed optimization threshold の現在の設定値を取得します。
    response: [/lowSpeedOptimizeThreshold]

  - address: /enableBusyReport
    group: driver
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportBUSY}
    timing: always
    description:
      en: Automatically sends out notification if the BUSY status of the specified motor has changed. The notification message is same as the response from [[/getBusy]] command.
      ja: 指定したモータのBUSY状態に変化があったら自動でメッセージを送信する設定を行います。メッセージは[[/getBusy]]の返答と同じです。
    notifies: [/busy]

  - address: /getBusy
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the BUSY state of the specified motor.
      ja: 指定したモータのBUSY状態を取得します。
    response: [/busy]

  - address: /enableHizReport
    group: driver
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportHiZ}
    timing: always
    description:
      en: Following message is sent automatically when there is a change in the High Z (high impedance) state of the specified motor.
      ja: 指定したモータのHiZ（ハイインピーダンス）状態に変化があったら自動でメッセージを送信する設定を行います。送信されるメッセージは[[/getHiZ]]の返答と同じです。
    notifies: [/HiZ]

  - address: /getHiZ
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Requests the High Z (high impedance) state of the specified motor.
      ja: 指定したモータのHiZ状態を取得します。
    response: [/HiZ]

  - address: /enableDirReport
    group: driver
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportDir}
    timing: always
    description:
      en: Following message is sent automatically when there is a change in the direction of the specified motor.
      ja: 指定したモータの回転方向に変化があったら自動でメッセージを送信する設定を行います。送信されるメッセージは[[/getDir]]の返答と同じです。
    notifies: [/dir]

  - address: /getDir
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Requests the direction of the specified motor.
      ja: 指定したモータの回転方向を取得します。
    response: [/dir]
    changes:
      - {version: "2.2.0", en: "`/getDir 255` (all motors) returns the direction. It returned the HiZ state.", ja: ""}

  - address: /enableMotorStatusReport
    group: driver
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportMotorStatus}
    timing: always
    description:
      en: Following message will be sent automatically when there is conditional change in the operating status (MOT_STATUS) of the specified motor. The response message is same as the reply from the [[/getMotorStatus]] command.
      ja: 指定したモータの動作状態(MOT_STATUS)に変化があったら自動でメッセージを送信する設定を行います。メッセージは[[/getMotorStatus]]の返答と同じです。
    notifies: [/motorStatus]

  - address: /getMotorStatus
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the operating status (MOT_STATUS) of the specified motor.
      ja: 指定したモータの動作状態(MOT_STATUS)を取得します。
    response: [/motorStatus]

  - address: /setPositionReportInterval
    group: driver
    args:
      - use: motorID
      - name: interval
        type: int
        range: [0, 65535]
        unit: ms
        setting: alarmAndReport.reportPositionInterval
        description: {en: transmit interval, ja: 送信間隔}
    timing: always
    description:
      en: |
        Send the current position (`ABS_POS`) of the specified motor with the specified interval. Disabled with the interval 0.

        When this function enabled, `/setPositionListReportInterval` will be automatically disabled and stop the transmitting.

        An interval above 65535 replies `CommandIgnored` and nothing is applied. A negative interval disables the report, as 0.
      ja: |
        指定したモータの現在位置 (`ABS_POS`) を指定間隔で自動送信します。0を指定すると無効化され、送信を停止します。
        いずれかのモータで有効化された場合、`/setPositionListReportInterval`は無効になり自動停止します。
    notifies: [/position]
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A value above 65535 replies `/error/command CommandIgnored` and nothing is applied. Before, 32768 and above were read as negative and disabled the report. A negative interval still disables it.", ja: ""}
      - {version: "2.2.0", en: "When the report is enabled (interval above 0) for one motor, the saved position list report interval is cleared too, as it was for 255. Before, a configuration saved after switching from the list report to one motor's report started the list report again at the next start and cleared the motor's report.", ja: ""}
    see_also: [/getPosition, /setPositionListReportInterval]

  - address: /setPositionListReportInterval
    group: driver
    args:
      - name: interval
        type: int
        range: [0, 65535]
        unit: ms
        setting: alarmAndReport.reportPositionListInterval
        description: {en: transmit interval, ja: 送信間隔}
    timing: always
    description:
      en: |
        Send a single message with a list of the current position (`ABS_POS`) of all motors with the specified interval. Disabled with the interval 0.

        When this function enabled, `/setPositionReportInterval` will be disabled automatically for all motors and stop the transmitting.

        An interval above 65535 replies `CommandIgnored` with the motor ID 255 and nothing is applied. A negative interval disables the report, as 0.
      ja: |
        全モータの現在位置 (`ABS_POS`) をひとつのリストにまとめたメッセージを指定間隔で自動送信します。0を指定すると無効化され、送信を停止します。
        このコマンドが有効化される際には `/setPositionReportInterval`はすべての軸で無効になり自動停止します。
    notifies: [/positionList]
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A value above 65535 replies `/error/command CommandIgnored 255` and nothing is applied. Before, 32768 and above were read as negative and disabled the report. A negative interval still disables it.", ja: ""}
    see_also: [/getPositionList, /setPositionReportInterval]

  - address: /getAdcVal
    group: driver
    args: [{use: motorID}]
    boards: [STEP400]
    routed_on: [STEP400, STEP800]
    timing: always
    description:
      en: |-
        Acquires ADC_OUT register values from the PowerSTEP01 chip. This register stores 5-bit AD-converted voltage reading from ADC pin. This pin is pull-upped with 10kOhm resistor and wired to LIMITSW connector.

        STEP400 only. The firmware also accepts the command on STEP800, but it is not meaningful there.
      ja: PowerSTEP01チップのADC_OUTレジスタの値を取得します。このレジスタはADCピンの電圧を5ビットでAD変換した値が収められています。このピンは10kΩでプルアップされていて、LIMITSWコネクタに接続されています。
    response: [/adcVal]

  - address: /getStatus
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Gets the STATUS of the motor driver (PowerSTEP01 for STEP400/L6470 for STEP800). The STATUS includes the status of the motor, alarms and switches.

        Refer to "STATUS" in the data sheet for the information contained in the registers. Some of bits are latched and reset when STATUS registers are read out. Because the device firmware constantly obtains the STATUS values, these values are immediately reset. It is possible to set up these events to be reported separately, so please use those commands.

        This command does not clear the latched flags; only the status poll of the firmware (every 5 ms) does.
      ja: |
        モータドライバ(PowerSTEP01/L6470)のステータスレジスタを取得します。ステータスレジスタにはモータやアラーム、スイッチの状態などが含まれます。

        レジスタに含まれる情報は、データシートを参照してください。このうち、一部の値はラッチされていて、ステータスレジスタを読み出すとリセットされます。本デバイスではファームウェアによって常時ステータスレジスタを繰り返し取得しているため、これらの値はすぐにリセットされてしまいます。これらの事象を個別に報告する設定が可能ですので、そちらを利用してください。
    response: [/status]
    changes:
      - {version: "2.2.0", en: "Reads the STATUS register with GetParam instead of GetStatus, so it no longer clears the latched driver flags (e.g. OCD, stall flags, UVLO, SW_EVN). The register values are the same. Only the status poll of the firmware (every 5 ms) clears them now, so a `/getStatus` sent right after another can show a flag the earlier reply showed (until the next poll, up to 5 ms).", ja: ""}
    see_also: [/getStatusList]
    tables:
      - columns:
          - {en: Name of bits in STATUS (STEP400), ja: ステータスbit名 (STEP400)}
          - {en: Name of bits in STATUS (STEP800), ja: ステータスbit名 (STEP800)}
          - {en: The corresponding configuration commands, ja: 対応する設定コマンド}
        rows:
          - [UVLO, UVLO, "[[/enableUvloReport]]"]
          - [UVLO_ADC, "-", {en: This feature is not available in STEP400 and is always disabled., ja: この機能はSTEP400では使えませんので常時無効になっています。}]
          - [OCD, OCD, "[[/enableOverCurrentReport]]"]
          - ["STALL_A, STALL_B", "STEP_LOSS_A, STEP_LOSS_B", "[[/enableStallReport]]"]
          - [CMD_ERROR, "WRONG_CMD, NOTPREF_CMD", "[[/reportError]]"]
          - [TH_STATUS, "TH_WRN, TH_SD", "[[/enableThermalStatusReport]]"]
          - [SW_EVN, SW_EVN, "[[/enableSwEventReport]]"]
          - [MOT_STATUS, MOT_STATUS, "[[/enableMotorStatusReport]]"]
          - [SW_F, SW_F, "[[/enableHomeSwReport]]"]
          - [BUSY, BUSY, "[[/enableBusyReport]]"]
          - [HiZ, HiZ, "[[/enableHizReport]]"]

  - address: /getConfigRegister
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Acquires the CONFIG register value from the motor driver (PowerSTEP01 or L6470). The information stored in CONFIG register includes motor, alarm and switch status.

        The CONFIG register stores various settings for the motor driver. Please refer the datasheet of the PowerSTEP01/L6470 for detail.
      ja: |
        モータドライバ(PowerSTEP01/L6470)のCONFIGレジスタを取得します。CONFIGレジスタにはモータやアラーム、スイッチの状態などが含まれます。

        CONFIGレジスタにはモータドライバの各種設定が収められています。詳細についてはモータドライバのデータシートを参照してください。
    response: [/configRegister]

  - address: /resetMotorDriver
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: |-
        Resets the motor driver (PowerSTEP01/L6470) and rewrites the setting.

        With the electromagnetic brake enabled, the command is accepted only while the brake is engaged or after [[/free]] (the motor is HiZ); otherwise it replies `CommandIgnored`. It cancels pending motion and the servo mode.
      ja: モータドライバ (PowerSTEP01/L6470) をリセットし、初期設定値を再度書き込みます。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "With the electromagnetic brake enabled, accepted only while the brake is engaged or after `/free`; otherwise `/error/command CommandIgnored`. Before, it made the driver HiZ with the brake released.", ja: ""}
      - {version: "2.2.0", en: "Cancels pending motion (a `/goTo` etc. waiting for the BUSY flag, the homing, the servo mode), also with the brake disabled.", ja: ""}
      - {version: "2.2.0", en: "The settings applied again after the reset include those made with the Raw commands (see [[/setAccRaw]]).", ja: ""}

  - address: /getStatusList
    group: driver
    timing: always
    description: {en: "Gets the STATUS registers of all motors at once. See [[/getStatus]] for the contents of the register.", ja: ""}
    response: [/statusList]
    changes:
      - {version: "2.2.0", en: "Reads the STATUS registers with GetParam instead of GetStatus, so it no longer clears the latched driver flags. See [[/getStatus]].", ja: ""}
    see_also: [/getStatus]

  # ---------------------------------------------------------------------------
  # alarm
  # ---------------------------------------------------------------------------
  - address: /enableUvloReport
    group: alarm
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportUVLO}
    timing: always
    description:
      en: |
        Set the notification message when UVLO (Undervoltage Lockout) occurs in the specified motor driver.
        UVLO occurs when the supplied voltage to the motor driver falls below the UVLO turn-off threshold voltage, with or without notification. In this state, the motor cannot be operated. It will be reset when the supply voltage is above the UVLO turn-on threshold.

        These thresholds are different between STEP400(PowerSTEP01) and STEP800(L6470). For details, please refer to the corresponding datasheets.
      ja: |
        指定したモータドライバで UVLO (Undervoltage Lockout) が発生した際に自動で通知メッセージを送信するかどうかを指定します。
        UVLOはモータドライバへ供給されている電圧がUVLO発生条件電圧を下回ったら通知の有無にかかわらず発生します。この状態ではモータを動かすことはできません。供給電圧がUVLO解除条件電圧を上回ったら解除されます。

        これらの電圧はSTEP400(PowerSTEP01)とSTEP800(L6470)で異なっていますので、詳しくは対応するデータシートで確認してください。
    notifies: [/uvlo]
    see_also: [/getUvlo]

  - address: /getUvlo
    group: alarm
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the current state of UVLO
      ja: UVLOの現在の状態を取得します。
    response: [/uvlo]

  - address: /enableThermalStatusReport
    group: alarm
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportThermalStatus}
    timing: always
    description:
      en: Sends a notification message when a change in the temperature status (thermalStatus) of the specified motor driver is detected. On bridge shutdown or device shutdown, the motor state will automatically enter High Z state with or without notification.
      ja: 指定したモータドライバの温度状態(thermalStatus)に変化があったら自動でメッセージを送信するかどうかを指定します。Bridge shutdown, Device shutdown 状態では、通知の有無にかかわらずモータはHiZ状態になります。
    notifies: [/thermalStatus]
    see_also: [/getThermalStatus]

  - address: /getThermalStatus
    group: alarm
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Gets the current condition of the ThermalStatus. Thermal status thresholds are different between STEP400(PowerSTEP01) and STEP800(L6470).

        In the bridge shutdown and device shutdown states, the motor goes into the High Z state with or without notification.
      ja: |
        ThermalStatusの現在の状態を取得します。STEP400とSTEP800では Thermal statusの種類や発生条件が異なります。

        Bridge shutdown, Device shutdown 状態では、通知の有無にかかわらずモータはHiZ状態になります。
    response: [/thermalStatus]

  - address: /enableOverCurrentReport
    group: alarm
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportOCD}
    timing: always
    description:
      en: |
        Set to send a notification when the specified motor driver goes into an overcurrent state (OCD, Over Current Detection).
        When overcurrent is detected, the device automatically enters High Z state regardless of whether a notification being sent. The threshold can be set with [[/setOverCurrentThreshold]].
      ja: |
        指定したモータドライバが過電流状態(OCD, Over Current Detection)になった場合に自動でメッセージを送信するかどうかを指定します。
        過電流状態になった場合は、通知の有無にかかわらず自動でHiZ状態になります。閾値は [[/setOverCurrentThreshold]] で設定できます。
    notifies: [/overCurrent]

  - address: /setOverCurrentThreshold
    group: alarm
    args:
      - use: motorID
      - name: OCD_TH
        type: int
        range: {STEP400: [0, 31], STEP800: [0, 15]}
        setting: alarmAndReport.OCThreshold
        description: {en: Overcurrent detection threshold, ja: Overcurrent detection threshold}
    timing: always
    description:
      en: |-
        Sets the overcurrent threshold. The setting value range and corresponding currents are different between STEP400(PowerSTEP01) and STEP800(L6470).

        A value above the range is not rejected: only the low bits are used (STEP400: 0x1F, STEP800: 0x0F), so the value wraps around (for example 16 becomes 0 on STEP800).
      ja: 過電流の閾値を設定します。STEP400とSTEP800では設定値の範囲と対応する電流が異なっています。
    response: [/overCurrentThreshold]
    see_also: [/getOverCurrentThreshold, /enableOverCurrentReport]
    tables:
      - title: Overcurrent detection threshold
        columns: [OCD_TH, Overcurrent detection threshold]
        rows:
          STEP400:
            - [0, 312.5mA]
            - [1, 625mA]
            - ["...", "..."]
            - [30, 9.6875A]
            - [31, 10A]
          STEP800:
            - [0, 375mA]
            - [1, 750mA]
            - ["...", "..."]
            - [14, 5.625A]
            - [15, 6A]

  - address: /getOverCurrentThreshold
    group: alarm
    args: [{use: motorID}]
    timing: always
    description:
      en: Get the threshold of overcurrent.
      ja: 過電流の閾値を取得します。
    response: [/overCurrentThreshold]

  - address: /enableStallReport
    group: alarm
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportStall}
    timing: always
    description:
      en: |
        The threshold can be set by [[/setStallThreshold]].
        When the stall is detected by the specified motor driver, the following message is sent automatically.
      ja: |
        閾値は [[/setStallThreshold]] で設定できます。
        指定したモータドライバでストール（脱調）が検出された場合、自動で下記のメッセージを送信します。
    notifies: [/stall]

  - address: /setStallThreshold
    group: alarm
    args:
      - use: motorID
      - name: STALL_TH
        type: int
        range: {STEP400: [0, 31], STEP800: [0, 127]}
        setting: voltageMode.STALL_TH
        description: {en: Stall detection threshold, ja: Stall detection threshold}
    timing: always
    description:
      en: |-
        Sets the threshold for stall detection. The setting value range and corresponding currents are different between STEP400(PowerSTEP01) and STEP800(L6470).

        A value above the range is not rejected: only the low bits are used (STEP400: 0x1F, STEP800: 0x7F), so the value wraps around (for example 128 becomes 0 on STEP800).
      ja: ストール検出の閾値を設定します。STEP400とSTEP800で設定する値の範囲は異なります。
    response: [/stallThreshold]
    changes:
      - {version: "2.2.0", en: "Also changes the saved STALL_TH (`/saveConfig`, `/resetMotorDriver`). Before, it changed the register only.", ja: ""}
    see_also: [/getStallThreshold, /enableStallReport]
    tables:
      - title: Stall detection threshold
        columns: [STALL_TH, Stall detection threshold]
        rows:
          STEP400:
            - [0, 312.5mA]
            - [1, 625mA]
            - ["...", "..."]
            - [30, 9.6875A]
            - [31, 10A]
          STEP800:
            - [0, 31.25mA]
            - [1, 62.5mA]
            - ["...", "..."]
            - [126, 3.969A]
            - [127, 4A]

  - address: /getStallThreshold
    group: alarm
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the stall detection threshold.
      ja: ストール検出の閾値を取得します。
    response: [/stallThreshold]

  - address: /setProhibitMotionOnHomeSw
    group: alarm
    args:
      - use: motorID
      - use: enable
        setting: driverSettings.prohibitMotionOnHomeSw
        values:
          - {value: 1, en: Prohibit, ja: 禁止}
          - {value: 0, en: Allow, ja: 許可}
    timing: always
    description:
      en: Prohibits any motion commands towards the origin point when Home sensor is detected. The direction to the origin point can be configured through the configuration tool or by the `/setHomingDirection` command.
      ja: Homeセンサが反応している状態で、原点復帰方向へのモーションコマンドを禁止します。原点復帰方向は configTool や `/setHomingDirection`で設定できます。
    changes:
      - {version: "2.2.0", en: "The automatic hard stop at the home switch is not sent to a motor whose driver is HiZ, also with the brake disabled (a hard stop energizes a HiZ driver).", ja: ""}
    see_also: [/getProhibitMotionOnHomeSw, /setHomingDirection]

  - address: /getProhibitMotionOnHomeSw
    group: alarm
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns whether the motion command towards the origin point is prohibited when Home sensor is detected.
      ja: Homeセンサが反応している状態で、原点復帰方向へのモーションコマンドが禁止されているかどうかを返します。
    response: [/prohibitMotionOnHomeSw]

  - address: /setProhibitMotionOnLimitSw
    group: alarm
    args:
      - use: motorID
      - use: enable
        setting: driverSettings.prohibitMotionOnLimitSw
        values:
          - {value: 1, en: Prohibit, ja: 禁止}
          - {value: 0, en: Allow, ja: 許可}
    boards: [STEP400]
    timing: always
    description:
      en: Prohibits any motion commands towards the leaving direction from origin point, when the Limit sensor is detected. The direction to the origin point can be configured through the configuration tool or by the `/setHomingDirection` command.
      ja: Limitセンサが反応している状態で、原点復帰方向の逆方向へのモーションコマンドを禁止します。原点復帰方向は configTool や `/setHomingDirection`で設定できます。
    see_also: [/getProhibitMotionOnLimitSw, /setHomingDirection]

  - address: /getProhibitMotionOnLimitSw
    group: alarm
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: Returns whether the motion command towards reverse direction to the origin point is prohibited when Limit sensor is detected.
      ja: Limitセンサが反応している状態で、原点復帰方向の逆方向へのモーションコマンドが禁止されているかどうかを返します。
    response: [/prohibitMotionOnLimitSw]

  # ---------------------------------------------------------------------------
  # drive_mode
  # ---------------------------------------------------------------------------
  - address: /setVoltageMode
    group: drive_mode
    args: [{use: motorID}]
    boards: [STEP400]
    timing: hiz
    description:
      en: |
        Switches the specified motor to the voltage drive mode.

        Note: This command is only available in STEP400.
        STEP800 is always in this voltage mode and cannot change.
      ja: 指定したモータを電圧モードに切り替えます。STEP800は常に電圧モードで動作しますので、この切替コマンドはSTEP400のみ利用可能です。
    errors: [MotorNotHiZ, CommandIgnored]
    changes:
      - {version: "2.2.0", en: "The outputs must be HiZ; otherwise `/error/command MotorNotHiZ` is replied and nothing is applied.", ja: ""}
      - {version: "2.2.0", en: "The mode is changed only if the driver took it (STEP_MODE is read back); otherwise `/error/command CommandIgnored`. Before, the stored mode was changed while the driver kept the old one, so [[/setKval]] and [[/setTval]] then wrote the wrong registers.", ja: ""}
    see_also: [/setCurrentMode]

  - address: /setKval
    group: drive_mode
    args:
      - use: motorID
      - name: holdKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_HOLD
        description: {en: KVAL when stopped, ja: 停止時のKVAL}
      - name: runKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_RUN
        description: {en: KVAL in constant speed operation, ja: 一定速運転時のKVAL}
      - name: accKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_ACC
        description: {en: KVAL during acceleration, ja: 加速時のKVAL}
      - name: decKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_DEC
        description: {en: KVAL during deceleration, ja: 減速時のKVAL}
    timing: always
    description:
      en: |-
        Sets the four KVALs together.

        A value outside 0-255 is not rejected: it is limited to 0-255.

        On STEP400 in the current mode only the stored setting changes; [[/setVoltageMode]] writes it to the registers.
      ja: KVAL4種をまとめて設定します。
    see_also: [/getKval, /setHoldKval, /setRunKval, /setAccKval, /setDecKval]

  - address: /getKval
    group: drive_mode
    args: [{use: motorID}]
    timing: always
    description:
      en: |-
        Get the four KVALs together.

        With the electromagnetic brake enabled and the voltage mode, KVAL_HOLD is raised to at least half of KVAL_RUN whenever the motor is energized again (from engaged, engaging or after [[/free]]), and this command returns the raised value. In the current mode TVAL_HOLD is raised instead.
      ja: KVAL4種をまとめて取得します。
    response: [/kval]
    changes:
      - {version: "2.2.0", en: "Returns the settings (what [[/setKval]] sets and `/saveConfig` saves) instead of the driver registers. In the current mode the KVAL registers keep the value from before; in the voltage mode they are the registers. KVAL_HOLD raised for a motor with the electromagnetic brake is returned too. STEP800: the reply is the same as before.", ja: ""}

  - address: /setBemfParam
    group: drive_mode
    args:
      - use: motorID
      - name: INT_SPEED
        type: int
        range: [0, 16383]
        setting: voltageMode.INT_SPEED
        description: {en: INT_SPEED register value, ja: INT_SPEEDレジスタの値}
      - name: ST_SLP
        type: int
        range: [0, 255]
        setting: voltageMode.ST_SLP
        description: {en: ST_SLP register value, ja: ST_SLPレジスタの値}
      - name: FN_SLP_ACC
        type: int
        range: [0, 255]
        setting: voltageMode.FN_SLP_ACC
        description: {en: FN_SLP_ACC register value, ja: FN_SLP_ACCレジスタの値}
      - name: FN_SLP_DEC
        type: int
        range: [0, 255]
        setting: voltageMode.FN_SLP_DEC
        description: {en: FN_SLP_DEC register value, ja: FN_SLP_DECレジスタの値}
    timing: hiz
    description:
      en: |-
        Sets BEMF compensation parameter register. For the values for each parameter, refer voltage mode and current mode.

        The outputs must be HiZ; otherwise `MotorNotHiZ` is replied and nothing is applied.

        A value outside the range is not rejected: INT_SPEED is limited to 0-16383 and the other parameters to 0-255.
      ja: BEMF補償パラメータのレジスタを設定します。各レジスタの設定値については 電圧モードの設定 を参照してください。
    errors: [MotorNotHiZ]
    changes:
      - {version: "2.2.0", en: "The outputs must be HiZ (INT_SPEED, ST_SLP, FN_SLP_ACC and FN_SLP_DEC are writable only in HiZ); otherwise `/error/command MotorNotHiZ` and nothing is applied.", ja: ""}
    see_also: [/getBemfParam]

  - address: /getBemfParam
    group: drive_mode
    args: [{use: motorID}]
    timing: always
    description:
      en: Get register values for the BEMF parameter.
      ja: BEMFパラメータを設定するレジスタ値を取得します。
    response: [/bemfParam]

  - address: /setHoldKval
    group: drive_mode
    args:
      - use: motorID
      - name: holdKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_HOLD
        description: {en: KVAL when stopped, ja: 停止時のKVAL}
    timing: always
    description:
      en: |-
        Sets only the hold KVAL value.

        A value outside 0-255 is not rejected: it is limited to 0-255.

        On STEP400 in the current mode only the stored setting changes; [[/setVoltageMode]] writes it to the registers.
      ja: 停止時のKVALのみを設定します。
    see_also: [/setKval]

  - address: /setRunKval
    group: drive_mode
    args:
      - use: motorID
      - name: runKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_RUN
        description: {en: KVAL in constant speed operation, ja: 一定速運転時のKVAL}
    timing: always
    description:
      en: |-
        Sets only the run KVAL value.

        A value outside 0-255 is not rejected: it is limited to 0-255.

        On STEP400 in the current mode only the stored setting changes; [[/setVoltageMode]] writes it to the registers.
      ja: 一定速運転時のKVALのみを設定します。
    see_also: [/setKval]

  - address: /setAccKval
    group: drive_mode
    args:
      - use: motorID
      - name: accKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_ACC
        description: {en: KVAL during acceleration, ja: 加速時のKVAL}
    timing: always
    description:
      en: |-
        Sets only the acceleration KVAL value.

        A value outside 0-255 is not rejected: it is limited to 0-255.

        On STEP400 in the current mode only the stored setting changes; [[/setVoltageMode]] writes it to the registers.
      ja: 加速時のKVALのみを設定します。
    see_also: [/setKval]

  - address: /setDecKval
    group: drive_mode
    args:
      - use: motorID
      - name: decKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_DEC
        description: {en: KVAL during deceleration, ja: 減速時のKVAL}
    timing: always
    description:
      en: |-
        Sets only the deceleration KVAL value.

        A value outside 0-255 is not rejected: it is limited to 0-255.

        On STEP400 in the current mode only the stored setting changes; [[/setVoltageMode]] writes it to the registers.
      ja: 減速時のKVALのみを設定します。
    see_also: [/setKval]

  - address: /setCurrentMode
    group: drive_mode
    args: [{use: motorID}]
    boards: [STEP400]
    timing: hiz
    description:
      en: |-
        Switches the specified motor to the current drive mode.

        The PowerSTEP01 current mode goes up to 1/16 microsteps: a finer microstep mode is lowered to 1/16, and the stored setting ([[/setMicrostepMode]], `driverSettings.stepMode`) is changed with it.
      ja: 指定したモータを電流モードに切り替えます。
    errors: [MotorNotHiZ, CommandIgnored]
    changes:
      - {version: "2.2.0", en: "The outputs must be HiZ; otherwise `/error/command MotorNotHiZ` is replied and nothing is applied.", ja: ""}
      - {version: "2.2.0", en: "The mode is changed only if the driver took it (STEP_MODE is read back); otherwise `/error/command CommandIgnored`. Before, the stored mode was changed while the driver kept the old one, so [[/setKval]] and [[/setTval]] then wrote the wrong registers.", ja: ""}
    see_also: [/setVoltageMode, /setMicrostepMode]

  - address: /setTval
    group: drive_mode
    args:
      - use: motorID
      - name: holdTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_HOLD
        description: {en: TVAL when stopped, ja: 停止時のTVAL}
      - name: runTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_RUN
        description: {en: TVAL in constant speed operation, ja: 一定速運転時のTVAL}
      - name: accTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_ACC
        description: {en: TVAL during acceleration, ja: 加速時のTVAL}
      - name: decTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_DEC
        description: {en: TVAL during deceleration, ja: 減速時のTVAL}
    boards: [STEP400]
    timing: always
    description:
      en: |
        Sets the four TVALs together.
        In STEP400, the TVAL is as follows.

        A value outside 0-64 is not rejected: it is limited to 0-64. The upper limit 64 (about 5 A) is a safety limit of the firmware.

        In the voltage mode only the stored setting changes; [[/setCurrentMode]] writes it to the registers.
      ja: |
        TVAL4種をまとめて設定します。

        STEP400では、TVALは以下のようになっています。
    see_also: [/getTval, /getTval_mA, /setHoldTval, /setRunTval, /setAccTval, /setDecTval]
    tables:
      - columns: [TVAL, {en: "Setting value[mA]", ja: "設定値[mA]"}]
        rows:
          - [0, 78mA]
          - [1, 156mA]
          - ["...", "..."]
          - [127, "9,984mA"]

  - address: /getTval
    group: drive_mode
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: |-
        Get the four TVAL types together.

        With the electromagnetic brake enabled and the current mode, TVAL_HOLD is raised to at least half of TVAL_RUN whenever the motor is energized again (from engaged, engaging or after [[/free]]), and this command returns the raised value. In the voltage mode KVAL_HOLD is raised instead.
      ja: TVAL4種をまとめて取得します。
    response: [/tval]
    changes:
      - {version: "2.2.0", en: "Returns the settings (what [[/setTval]] sets and `/saveConfig` saves) instead of the driver registers. In the voltage mode the TVAL registers keep the value from before. TVAL_HOLD raised for a motor with the electromagnetic brake is returned too.", ja: ""}
    see_also: [/getTval_mA]

  - address: /getTval_mA
    group: drive_mode
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: Get the four TVAL types together. Not in register values but in the actual current values in [mA].
      ja: TVAL4種をまとめて取得します。レジスタの値ではなく単位[mA]の設定値で返します。
    response: [/tval_mA]
    changes:
      - {version: "2.2.0", en: "Returns the settings (what [[/setTval]] sets and `/saveConfig` saves) instead of the driver registers. In the voltage mode the TVAL registers keep the value from before. TVAL_HOLD raised for a motor with the electromagnetic brake is returned too.", ja: ""}
    see_also: [/getTval]

  - address: /setDecayModeParam
    group: drive_mode
    args:
      - use: motorID
      - name: T_FAST
        type: int
        range: [0, 255]
        setting: currentMode.T_FAST
        description: {en: T_FAST register value, ja: T_FASTレジスタの値}
      - name: TON_MIN
        type: int
        range: [0, 127]
        setting: currentMode.TON_MIN
        description: {en: TON_MIN register value, ja: TON_MINレジスタの値}
      - name: TOFF_MIN
        type: int
        range: [0, 127]
        setting: currentMode.TOFF_MIN
        description: {en: TOFF_MIN register value, ja: TOFF_MINレジスタの値}
    boards: [STEP400]
    timing: hiz
    description:
      en: |-
        Sets registers for the current control algorithm parameters. For the each register values, refer the datasheet of the PowerSTEP01.

        The outputs must be HiZ; otherwise `MotorNotHiZ` is replied and nothing is applied.

        TON_MIN and TOFF_MIN are 7 bit (0-127): a value outside it replies `CommandIgnored` and nothing is applied. A T_FAST outside 0-255 is limited to 0-255.
      ja: 電流制御アルゴリズムのパラメータのレジスタを設定します。各レジスタの設定値については PowerSTEP01のデータシートを参照してください。
    errors: [MotorNotHiZ, CommandIgnored]
    changes:
      - {version: "2.2.0", en: "TON_MIN and TOFF_MIN are 0-127 (7 bit); a value outside it replies `/error/command CommandIgnored` and nothing is applied. Before, 128-255 were taken modulo 128 by the driver while the saved value stayed 128-255. T_FAST is 0-255 as before.", ja: ""}
      - {version: "2.2.0", en: "The outputs must be HiZ; otherwise `/error/command MotorNotHiZ` and nothing is applied.", ja: ""}
    see_also: [/getDecayModeParam]

  - address: /getDecayModeParam
    group: drive_mode
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: Retrieves the register values for the current control algorithm parameters.
      ja: 電流制御アルゴリズムのパラメータを設定するレジスタ値を取得します。
    response: [/decayModeParam]

  - address: /setHoldTval
    group: drive_mode
    args:
      - use: motorID
      - name: holdTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_HOLD
        description: {en: TVAL when stopped, ja: 停止時のTVAL}
    boards: [STEP400]
    timing: always
    description:
      en: |-
        Sets only the hold TVAL value.

        A value outside 0-64 is not rejected: it is limited to 0-64. The upper limit 64 (about 5 A) is a safety limit of the firmware.

        In the voltage mode only the stored setting changes; [[/setCurrentMode]] writes it to the registers.
      ja: 停止時のTVALのみを設定します。
    see_also: [/setTval]

  - address: /setRunTval
    group: drive_mode
    args:
      - use: motorID
      - name: runTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_RUN
        description: {en: TVAL in constant speed operation, ja: 一定速運転時のTVAL}
    boards: [STEP400]
    timing: always
    description:
      en: |-
        Sets only the run TVAL value.

        A value outside 0-64 is not rejected: it is limited to 0-64. The upper limit 64 (about 5 A) is a safety limit of the firmware.

        In the voltage mode only the stored setting changes; [[/setCurrentMode]] writes it to the registers.
      ja: 一定速運転時のTVALのみを設定します。
    see_also: [/setTval]

  - address: /setAccTval
    group: drive_mode
    args:
      - use: motorID
      - name: accTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_ACC
        description: {en: TVAL during acceleration, ja: 加速時のTVAL}
    boards: [STEP400]
    timing: always
    description:
      en: |-
        Sets only the acceleration TVAL value.

        A value outside 0-64 is not rejected: it is limited to 0-64. The upper limit 64 (about 5 A) is a safety limit of the firmware.

        In the voltage mode only the stored setting changes; [[/setCurrentMode]] writes it to the registers.
      ja: 加速時のTVALのみを設定します。
    see_also: [/setTval]

  - address: /setDecTval
    group: drive_mode
    args:
      - use: motorID
      - name: decTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_DEC
        description: {en: TVAL during deceleration, ja: 減速時のTVAL}
    boards: [STEP400]
    timing: always
    description:
      en: |-
        Sets only the deceleration TVAL value.

        A value outside 0-64 is not rejected: it is limited to 0-64. The upper limit 64 (about 5 A) is a safety limit of the firmware.

        In the voltage mode only the stored setting changes; [[/setCurrentMode]] writes it to the registers.
      ja: 減速時のTVALのみを設定します。
    see_also: [/setTval]

  # ---------------------------------------------------------------------------
  # speed_profile
  # ---------------------------------------------------------------------------
  - address: /setSpeedProfile
    group: speed_profile
    args:
      - use: motorID
      - name: acc
        type: float
        range: [14.55, 59575]
        unit: step/s/s
        setting: speedProfile.acc
        description: {en: acceleration, ja: 加速度}
      - name: dec
        type: float
        range: {STEP400: [14.55, 59590], STEP800: [14.55, 59575]}
        unit: step/s/s
        setting: speedProfile.dec
        description: {en: deceleration, ja: 減速度}
      - name: maxSpeed
        type: float
        range: [15.25, 15610]
        unit: step/s
        setting: speedProfile.maxSpeed
        description: {en: maximum speed, ja: 最大速さ}
    timing: stopped
    description:
      en: |-
        Sets the acc, dec, and maxSpeed of the speed profile together.

        ACC and DEC are rounded to the nearest register value, so the written value can differ by 1 LSB. MAX_SPEED alone is writable at any time, but nothing is written to a motor that replies with `MotorNotStopped`. A value outside the range is limited by the driver library. On STEP400, a maximum speed of 0 is written as 1 (the register value 0 is reserved).
      ja: スピードプロファイルのacc, dec, maxSpeedをまとめて設定します。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old values.", ja: ""}
      - {version: "2.2.0", en: "`acc` and `dec` are rounded to the nearest register value, so the written value can differ by 1 LSB.", ja: ""}
      - {version: "2.2.0", en: "STEP400: a maximum speed of 0 is written as 1 (the register value 0 is reserved).", ja: ""}
    see_also: [/getSpeedProfile, /setAcc, /setDec, /setMaxSpeed]

  - address: /getSpeedProfile
    group: speed_profile
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the acc, dec, and maxSpeed of the speed profile together.
      ja: スピードプロファイルのacc, dec, maxSpeedをまとめて取得します。
    response: [/speedProfile]
    changes:
      - {version: "2.2.0", en: "The acceleration and deceleration are reported about 4.9% smaller than before; they now match the datasheet (driver libraries v1.2.0).", ja: ""}

  - address: /setFullstepSpeed
    group: speed_profile
    args:
      - use: motorID
      - name: fullstepSpeed
        type: float
        range: [7.63, 15625]
        unit: step/s
        setting: speedProfile.fullStepSpeed
        description: {en: threshold, ja: 切り替わる閾値}
    timing: always
    description:
      en: |-
        Sets the threshold at which the microstepping mode automatically switches to full-step mode.

        A value above the range is limited to 15625 step/s by the driver library. A value from 0 up to the lower end of the range is written as the lower end (7.63 step/s). A negative value below about -7.6 is not limited to the lower end: the driver library converts it to a huge unsigned number and limits that to the maximum, so it becomes 15625 step/s.
      ja: マイクロステッピングモードが自動でフルステップモードに切り替わる閾値を設定します。
    see_also: [/getFullstepSpeed]

  - address: /getFullstepSpeed
    group: speed_profile
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the threshold at which the microstepping mode automatically switches to full-step mode.
      ja: マイクロステッピングモードが自動でフルステップモードに切り替わる閾値を取得します。
    response: [/fullstepSpeed]

  - address: /setMaxSpeed
    group: speed_profile
    args:
      - use: motorID
      - name: maxSpeed
        type: float
        range: [15.25, 15610]
        unit: step/s
        setting: speedProfile.maxSpeed
        description: {en: maximum speed, ja: 最大速さ}
    timing: always
    description:
      en: |-
        Set the maximum speed of the speed profile

        A value outside the range is limited by the driver library. On STEP400, a maximum speed of 0 is written as 1 (the register value 0 is reserved).
      ja: スピードプロファイルの最大速さを設定します。
    changes:
      - {version: "2.2.0", en: "STEP400: a maximum speed of 0 is written as 1 (the register value 0 is reserved). STEP800 is unchanged.", ja: ""}
    see_also: [/setSpeedProfile]

  - address: /setAcc
    group: speed_profile
    args:
      - use: motorID
      - name: acc
        type: float
        range: [14.55, 59575]
        unit: step/s/s
        setting: speedProfile.acc
        description: {en: acceleration, ja: 加速度}
    timing: stopped
    description:
      en: |-
        Sets the acceleration of the speed profile.

        The value is rounded to the nearest register value, so the written value can differ by 1 LSB. A value outside the range is limited by the driver library.

        The motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value.
      ja: スピードプロファイルの加速度を設定します。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: ""}
      - {version: "2.2.0", en: "Rounds to the nearest register value, so the written value can differ by 1 LSB.", ja: ""}
    see_also: [/setSpeedProfile]

  - address: /setDec
    group: speed_profile
    args:
      - use: motorID
      - name: dec
        type: float
        range: {STEP400: [14.55, 59590], STEP800: [14.55, 59575]}
        unit: step/s/s
        setting: speedProfile.dec
        description: {en: deceleration, ja: 減速度}
    timing: stopped
    description:
      en: |-
        Sets the deceleration of the speed profile.

        The value is rounded to the nearest register value, so the written value can differ by 1 LSB. A value outside the range is limited by the driver library.

        The motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value.
      ja: スピードプロファイルの減速度 (deceleration) を設定します。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: ""}
      - {version: "2.2.0", en: "Rounds to the nearest register value, so the written value can differ by 1 LSB.", ja: ""}
    see_also: [/setSpeedProfile]

  - address: /setMinSpeed
    group: speed_profile
    args:
      - use: motorID
      - name: minSpeed
        type: float
        range: [0.0, 976.3]
        unit: step/s
        setting: speedProfile.minSpeed
        description: {en: Minimum speed, ja: 最小速さ}
    timing: stopped
    description:
      en: |-
        Set the speed profile minimum speed. This value is also used for the motor speed of [[/releaseSw]]. When Low speed optimization ([[/enableLowSpeedOptimize]]) is enabled, the minimum speed of the speed profile is set to zero.

        While the low speed optimization is disabled, the motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value. While it is enabled, only the saved value changes and no error is sent.

        A value above the range is limited to 976.3 step/s by the driver library. A negative value below about -0.24 is not limited to 0: the driver library converts it to a huge unsigned number and limits that to the maximum, so it becomes 976.3 step/s.
      ja: スピードプロファイルの最小速さを設定します。この値は[[/releaseSw]]時のモータ回転速さにも使用されます。Low speed optimization ([[/enableLowSpeedOptimize]])が有効になっている場合、 minSpeedは強制的に0になります。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "While the low speed optimization is disabled, the motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: ""}
      - {version: "2.2.0", en: "`/setMinSpeed 255` (all motors) checks the low speed optimization setting of each motor. It read an invalid array element.", ja: ""}
    see_also: [/getMinSpeed]

  - address: /getMinSpeed
    group: speed_profile
    args: [{use: motorID}]
    timing: always
    description:
      en: |-
        Return the speed profile minimum speed.

        Returns 0.0 for a motor with the low speed optimization enabled: the MIN_SPEED register then holds the optimization threshold (read it with [[/getLowSpeedOptimizeThreshold]]) and the actual minimum speed is 0. For a motor with the optimization disabled, it returns the MIN_SPEED register value of the driver in step/s.
      ja: スピードプロファイルの最小速さを返します。
    response: [/minSpeed]
    changes:
      - {version: "2.2.0", en: "Returns 0.0 for a motor with the low speed optimization enabled. A single motor returned the MIN_SPEED register value (the threshold) and `255` (all motors) returned the stored minimum speed setting; both behave the same now.", ja: ""}

  - address: /getSpeed
    group: speed_profile
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the current motor speed.
      ja: モータの現在の速度を返します。
    response: [/speed]

  - address: /setSpeedProfileRaw
    group: speed_profile
    args:
      - use: motorID
      - name: acc
        type: int
        range: [0, 4095]
        description: {en: acceleration (raw register value), ja: ""}
      - name: dec
        type: int
        range: [0, 4095]
        description: {en: deceleration (raw register value), ja: ""}
      - name: maxSpeed
        type: int
        range: [0, 1023]
        description: {en: maximum speed (raw register value), ja: ""}
    timing: stopped
    description:
      en: |-
        Sets the acc, dec, and maxSpeed of the speed profile using raw driver IC register values.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver. The motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value.
      ja: ""
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "Also sets the acceleration, deceleration and maximum speed setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: ""}
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: ""}
    see_also: [/getSpeedProfileRaw, /setSpeedProfile]

  - address: /getSpeedProfileRaw
    group: speed_profile
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the acc, dec, and maxSpeed of the speed profile as raw driver IC register values.
      ja: ""
    response: [/speedProfileRaw]

  - address: /setMaxSpeedRaw
    group: speed_profile
    args:
      - use: motorID
      - name: maxSpeed
        type: int
        range: [0, 1023]
        description: {en: maximum speed (raw register value), ja: ""}
    timing: always
    description:
      en: |-
        Sets the maximum speed of the speed profile using a raw register value.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver.

        `/setMaxSpeedRaw 0` writes 0, also on STEP400.
      ja: ""
    changes:
      - {version: "2.2.0", en: "Also sets the maximum speed setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: ""}
    see_also: [/setMaxSpeed]

  - address: /setMinSpeedRaw
    group: speed_profile
    args:
      - use: motorID
      - name: minSpeed
        type: int
        range: [0, 4095]
        description: {en: minimum speed (raw register value), ja: ""}
    timing: stopped
    description:
      en: |-
        Sets the minimum speed of the speed profile using a raw register value.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver. While the low speed optimization is disabled, the motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value. While it is enabled, only the saved value changes and no error is sent.
      ja: ""
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "Also sets the minimum speed setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: ""}
      - {version: "2.2.0", en: "While the low speed optimization is disabled, the motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: ""}
      - {version: "2.2.0", en: "Bit 12 is ignored (it switched the low speed optimization on without [[/enableLowSpeedOptimize]]). While the optimization is on, the command only changes the saved value, as [[/setMinSpeed]] does.", ja: ""}
    see_also: [/setMinSpeed]

  - address: /setFullstepSpeedRaw
    group: speed_profile
    args:
      - use: motorID
      - name: fullstepSpeed
        type: int
        range: [0, 1023]
        description: {en: full-step speed threshold (raw register value), ja: ""}
    timing: always
    description:
      en: |-
        Sets the full-step speed threshold using a raw register value.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver.
      ja: ""
    changes:
      - {version: "2.2.0", en: "Also sets the full-step speed setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: ""}
    see_also: [/setFullstepSpeed]

  - address: /setAccRaw
    group: speed_profile
    args:
      - use: motorID
      - name: acc
        type: int
        range: [0, 4095]
        description: {en: acceleration (raw register value), ja: ""}
    timing: stopped
    description:
      en: |-
        Sets the acceleration of the speed profile using a raw register value.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver. The motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value.
      ja: ""
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "Also sets the acceleration setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: ""}
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: ""}
    see_also: [/setAcc]

  - address: /setDecRaw
    group: speed_profile
    args:
      - use: motorID
      - name: dec
        type: int
        range: [0, 4095]
        description: {en: deceleration (raw register value), ja: ""}
    timing: stopped
    description:
      en: |-
        Sets the deceleration of the speed profile using a raw register value.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver. The motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value.
      ja: ""
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "Also sets the deceleration setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: ""}
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: ""}
    see_also: [/setDec]

  # ---------------------------------------------------------------------------
  # homing
  # ---------------------------------------------------------------------------
  - address: /homing
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Start the homing movement. Move towards origin direction, stop when the HOME switch is activated. Then the motor reverses the direction and move slowly, halts when the HOME sensor is not active anymore, then reset location to zero at the current point.

        This is equivalent to the following actions of executing [[/goUntil]] command, and after the motor stops on HOME sensor activation, execute [[/releaseSw]] command.

        The `homingDirection` and the `homingSpeed` can be set by [[/setHomingDirection]] and [[/setHomingSpeed]] commands, as well as configuring from the configuration tool.

        Time-out can be set for each of the `/goUntil` and `/releaseSw` commands. The controller halts the motor movement if the sensor state has not changed during this time frame. The time-out values can be set from [[/setGoUntilTimeout]] and from the [[/setReleaseSwTimeout]] command.

        Depending on the state change on the homing movement, following response will be sent.
      ja: |
        原点復帰動作を行います。原点復帰方向に移動し、HOMEセンサが反応すると停止し、方向を反転してゆっくり移動し、HOMEセンサが反応しなくなった時点で停止し、現在位置を0にします。

        これは[[/goUntil]]コマンドを実行し、HOMEセンサが反応すると停止して[[/releaseSw]]コマンドを実行することに相当します。

        原点復帰方向`homingDirection`と原点復帰スピード`homingSpeed`はそれぞれ[[/setHomingDirection]]と[[/setHomingSpeed]]で設定できるほか、configToolからも設定できます。

        `/goUntil`と`/releaseSw`それぞれにタイムアウト時間が設定可能で、この時間内にセンサ状態に変化がなかった場合はタイムアウトとして動作を中止します。この時間はぞれぞれ[[/setGoUntilTimeout]] [[/setReleaseSwTimeout]]で設定できます。

        原点復帰動作の状態変化に応じて下記の返答があります。
    response: [/homingStatus]
    errors: [CommandIgnored, BrakeEngaged, GoUntilTimeout, ReleaseSwTimeout, InServoMode]
    changes:
      - {version: "2.2.0", en: "While the brake is engaged, releasing or engaging (not while stopping or after `/free`), replies `/error/command BrakeEngaged` and does nothing. Before, it set the homing state although it did not start.", ja: ""}
      - {version: "2.2.0", en: "The homing no longer often ends with `/homingStatus` 4 and `ReleaseSwTimeout` about 1 ms after the switch was found, instead of 3 (a timing error of the timeout check; it happened in almost every homing or almost never, depending on the start-up).", ja: ""}
    see_also: [/getHomingStatus]

  - address: /getHomingStatus
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns current state of homing movement.
      ja: 原点復帰の現在のステータスを返します。
    response: [/homingStatus]

  - address: /setHomingDirection
    group: homing
    args:
      - use: motorID
      - name: direction
        type: bool
        setting: driverSettings.homingDirection
        values:
          - {value: 1, en: Forward, ja: Forward}
          - {value: 0, en: Reverse, ja: Reverse}
    timing: always
    description:
      en: Sets the `homingDirection` for the [[/homing]] command. It can be also configured from the configuration tool.
      ja: "[[/homing]]実行時の原点復帰方向`homingDirection`を指定します。configToolからも指定できます。"
    see_also: [/getHomingDirection]

  - address: /getHomingDirection
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns `homingDirection` parameter.
      ja: "`homingDirection`を取得します。"
    response: [/homingDirection]

  - address: /setHomingSpeed
    group: homing
    args:
      - use: motorID
      - name: speed
        type: float
        range: [0.0, 15610.0]
        unit: step/s
        setting: driverSettings.homingSpeed
        description: {en: homingSpeed, ja: homingSpeed}
    timing: always
    description:
      en: |-
        Sets the `homingSpeed` when executing the command [[/homing]]. It can be configured from the configuration tool.

        A value outside the range is not rejected: it is limited to 0-15610.
      ja: |-
        [[/homing]]実行時の原点復帰速さ`homingSpeed`を指定します。configToolからも指定できます。
    see_also: [/getHomingSpeed]

  - address: /getHomingSpeed
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns `homingSpeed` parameter.
      ja: "`homingSpeed`を取得します。"
    response: [/homingSpeed]

  - address: /goUntil
    group: homing
    args:
      - use: motorID
      - name: ACT
        type: bool
        values:
          - {value: 0, en: Reset the ABS_POS register, ja: ABS_POSレジスタをリセットします}
          - {value: 1, en: Copy the value of the ABS_POS register to the MARK register, ja: ABS_POSレジスタの内容をMARKレジスタにコピーします}
      - name: speed
        type: float
        range: [-15625, 15625]
        unit: step/s
    timing: always
    description:
      en: |
        Move the motor at specified speed and direction. When the HOME switch turns on (the HOME switch terminal is closed), process ABS_POS register according to the ACT value.
        The motor will softStop afterwards, but if the SW_MODE is set to 0 in the [[/setHomeSwMode]] command, it will be a hardStop instead. This command will keep the motor to the BUSY state until it stops.

        The sign of the speed is the direction. A speed whose absolute value is above the range is limited to the largest register value (0xFFFFF, about 15625 step/s) by the driver library.
      ja: |
        指定の速度で回転し、HOMEスイッチ端子が閉状態になるとACTの値に応じた処理を行います。
        その後softStopしますが、[[/setHomeSwMode]]コマンドでSW_MODEが0に設定されていると、softStopではなくhardStopになります。このコマンドは、モータが停止するまでBUSY状態を保ちます。
    errors: [BrakeEngaged, GoUntilTimeout, HomeSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "An activated home switch is reported as `/error/command HomeSwActivating`, the text in the error list. It was sent as `HomeSwActivated`. It now follows [[/reportError]] like the other command errors.", ja: ""}
      - {version: "2.2.0", en: "For a motor in the servo mode, replies `/error/command InServoMode` and does nothing. Before, the command was sent to the driver. With 255, only the motors in the servo mode reply the error; the others execute the command.", ja: ""}
    see_also: [/setGoUntilTimeout, /releaseSw, /goUntilRaw]

  - address: /setGoUntilTimeout
    group: homing
    args:
      - use: motorID
      - name: timeOut
        type: int
        range: [0, 2147483647]
        unit: ms
        setting: driverSettings.goUntilTimeout
        description: {en: Time-out duration, ja: タイムアウト時間}
    timing: always
    description:
      en: |-
        Sets the time-out duration when executing [[/goUntil]] command. If the sensor did not detect during this time frame, the controller will regard time-out and halts the movement. Specify 0 to disable the timeout. It can also be configured from the configuration tool.

        A negative value replies `CommandIgnored` and nothing is applied. The maximum is 2147483647. The automatic hard stop at the timeout is not sent to a motor whose driver is HiZ (the timeout error is still sent).
      ja: |-
        [[/goUntil]]実行時のタイムアウト時間を指定します。この時間内にセンサに反応がなかった場合にはtimeoutとして動作を中止します。0を指定するとタイムアウトが無効になります。configToolからも指定できます。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A negative value replies `/error/command CommandIgnored` and nothing is applied. Before, it became about 49 days.", ja: ""}
      - {version: "2.2.0", en: "The hard stop at the timeout is not sent to a motor whose driver is HiZ, also with the brake disabled (a hard stop energizes a HiZ driver). The timeout error is still sent.", ja: ""}
    see_also: [/getGoUntilTimeout]

  - address: /getGoUntilTimeout
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the time-out duration when executing [[/goUntil]] command.
      ja: "[[/goUntil]]実行時のタイムアウト時間を取得します。"
    response: [/goUntilTimeout]

  - address: /releaseSw
    group: homing
    args:
      - use: motorID
      - name: ACT
        type: bool
        values:
          - {value: 0, en: Reset the ABS_POS register, ja: ABS_POSレジスタをリセットします}
          - {value: 1, en: Copy the value of the ABS_POS register to the MARK register, ja: ABS_POSレジスタの内容をMARKレジスタにコピーします}
      - name: DIR
        type: bool
        values:
          - {value: 1, en: Forward, ja: 正転方向}
          - {value: 0, en: Reverse, ja: 逆転方向}
    timing: always
    description:
      en: Move at minimum speed (5[step/s] by default) in the specified direction until the HOME switch pin becomes open. Then it will process the ABS_POS register according to the value of ACT. The process of the ACT is same as the [[/goUntil]] command. Then halt the motor with hardStop.
      ja: 指定方向にminimum speed（初期状態では5[step/s]）で回転し、HOMEスイッチ端子が開状態になると、ACTの値に応じた処理を行います。ACTの処理内容は [[/goUntil]]と同じです。その後hardStopします。
    errors: [BrakeEngaged, ReleaseSwTimeout, InServoMode]
    changes:
      - {version: "2.2.0", en: "`ACT` is read like the other boolean arguments (a number of 1.0 or more, or a positive integer, is true). It was read as an integer, so 0.5 was 0.", ja: ""}
      - {version: "2.2.0", en: "For a motor in the servo mode, replies `/error/command InServoMode` and does nothing. Before, the command was sent to the driver. With 255, only the motors in the servo mode reply the error; the others execute the command.", ja: ""}
    see_also: [/setReleaseSwTimeout, /setMinSpeed]

  - address: /setReleaseSwTimeout
    group: homing
    args:
      - use: motorID
      - name: timeOut
        type: int
        range: [0, 2147483647]
        unit: ms
        setting: driverSettings.releaseSwTimeout
        description: {en: Time-out duration, ja: タイムアウト時間}
    timing: always
    description:
      en: |-
        Sets the time-out duration when executing [[/releaseSw]] command. If the sensor cannot be released during this time frame, halt the movement as time-out. Specify 0 to disable the timeout. It can be configured from the configuration tool.

        A negative value replies `CommandIgnored` and nothing is applied. The maximum is 2147483647. The automatic hard stop at the timeout is not sent to a motor whose driver is HiZ (the timeout error is still sent).
      ja: |-
        [[/releaseSw]]実行時のタイムアウト時間を指定します。この時間内にセンサ反応範囲から脱出できかった場合にはtimeoutとして動作を中止します。0を指定するとタイムアウトが無効になります。configToolからも指定できます。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A negative value replies `/error/command CommandIgnored` and nothing is applied. Before, it became about 49 days.", ja: ""}
      - {version: "2.2.0", en: "The hard stop at the timeout is not sent to a motor whose driver is HiZ, also with the brake disabled (a hard stop energizes a HiZ driver). The timeout error is still sent.", ja: ""}
    see_also: [/getReleaseSwTimeout]

  - address: /getReleaseSwTimeout
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the time-out duration when executing [[/releaseSw]] command.
      ja: "[[/releaseSw]]実行時のタイムアウト時間を取得します。"
    response: [/releaseSwTimeout]

  # ---------------------------------------------------------------------------
  # sensors
  # ---------------------------------------------------------------------------
  - address: /enableHomeSwReport
    group: sensors
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportHomeSwStatus}
    timing: always
    description:
      en: Sets the following message to be sent automatically when conditional change of the HOME switch of the specified motor is detected. The response message is same as [[/getHomeSw]] command.
      ja: 指定したモータのHOMEスイッチ端子の状態に変化があったら自動でメッセージを送信する設定を行います。送信されるメッセージは[[/getHomeSw]]の返答と同じです。
    notifies: [/homeSw]

  - address: /enableSwEventReport
    group: sensors
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportSwEvn}
    timing: always
    description:
      en: |
        Sets the following message to be sent automatically when the specified motor's HOME switch terminal state drops from HIGH level to LOW (Falling Edge).
        While the [[/enableHomeSwReport]] command observes the status by polling the STATUS register of motor driver IC from microcomputer's firmware, this `/enableSwEventReport` detects the event by driver IC's hardware, able to pick up the sensor detection shorter than 1ms.
      ja: |
        指定したモータのHOMEスイッチ端子の状態がHIGHレベルからLOWレベルに遷移した際(Falling Edge)に自動でメッセージを送信する設定を行います。
        [[/enableHomeSwReport]]はマイコンのファームウェア上から約1ms毎にモータドライバICのSTATUSレジスタをポーリングすることによって状態を監視していますが、この`/enableSwEventReport`のほうはドライバIC内でハードウェアによってイベントが検出されるため、1ms以下のごくわずかな時間だけセンサが反応した場合でももとり逃しません。
    notifies: [/swEvent]

  - address: /getHomeSw
    group: sensors
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the status of the HOME switch, closed or opened.
      ja: HOMEスイッチの状態を取得します。
    response: [/homeSw]

  - address: /enableLimitSwReport
    group: sensors
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportLimitSwStatus}
    boards: [STEP400]
    timing: always
    description:
      en: Sets automatic response when conditional change on the specified motor's LIMIT switch terminal is detected. The sent message is as same as the response from [[/getLimitSw]] command.
      ja: 指定したモータのLIMITスイッチ端子の状態に変化があったら自動でメッセージを送信する設定を行います。送信されるメッセージは[[/getLimitSw]]の返答と同じです。
    notifies: [/limitSw]

  - address: /getLimitSw
    group: sensors
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: Returns the status of LIMIT switch.
      ja: LIMITスイッチの状態を取得します。
    response: [/limitSw]

  - address: /setHomeSwMode
    group: sensors
    args:
      - use: motorID
      - name: SW_MODE
        type: bool
        setting: driverSettings.homeSwMode
        values:
          - {value: 0, en: HardStop interrupt (stop immediately), ja: HardStop interrupt （即時停止する）}
          - {value: 1, en: User disposal (not stop), ja: User disposal （停止しない）}
        description: {en: Switch mode, ja: Switch mode}
    timing: hiz
    description:
      en: |-
        Sets switch mode whether to stop immediately when the HOME switch terminal state changes (falling edge).

        The outputs must be HiZ; otherwise `MotorNotHiZ` is replied and nothing is applied.
      ja: HOMEスイッチ端子に入力があった際に即時停止するかどうか(Switch mode)を指定します。
    errors: [MotorNotHiZ]
    changes:
      - {version: "2.2.0", en: "The outputs must be HiZ (SW_MODE of the CONFIG register is writable only in HiZ); otherwise `/error/command MotorNotHiZ` and nothing is applied.", ja: ""}
    see_also: [/getHomeSwMode]

  - address: /getHomeSwMode
    group: sensors
    args: [{use: motorID}]
    timing: always
    description:
      en: Get the Switch mode described above.
      ja: 上記のSwitch modeを取得します。
    response: [/homeSwMode]
    see_also: [/setHomeSwMode]

  - address: /setLimitSwMode
    group: sensors
    args:
      - use: motorID
      - name: SW_MODE
        type: bool
        setting: driverSettings.limitSwMode
        values:
          - {value: 0, en: HardStop interrupt (Immediate stop), ja: HardStop interrupt （即時停止する）}
          - {value: 1, en: User disposal (Does not stop), ja: User disposal （停止しない）}
        description: {en: Switch mode, ja: Switch mode}
    boards: [STEP400]
    timing: always
    description:
      en: Sets the Switch mode whether to stop the motor immediately when the LIMIT switch terminal condition is changed.
      ja: LIMITスイッチ端子に入力があった際に即時停止するかどうか(Switch mode)を指定します。
    changes:
      - {version: "2.2.0", en: "The automatic hard stop at the limit switch (`SW_HARD_STOP`) is not sent to a motor whose driver is HiZ, also with the brake disabled (a hard stop energizes a HiZ driver).", ja: ""}
    see_also: [/getLimitSwMode]

  - address: /getLimitSwMode
    group: sensors
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: Get the Switch mode described above.
      ja: 上記のSwitch modeを取得します。
    response: [/limitSwMode]
    see_also: [/setLimitSwMode]

  # ---------------------------------------------------------------------------
  # position
  # ---------------------------------------------------------------------------
  - address: /setPosition
    group: position
    args:
      - use: motorID
      - name: newPosition
        type: int
        range: [-2097152, 2097151]
        description: {en: specified coordinates, ja: 指定座標}
    timing: stopped
    description:
      en: |-
        Rewrites ABS_POS register to the specified coordinates. The current motor position is set to the specified coordinates.

        Do not use it while the motor is running or in the servo mode. There is no guard: if the driver refuses the write, `CommandIgnored` is sent.

        A value outside the range is not rejected: the driver truncates it to 22 bits.
      ja: ABS_POSレジスタを指定座標に書き換えます。現在のモータ位置が指定座標になります。
    errors: [CommandIgnored]
    see_also: [/getPosition, /resetPos]

  - address: /getPosition
    group: position
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Returns the contents of the ABS_POS register (current position).
        [[/setPositionReportInterval]] can make the controller to send this message with a specified interval.
      ja: |
        ABS_POSレジスタの内容（現在位置）を取得します。

        [[/setPositionReportInterval]] コマンドで、指定間隔で自動送信させることもできます。
    response: [/position]

  - address: /getPositionList
    group: position
    timing: always
    description:
      en: |
        Returns the current position of all motors at once. `/getPosition 255` returns individual messages for each motor but this command returns single message with a position list.
        [[/setPositionListReportInterval]] can make the controller to send this list with a specified interval.
      ja: |
        全モータの現在位置 (`ABS_POS`) を取得します。 `/getPosition 255` を送信した場合は、モータの軸数分の個別のメッセージが返されますが、このコマンドは、すべてのモータの位置をリストにまとめた1個のメッセージが返されます。

        [[/setPositionListReportInterval]] コマンドで、指定間隔で自動送信させることもできます。
    response: [/positionList]
    see_also: [/getPosition]

  - address: /resetPos
    group: position
    args: [{use: motorID}]
    timing: always
    description:
      en: |-
        Reset ABS_POS register to 0.

        Do not use it while the motor is running or in the servo mode. There is no guard: if the driver refuses the write, `CommandIgnored` is sent.
      ja: ABS_POSレジスタを0にリセットします。
    errors: [CommandIgnored]
    see_also: [/setPosition]

  - address: /setElPos
    group: position
    args:
      - use: motorID
      - name: newFullstep
        type: int
        range: [0, 3]
        description: {en: Fullstep position, ja: フルステップでの位置}
      - name: newMicrostep
        type: int
        range: [0, 127]
        description: {en: Microstep position, ja: マイクロステップでの位置}
    timing: stopped
    description:
      en: |-
        Set the electrical position of the motor. The microstep is expressed in step/128, and the value has to be matched with the current microstep mode.

        Use it while the motor is HiZ. There is no guard on the motor state: the L6470 also refuses the write while the motor is stopped and energized (which the datasheet allows), and then `CommandIgnored` is sent.

        A full step outside 0-3 or a microstep outside 0-127 replies `CommandIgnored` and nothing is applied.
      ja: モータの電気的位置(electrical postion)を設定します。マイクロステップは0-127の128段階で表現されていますので、設定時は現在のマイクロステップと齟齬のない値を設定する必要があります。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A full step outside 0-3 or a microstep outside 0-127 replies `/error/command CommandIgnored` and nothing is applied. Before, they were clamped.", ja: ""}
    see_also: [/getElPos]

  - address: /getElPos
    group: position
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the current electrical position of the motor.
      ja: モータの電気的位置 (electrical postion)を取得します。
    response: [/elPos]

  - address: /setMark
    group: position
    args:
      - use: motorID
      - name: MARK
        type: int
        description: {en: Coordination to be set, ja: 設定する座標}
    timing: always
    description:
      en: |-
        Set the MARK register to arbitrary position.

        A value outside the range is not rejected: the driver truncates it to 22 bits.
      ja: markを任意の位置に設定します。
    see_also: [/getMark, /goMark]

  - address: /getMark
    group: position
    args: [{use: motorID}]
    timing: always
    description:
      en: Get the MARK position.
      ja: MARKの位置を取得します。
    response: [/mark]

  - address: /goHome
    group: position
    args: [{use: motorID}]
    timing: motion_start
    description:
      en: Move the motor to the HOME position (zero position) according to the speed profile.
      ja: HOME位置までスピードプロファイルに従って移動します。
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "Judges its direction correctly when the home switch or the limit switch prohibits a motion ([[/setProhibitMotionOnHomeSw]], [[/setProhibitMotionOnLimitSw]]): it is the sign of the 22-bit difference to the target, the way the driver goes (the shortest way). The direction was reversed for a target less than 2048 steps away (so a short move away from the switch was refused with `HomeSwActivating` / `LimitSwActivating` and a short move towards it was started), and wrong again beyond 2^21 steps.", ja: ""}
      - {version: "2.2.0", en: "On a busy motor, the STATUS register is read with GetParam, which does not clear the latched warning flags. Before, it was read with GetStatus, so the status poll could miss a flag and the report (`/overCurrent`, `/stall`, `/swEvent`, `/uvlo`, ...) was lost.", ja: ""}

  - address: /goMark
    group: position
    args: [{use: motorID}]
    timing: motion_start
    description:
      en: Move the motor to the MARK position according to the speed profile.
      ja: MARK位置までスピードプロファイルに従って移動します。
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "Judges its direction correctly when the home switch or the limit switch prohibits a motion ([[/setProhibitMotionOnHomeSw]], [[/setProhibitMotionOnLimitSw]]): it is the sign of the 22-bit difference to the target, the way the driver goes (the shortest way). The direction was reversed for a target less than 2048 steps away (so a short move away from the switch was refused with `HomeSwActivating` / `LimitSwActivating` and a short move towards it was started), and wrong again beyond 2^21 steps.", ja: ""}
      - {version: "2.2.0", en: "On a busy motor, the STATUS register is read with GetParam, which does not clear the latched warning flags. Before, it was read with GetStatus, so the status poll could miss a flag and the report (`/overCurrent`, `/stall`, `/swEvent`, `/uvlo`, ...) was lost.", ja: ""}
    see_also: [/setMark]

  # ---------------------------------------------------------------------------
  # motion
  # ---------------------------------------------------------------------------
  - address: /run
    group: motion
    args:
      - use: motorID
      - name: speed
        type: float
        range: [-15625, 15625]
        unit: step/s
        description: {en: Rotation speed, ja: 回転速度}
    timing: motion_start
    description:
      en: |-
        Rotates the motor at specified speed. The acceleration is controlled with the pre-set speed profile. The speed is limited by maxSpeed. It remains in the BUSY state until the motor reaches the specified speed.

        The sign of the speed is the direction. A speed whose absolute value is above the range is limited to the largest register value (0xFFFFF, about 15625 step/s) by the driver library.
      ja: モータを指定速度で回転させます。事前に設定したスピードプロファイルの加速度に従って加速します。指定する回転速さは、maxSpeedを超えるとmaxSpeedでリミットされます。指定速度に到達するまではBUSY状態になります。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/runRaw, /combine/run]

  - address: /move
    group: motion
    args:
      - use: motorID
      - name: step
        type: int
        description: {en: Moving step counts, ja: 移動ステップ数}
    timing: [stopped, motion_start]
    description:
      en: |-
        Moves specified number of steps according to the pre-set speed profile. It remains in the BUSY state until it reaches the specified step count. This command can only execute when the motor is stopped.

        A step count whose absolute value is above 4,194,303 (22 bits) is not rejected: it is limited to 4,194,303 by the driver library.
      ja: 事前に設定したスピードプロファイルに従って、指定ステップ数移動します。指定ステップ数を移動し終わるまではBUSY状態になります。このコマンドはモータが停止していないと実行できません。
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/combine/move]

  - address: /goTo
    group: motion
    args:
      - use: motorID
      - name: position
        type: int
        range: [-2097152, 2097151]
        description: {en: Destination, ja: 目標位置}
    timing: motion_start
    description:
      en: |
        Moves to the specified position in the shortest route according to the pre-set speed profile. Remains in the BUSY state until it finishes moving to the specified position.
        Inside the driver, -2,097,152 and 2,097,151 are located next to each other in a loop.

        A position outside the range is not rejected. A position above 4,194,303 is limited to 4,194,303 by the driver library, which the driver reads as -1. Any other position is cut to its lower 22 bits and read as a signed number: 2,097,152 becomes -2,097,152 and -2,097,153 becomes 2,097,151.
      ja: |
        事前に設定したスピードプロファイルにしたがって、指定位置まで最短経路で移動します。指定位置まで移動し終わるまではBUSY状態になります。

        ※ドライバ内部では -2,097,152 と 2,097,151 は1周して隣り合った位置になっています。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "Judges its direction correctly when the home switch or the limit switch prohibits a motion ([[/setProhibitMotionOnHomeSw]], [[/setProhibitMotionOnLimitSw]]): it is the sign of the 22-bit difference to the target, the way the driver goes (the shortest way). The direction was reversed for a target less than 2048 steps away (so a short move away from the switch was refused with `HomeSwActivating` / `LimitSwActivating` and a short move towards it was started), and wrong again beyond 2^21 steps.", ja: ""}
      - {version: "2.2.0", en: "On a busy motor, the STATUS register is read with GetParam, which does not clear the latched warning flags. Before, it was read with GetStatus, so the status poll could miss a flag and the report (`/overCurrent`, `/stall`, `/swEvent`, `/uvlo`, ...) was lost.", ja: ""}
    see_also: [/goToDir, /combine/goTo]

  - address: /goToDir
    group: motion
    args:
      - use: motorID
      - name: DIR
        type: bool
        description: {en: "", ja: 回転方向}
      - name: position
        type: int
        range: [-2097152, 2097151]
        description: {en: Destination, ja: 目標位置}
    timing: motion_start
    description:
      en: |-
        Moves to the specified position in the specified direction according to the pre-set speed profile. Remains in the BUSY state until it finishes moving to the specified position.

        A position outside the range is not rejected. A position above 4,194,303 is limited to 4,194,303 by the driver library, which the driver reads as -1. Any other position is cut to its lower 22 bits and read as a signed number: 2,097,152 becomes -2,097,152 and -2,097,153 becomes 2,097,151.
      ja: 事前に設定したスピードプロファイルにしたがって、指定位置まで指定方向で移動します。指定位置まで移動し終わるまではBUSY状態になります。
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "On a busy motor, the STATUS register is read with GetParam, which does not clear the latched warning flags. Before, it was read with GetStatus, so the status poll could miss a flag and the report (`/overCurrent`, `/stall`, `/swEvent`, `/uvlo`, ...) was lost.", ja: ""}
    see_also: [/goTo, /combine/goToDir]

  - address: /softStop
    group: motion
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        After decelerating according to the speed profile, the motor stops while it is kept excited. Remains in the BUSY state until the motor stops. If it was originally in the High Z state, the motor will be excited while it keeps its position.
        If it was in the servo mode, the mode will be released.

        With the electromagnetic brake enabled, the command does nothing while the brake is engaged or after [[/free]] (the motor is HiZ).
      ja: |
        スピードプロファイルに従って減速したのち、モータを励磁したまま停止します。モータが停止するまではBUSY状態になります。もともとHiZ状態だった場合は、停止したままモータが励磁します。

        サーボモードだった場合は解除されます。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "With the brake enabled, does nothing while the brake is engaged or after `/free` (motor HiZ). Before, it energized the motor and left the brake state engaged, so `/activate 0` and `/hardHiZ` could not make the motor HiZ again.", ja: ""}
      - {version: "2.2.0", en: "Cancels pending motion, also for a motor with the brake disabled: a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: ""}
    see_also: [/combine/softStop]

  - address: /hardStop
    group: motion
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Immediately stops the motor and leaves it excited. Remains in the BUSY state until the motor stops. If it was originally in the High Z state, the motor is excited while it keeps its position.
        If it was in the servo mode, the mode will be released.

        With the electromagnetic brake enabled, the command does nothing while the brake is engaged or after [[/free]] (the motor is HiZ).
      ja: |
        モータを即時停止し、励磁したままにします。モータが停止するまではBUSY状態になります。もともとHiZ状態だった場合は、停止したままモータが励磁します。

        サーボモードだった場合は解除されます。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "With the brake enabled, does nothing while the brake is engaged or after `/free` (motor HiZ). Before, it energized the motor and left the brake state engaged, so `/activate 0` and `/hardHiZ` could not make the motor HiZ again.", ja: ""}
      - {version: "2.2.0", en: "Cancels pending motion, also for a motor with the brake disabled: a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: ""}
    see_also: [/combine/hardStop]

  - address: /softHiZ
    group: motion
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Decelerate according to the speed profile, then stop the motor and release excitation. When the excitation is released, it goes into the High Z state. It remains in the BUSY state until the motor is stopped.
        If it was in the servo mode, it will be released.
        if electromagnetic brake mode is enabled, the controller puts the brake into hold state, and then transits to High Z state.
      ja: |
        スピードプロファイルに従って減速したのち、モータを停止して励磁を解除します。励磁が解除されるとHiZ状態になります。モータが停止するまではBUSY状態になります。

        サーボモードだった場合は解除されます。

        電磁ブレーキモードが有効になっている場合は、電磁ブレーキを保持状態にしてからHiZ状態に移行します。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "With the brake enabled, on a stopped motor the brake is engaged at the next status read (up to 5 ms later). The stop is judged on a status read after the command.", ja: ""}
      - {version: "2.2.0", en: "A motion command (`/run`, `/move`, `/goTo`, ...) or `/activate 1` during the deceleration cancels the engaging; the brake stays released. Before, the brake engaged when the motor stopped later.", ja: ""}
      - {version: "2.2.0", en: "After `/free`, the brake is engaged at once (the motor is already HiZ).", ja: ""}
      - {version: "2.2.0", en: "Cancels pending motion, also for a motor with the brake disabled: a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: ""}
    see_also: [/combine/softHiZ, /enableElectromagnetBrake]

  - address: /hardHiZ
    group: motion
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Immediately stops the motor and releases the stepper excitation. When the motor excitation is released, it goes into the High Z state. Remains in the BUSY state until the motor is stopped.
        If it was in the servo mode, it will be released.
        if electromagnetic brake mode is enabled, the controller puts the brake into hold state, and then transits to High Z state.
      ja: |
        モータを即時停止し、励磁を解除します。励磁が解除されるとHiZ状態になります。モータが停止するまではBUSY状態になります。

        サーボモードだった場合は解除されます。

        電磁ブレーキモードが有効になっている場合は、電磁ブレーキを保持状態にしてからHiZ状態に移行します。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "A single motor no longer sends a soft stop before the hard HiZ; a single motor, all motors (255) and `/combine/hardHiZ` behave the same. With the brake enabled and released (after `/activate 1`), the motor is stopped with a hard stop (still energized) before the brake is engaged, so it does not keep running during the brake transition time. While the brake is engaged or engaging, the command does nothing as before.", ja: ""}
      - {version: "2.2.0", en: "After `/free`, the brake is engaged at once (the motor is already HiZ).", ja: ""}
      - {version: "2.2.0", en: "Cancels pending motion, also for a motor with the brake disabled: a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: ""}
    see_also: [/combine/hardHiZ, /enableElectromagnetBrake]

  - address: /combine/run
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
      - name: speed
        type: float
        range: [-15625, 15625]
        unit: step/s
        description: {en: Rotation speed, ja: 回転速度}
    timing: motion_start
    description:
      en: Same as [[/run]] for two motors. The sign of the speed is the direction. A speed whose absolute value is above the range is limited to the largest register value (0xFFFFF, about 15625 step/s) by the driver library.
      ja: ""
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/run]

  - address: /combine/move
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
      - name: step
        type: int
        description: {en: Moving step counts, ja: 移動ステップ数}
    timing: [stopped, motion_start]
    description:
      en: |-
        Same as [[/move]] for two motors. A step count whose absolute value is above 4,194,303 (22 bits) is not rejected: it is limited to 4,194,303 by the driver library.
      ja: ""
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/move]

  - address: /combine/goTo
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
      - name: position
        type: int
        range: [-2097152, 2097151]
        description: {en: Destination, ja: 目標位置}
    timing: motion_start
    description:
      en: |-
        Same as [[/goTo]] for two motors. A position outside the range is not rejected. A position above 4,194,303 is limited to 4,194,303 by the driver library, which the driver reads as -1. Any other position is cut to its lower 22 bits and read as a signed number: 2,097,152 becomes -2,097,152 and -2,097,153 becomes 2,097,151.
      ja: ""
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "Judges its direction correctly when the home switch or the limit switch prohibits a motion ([[/setProhibitMotionOnHomeSw]], [[/setProhibitMotionOnLimitSw]]): it is the sign of the 22-bit difference to the target, the way the driver goes (the shortest way). The direction was reversed for a target less than 2048 steps away (so a short move away from the switch was refused with `HomeSwActivating` / `LimitSwActivating` and a short move towards it was started), and wrong again beyond 2^21 steps.", ja: ""}
    see_also: [/goTo]

  - address: /combine/goToDir
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
      - name: DIR
        type: bool
        description: {en: "", ja: 回転方向}
      - name: position
        type: int
        range: [-2097152, 2097151]
        description: {en: Destination, ja: 目標位置}
    timing: motion_start
    description:
      en: |-
        Same as [[/goToDir]] for two motors. A position outside the range is not rejected. A position above 4,194,303 is limited to 4,194,303 by the driver library, which the driver reads as -1. Any other position is cut to its lower 22 bits and read as a signed number: 2,097,152 becomes -2,097,152 and -2,097,153 becomes 2,097,151.
      ja: ""
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/goToDir]

  - address: /combine/softStop
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
    timing: always
    description: {en: "", ja: ""}
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    see_also: [/softStop]

  - address: /combine/hardStop
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
    timing: always
    description: {en: "", ja: ""}
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    see_also: [/hardStop]

  - address: /combine/softHiZ
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
    timing: always
    description: {en: "", ja: ""}
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    see_also: [/softHiZ]

  - address: /combine/hardHiZ
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
    timing: always
    description: {en: "", ja: ""}
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    see_also: [/hardHiZ]

  - address: /runRaw
    group: motion
    args:
      - use: motorID
      - name: speed
        type: int
        description: {en: "Rotation speed (raw register value, signed)", ja: ""}
    timing: motion_start
    description:
      en: |-
        Rotates the motor at the specified speed using a raw register value. The sign of the speed value determines the direction.

        A speed outside the 20-bit range is limited to 20 bits by the driver.
      ja: ""
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/run, /combine/runRaw]

  - address: /goUntilRaw
    group: motion
    args:
      - use: motorID
      - name: ACT
        type: bool
        description: {en: Same as `/goUntil`, ja: ""}
      - name: speed
        type: int
        description: {en: "Speed (raw register value, signed)", ja: ""}
    timing: always
    description:
      en: |-
        Same as `/goUntil` but uses a raw register value for speed. The sign of the speed value determines the direction.

        The speed is limited to 20 bits (0xFFFFF) by the firmware and the driver libraries. `/goUntilRaw 255` (all motors) interprets the speed as a raw register value, like for a single motor.
      ja: ""
    errors: [BrakeEngaged, GoUntilTimeout, HomeSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "Limits the speed to 20 bits (`0xFFFFF`), like [[/runRaw]]. Larger values were sent as is, and the driver ignored the upper bits.", ja: ""}
      - {version: "2.2.0", en: "`/goUntilRaw 255` (all motors) interprets the speed as a raw register value, like for a single motor. It was treated as steps/s.", ja: ""}
      - {version: "2.2.0", en: "An activated home switch is reported as `/error/command HomeSwActivating`, the text in the error list. It was sent as `HomeSwActivated`. It now follows [[/reportError]] like the other command errors.", ja: ""}
      - {version: "2.2.0", en: "For a motor in the servo mode, replies `/error/command InServoMode` and does nothing. Before, the command was sent to the driver. With 255, only the motors in the servo mode reply the error; the others execute the command.", ja: ""}
    see_also: [/goUntil]

  - address: /combine/runRaw
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
      - name: speed
        type: int
        description: {en: "Rotation speed (raw register value, signed)", ja: ""}
    timing: motion_start
    description:
      en: A speed outside the 20-bit range is limited to 20 bits by the driver.
      ja: ""
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/runRaw]

  # ---------------------------------------------------------------------------
  # brake
  # ---------------------------------------------------------------------------
  - address: /enableElectromagnetBrake
    group: brake
    args:
      - use: motorID
      - {use: enable, setting: driverSettings.electromagnetBrakeEnable}
    timing: always
    description:
      en: |
        Enables / disables electromagnetic brake mode.
        While in the mode, the controller replies the `BrakeEngaged` ([[/error/command]]) if motor movement command is sent without releasing the electromagnetic brake.

        The setting is changed only while the driver is HiZ, and the brake is disabled only while it is engaged or after [[/free]]; otherwise the command replies `CommandIgnored`. Sending the current value does nothing. After a change, the brake output is engaged and the brake state is engaged. The same rule applies to a configuration loaded over USB serial (a warning is printed for a motor that is not changed).
      ja: |
        電磁ブレーキモードを有効・無効にします。
        電磁ブレーキモードが有効になると、電磁ブレーキを開放しないままモータを回すコマンドを送っても`BrakeEngaged` ([[/error/command]])エラーになります。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "Changes the setting only while the driver is HiZ, and disables the brake only while it is engaged or after `/free`; otherwise `/error/command CommandIgnored`. Sending the current value does nothing. After a change the brake output is engaged and the state is engaged. Before, disabling a released brake engaged it on a turning motor, and enabling it on an energized motor left a state where `/activate 0` and `/hardHiZ` did nothing.", ja: ""}
    see_also: [/activate, /free, /setBrakeTransitionDuration, /getBrakeStatus]

  - address: /activate
    group: brake
    args:
      - use: motorID
      - name: state
        type: bool
        values:
          - {value: 1, en: "Motor excited, EM brake released", ja: "モータ励磁, 電磁ブレーキ開放"}
          - {value: 0, en: "Motor not excited, EM brake engaged", ja: "モータ励磁解除, 電磁ブレーキ保持"}
    timing: always
    description:
      en: |
        Switches motor excitation / release when electromagnetic brake mode is enabled. The electromagnetic brake (EM) also works conjunction with the motor. You cannot send motor movement command when the motor is not excited by this command.
        If the EM mode is disabled, this command is ignored.

        `/activate 1` while the brake is released does nothing. From the engaged state it energizes the driver and releases the brake after `brakeTransitionDuration`, but only if a status read after the command shows the driver energized (during the engaging it goes back to the release sequence, during the stopping it only cancels the engaging, after [[/free]] it releases at once). If the driver stays HiZ (for example without motor power), the brake stays engaged and `BrakeReleaseFailed` is sent.

        `/activate 0` on a turning motor decelerates it and engages the brake when it has stopped, like [[/softHiZ]]; on a stopped motor the brake is engaged at the next status read (up to 5 ms later). The driver goes HiZ after `brakeTransitionDuration`. The brake state can be read with [[/getBrakeStatus]].
      ja: |
        電磁ブレーキモードの場合に、モータの励磁、励磁解除を切り替えます。電磁ブレーキも連動して動作します。このコマンドでモータが励磁状態になっていないと、モータを回転させるコマンドを送ることはできません。

        電磁ブレーキモードが無効の場合は無視されます。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [CommandIgnored, BrakeReleaseFailed]
    changes:
      - {version: "2.2.0", en: "`/activate 1` while the brake is released does nothing. Before, it sent a hard stop, which stopped a turning motor abruptly.", ja: ""}
      - {version: "2.2.0", en: "`/activate 1` releases the brake only if a status read after the command shows the driver energized. If the driver stays HiZ (e.g. no motor power), the brake stays engaged and `/error/command BrakeReleaseFailed motorID` is sent. Before, the brake was released after `brakeTransitionDuration` in any case.", ja: ""}
      - {version: "2.2.0", en: "`/activate 1` during the deceleration of `/softHiZ` (or `/activate 0`) cancels the engaging and keeps the brake released; the deceleration goes on. Before, it stopped the motor with a hard stop, and the brake still engaged when the motor stopped.", ja: ""}
      - {version: "2.2.0", en: "`/activate 0` on a turning motor decelerates it and engages the brake when it has stopped, like `/softHiZ`. Before, it engaged the brake without stopping the motor.", ja: ""}
      - {version: "2.2.0", en: "`/activate 0` on a stopped motor engages the brake at the next status read (up to 5 ms later). The stop is now judged on a status read after the command.", ja: ""}
      - {version: "2.2.0", en: "After `/free`: `/activate 1` returns the motor to the released (energized) state, and `/activate 0` engages the brake at once (the motor is already HiZ).", ja: ""}
      - {version: "2.2.0", en: "KVAL_HOLD (TVAL_HOLD in the current mode) is raised to at least half of KVAL_RUN (TVAL_RUN) whenever the motor is energized again: from engaged or engaging (as before), and now also after `/free`.", ja: ""}
      - {version: "2.2.0", en: "`/activate 0` cancels pending motion of a motor with the brake enabled: a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: ""}
    see_also: [/enableElectromagnetBrake, /free, /getBrakeStatus]

  - address: /free
    group: brake
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Releases motor axis when the electromagnetic brake mode is active. It releases motor excitation and keep EM brake in release state.
        Be cautious when sending this command. If some load is hanged to the motor, it will loose the hold and the load may fall down.
        If the EM mode is disabled, this command is ignored.

        After `/free`, a stop of the motor no longer engages the brake (when `/free` was sent during the deceleration of [[/softHiZ]]). A motion command (`/run`, `/move`, `/goTo`, ...) or `/activate 1` energizes the motor again and returns it to the released state. `/activate 0`, `/softHiZ` and `/hardHiZ` engage the brake at once.
      ja: |
        電磁ブレーキモードの場合に、モータ軸を開放します。モータの励磁を解除し、電磁ブレーキも解放のままになります。

        負荷を吊り下げている場合は、保持力がなくなって負荷が落下する原因になりますので、送信時には十分注意してください。

        電磁ブレーキモードが無効の場合は無視されます。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "After `/free`, a stop of the motor no longer engages the brake (when `/free` was sent during the deceleration of `/softHiZ`).", ja: ""}
      - {version: "2.2.0", en: "After `/free`, a motion command (`/run`, `/move`, `/goTo`, ...) is executed and the motor returns to the released (energized) state. `/activate 1` does the same. `/activate 0`, `/softHiZ` and `/hardHiZ` engage the brake at once (the motor is already HiZ).", ja: ""}
      - {version: "2.2.0", en: "KVAL_HOLD (TVAL_HOLD in the current mode) is raised to at least half of KVAL_RUN (TVAL_RUN) when the motor is energized again after `/free`. Before, the motor was energized with the configured holding value.", ja: ""}
      - {version: "2.2.0", en: "`/free` cancels pending motion of a motor with the brake enabled (with the brake disabled it replies `CommandIgnored`): a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: ""}
    see_also: [/enableElectromagnetBrake, /activate, /getBrakeStatus]

  - address: /setBrakeTransitionDuration
    group: brake
    args:
      - use: motorID
      - name: duration
        type: int
        range: [0, 65535]
        unit: ms
        setting: driverSettings.brakeTransitionDuration
        description: {en: Transition duration, ja: 遷移時間}
    timing: always
    description:
      en: |-
        Sets the transitional duration to keep the motor excited when the electromagnetic brake is activated or released. This is to keep holding the motor axis until the brake movement is completed, due to the physical transition time for the brake mechanism.

        A value outside 0-65535 replies `CommandIgnored` and the setting is kept. The release after [[/activate]] comes 0-5 ms after the set time, because the brake is handled every 5 ms.
      ja: 電磁ブレーキの保持・開放時に、モータを励磁したままにしておく遷移時間を指定します。これは物理的にブレーキ機構が動作する時間がかかるため、ブレーキの動作が完了するまでモータ軸を保持しておくために必要な時間です。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A value outside 0-65535 replies `/error/command CommandIgnored` and keeps the setting. Before, the value wrapped around.", ja: ""}
      - {version: "2.2.0", en: "The brake times are in 5 ms steps: the release after `/activate 1` comes 0-5 ms after `brakeTransitionDuration` (measured 99.8-105.4 ms for 100 ms; before 99.8-107.6 ms), and the engage after a stop or a HiZ is judged at the next status read.", ja: ""}
    see_also: [/getBrakeTransitionDuration]

  - address: /getBrakeTransitionDuration
    group: brake
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the transitional duration to keep holding the motor axis when the electromagnetic brake is activated or released.
      ja: 電磁ブレーキの保持・開放時に、モータを励磁したままにしておく遷移時間を取得します。
    response: [/brakeTransitionDuration]

  - address: /getBrakeStatus
    group: brake
    since: "2.2.0"
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the state of the electromagnetic brake of the specified motor. The state is -1 for a motor with the brake disabled.
      ja: ""
    response: [/brakeStatus]
    see_also: [/activate, /free, /enableElectromagnetBrake]

  # ---------------------------------------------------------------------------
  # servo
  # ---------------------------------------------------------------------------
  - address: /enableServoMode
    group: servo
    args:
      - use: motorID
      - use: enable
    timing: always
    description:
      en: |
        Turns on/off the servo mode (position tracking mode). To avoid sudden movement, the current position at the moment of activation is set to the target position.
        It is not possible to send other motor control commands such as `/run` or `/goTo` while operating in this mode.

        Enabling the servo mode turns off the BUSY, motor status and direction reports ([[/enableBusyReport]], [[/enableMotorStatusReport]], [[/enableDirReport]]) of the motor. Disabling the servo mode does not turn them on again; send the enable commands again if needed. It also resets the integral term and the previous error of the PID controller. While in the servo mode, [[/goUntil]], [[/goUntilRaw]], [[/releaseSw]] and [[/homing]] reply `InServoMode`.

        With the electromagnetic brake enabled, `/enableServoMode 1` replies `BrakeEngaged` and does nothing while the brake is engaged, releasing or engaging (while stopping or after `/free` the command is executed); `/enableServoMode 0` does nothing while the brake is engaged or after [[/free]].

        When the driver goes HiZ by itself (overcurrent shutdown, thermal shutdown, UVLO) in the servo mode, the servo mode is cancelled and `ServoModeCancelledOnHiZ` is sent (`BrakeEngagedOnHiZ` too, with the brake enabled). Enable the servo mode again with `/enableServoMode 1`; the current position becomes the target.
      ja: |
        サーボモード（位置追従モード）をオンオフします。急に動き出すことを避けるため、有効になった瞬間の現在位置が目標位置にセットされます。

        このモードで動作している間は、`/run`や`/goTo` など他のモータ制御コマンドを送ることはできません。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged]
    changes:
      - {version: "2.2.0", en: "With the brake enabled, `/enableServoMode 1` while the brake is engaged, releasing or engaging (not while stopping or after `/free`) replies `/error/command BrakeEngaged` and does nothing. Before, it energized and moved the motor with the brake engaged.", ja: ""}
      - {version: "2.2.0", en: "With the brake enabled, `/enableServoMode 0` while the brake is engaged or after `/free` (motor HiZ) does nothing. Before, it energized the motor.", ja: ""}
      - {version: "2.2.0", en: "When a driver goes HiZ by itself (overcurrent shutdown, thermal shutdown, UVLO) in the servo mode, the servo mode is cancelled and `/error/command ServoModeCancelledOnHiZ` is sent (follows [[/reportError]]), with or without the brake. With the brake enabled, `BrakeEngagedOnHiZ` is also sent. Before, with the brake disabled the next servo update energized the driver again. The commands that make the driver HiZ cancel the servo mode first and do not send this error.", ja: ""}
      - {version: "2.2.0", en: "Enabling the servo mode resets the integral and the previous error of the PID controller. The previous values were kept from the last time the servo mode was used.", ja: ""}
      - {version: "2.2.0", en: "The update period is 5 ms instead of 10 ms (and no longer varies between 7 and 13 ms when position reports are enabled; an OSC message that sends several replies can still delay one update, up to 7.75 ms measured). The integral and derivative terms are scaled by the period, so the same `kP`, `kI` and `kD` were designed to give about the same response; retune the gains if needed.", ja: ""}
      - {version: "2.2.0", en: "STEP400: the home switch and the limit switch are judged separately. A pressed home switch stops the motion towards `homingDirection` (with `/setProhibitMotionOnHomeSw` or the home switch in the hard stop mode), and a pressed limit switch stops the motion away from it (with `/setProhibitMotionOnLimitSw` or the limit switch in the hard stop mode), as before. While the home switch was pressed, the limit switch was not checked. Only a motor with both switches pressed behaves differently.", ja: ""}
      - {version: "2.2.0", en: "The automatic hard stop at a switch event in the servo mode is not sent to a motor whose driver is HiZ.", ja: ""}
      - {version: "2.2.0", en: "Cancels pending motion, also for a motor with the brake disabled: a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: ""}
    see_also: [/setTargetPosition, /setServoParam]

  - address: /setServoParam
    group: servo
    args:
      - use: motorID
      - name: kP
        type: float
        setting: servoMode.kP
        description: {en: Proportional control gain, ja: 比例制御ゲイン}
      - name: kI
        type: float
        setting: servoMode.kI
        description: {en: Integral control gain, ja: 積分制御ゲイン}
      - name: kD
        type: float
        setting: servoMode.kD
        description: {en: Differential control gain, ja: 微分制御ゲイン}
    timing: always
    description:
      en: |-
        Adjusts the PID control gain.

        A negative gain replies `CommandIgnored` and nothing is applied. The update period of the servo mode is 5 ms; the integral and derivative terms are scaled by the period.
      ja: PID制御のゲインを調整します。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A negative gain replies `/error/command CommandIgnored` and nothing is applied. Before, it was set to 0.", ja: ""}
      - {version: "2.2.0", en: "The servo update period is 5 ms instead of 10 ms. The same gains were designed to give about the same response, but retune them if needed.", ja: ""}
    see_also: [/getServoParam]

  - address: /getServoParam
    group: servo
    args: [{use: motorID}]
    timing: always
    description: {en: "", ja: ""}
    response: [/servoParam]

  - address: /setTargetPosition
    group: servo
    args:
      - use: motorID
      - name: position
        type: int
        range: [-2097152, 2097151]
        description: {en: target position, ja: 目標位置}
    timing: always
    description:
      en: Sets the target position in servo mode.
      ja: サーボモードの目標位置を設定します。
    see_also: [/enableServoMode, /setTargetPositionList]

  - address: /setTargetPositionList
    group: servo
    args:
      - name: position
        type: int
        repeat: motors
        range: [-2097152, 2097151]
        description: {en: target position, ja: 目標位置}
    timing: always
    description:
      en: Sets the target positions of the servo mode for all axes at once.
      ja: サーボモードの目標位置を全軸分まとめて設定します。アーギュメントとして各軸の目標位置を指定しますので、STEP400の場合は4個、STEP800の場合は8個のアーギュメントが必要です。
    changes:
      - {version: "2.2.0", en: "A message with fewer positions than the number of motors replies `/error/osc MissingArgument` and nothing is applied. Before, the missing positions became 0 and a servo-mode motor ran to 0.", ja: ""}
    see_also: [/setTargetPosition]

# =============================================================================
# Messages (board -> PC)
# In the order of the commands that request them; messages sent on their own
# (/booted, /error/osc, /error/command) at the end.
# `type` is the OSC type tag the firmware actually sends.
# =============================================================================

messages:
  - address: /destIp
    args:
      - name: "destIp[0]"
        type: int
        range: [0, 255]
        description: {en: Each byte of destIp, ja: destIpの各桁}
      - name: "destIp[1]"
        type: int
        range: [0, 255]
        description: {en: Each byte of destIp, ja: destIpの各桁}
      - name: "destIp[2]"
        type: int
        range: [0, 255]
        description: {en: Each byte of destIp, ja: destIpの各桁}
      - name: "destIp[3]"
        type: int
        range: [0, 255]
        description: {en: Each byte of destIp, ja: destIpの各桁}
      - name: isNewDestIp
        type: int
        range: [0, 1]
        description:
          en: Indicates if destIp has been changed. 1 if it has been changed, or 0 if the same address has already been set.
          ja: destIpが変更されたかどうかを示します。変更されていると1, すでに同じアドレスが設定されていた場合は0
    changes:
      - {version: "2.2.0", en: "When the [[/setDestIp]] starts the resolution of the MAC address (the first one, one from another address, or one 1.5 s or more after the last packet from the destination), the message is sent once it has been resolved, so it can come up to about 2 s later; otherwise it is sent at once. If it does not come, send `/setDestIp` again.", ja: ""}

  - address: /version
    args:
      - name: version
        type: string

  - address: /configName
    args:
      - name: configName
        type: string
        description: {en: The name of the configuration, ja: コンフィギュレーションの名称。}
      - name: sdInitializeSucceeded
        type: int
        range: [0, 1]
        description: {en: If the reading from microSD card was successful., ja: microSDカードとの通信に成功したかどうか}
      - name: configFileOpenSucceeded
        type: int
        range: [0, 1]
        description: {en: If the device could open the configuration file successfully., ja: コンフィギュレーションファイルを開くことができたかどうか}
      - name: configFileParseSucceeded
        type: int
        range: [0, 1]
        description: {en: If the config Json data could be parsed successfully., ja: コンフィギュレーションファイルのJsonをパースできたかどうか}
      - name: configFilename
        type: string
        since: "2.1.0"
        description:
          en: The filename of the configuration file on the microSD card (e.g., `config.txt` or `STEP400_venue-A.json`). This is the on-disk filename, distinct from `configName` which is the user-editable label.
          ja: ""

  - address: /saveConfig
    since: "2.1.0"
    args:
      - name: message
        type: string
        value: Saved to SD. Reboot to apply.

  - address: /error/saveConfig
    since: "2.1.0"
    args:
      - name: errorText
        type: string
        values:
          - {value: SD open failed}
          - {value: No SD card}

  - address: /microstepMode
    args:
      - use: motorID
      - name: STEP_SEL
        type: int
        range: [0, 7]
        values:
          - {value: 0, en: Full-step, ja: Full-step}
          - {value: 1, en: Half-step, ja: Half-step}
          - {value: 2, en: 1/4 microstep, ja: 1/4 microstep}
          - {value: 3, en: 1/8 microstep, ja: 1/8 microstep}
          - {value: 4, en: 1/16 microstep, ja: 1/16 microstep}
          - {value: 5, en: 1/32 microstep, ja: 1/32 microstep}
          - {value: 6, en: 1/64 microstep, ja: 1/64 microstep}
          - {value: 7, en: 1/128 microstep, ja: 1/128 microstep}
        description: {en: Microstepping mode, ja: Micro stepping mode}

  - address: /lowSpeedOptimizeThreshold
    args:
      - use: motorID
      - name: lowSpeedOptimizeThreshold
        type: float
        range: [0.0, 976.3]
        unit: step/s
        description: {en: Low speed optimization threshold, ja: Low speed optimization threshold}
      - name: optimizationEnabled
        type: int
        values:
          - {value: 1, en: Low speed optimization enabled, ja: Low speed optimization 有効}
          - {value: 0, en: Low speed optimization disabled, ja: Low speed optimization 無効}
    changes:
      - {version: "2.2.0", en: "The third argument `optimizationEnabled` is sent with the integer type tag `i` (0 / 1). Before, it used `T` / `F`. Clients that expect `T` / `F` must be updated.", ja: ""}

  - address: /busy
    args:
      - use: motorID
      - name: state
        type: int
        values:
          - {value: 1, en: BUSY, ja: BUSYの場合}
          - {value: 0, en: Not BUSY, ja: BUSYでない場合}

  - address: /HiZ
    args:
      - use: motorID
      - name: state
        type: int
        range: [0, 1]
        description: {en: "1 if High Z state, 0 if not High Z state.", ja: "1:HiZ状態の場合, 0:HiZ状態でない場合"}

  - address: /dir
    args:
      - use: motorID
      - name: direction
        type: int
        values:
          - {value: 1, en: Forward, ja: 正転方向}
          - {value: 0, en: Reverse, ja: 逆転方向}

  - address: /motorStatus
    args:
      - use: motorID
      - name: MOT_STATUS
        type: int
        range: [0, 3]
        values:
          - {value: 0, en: Stopped, ja: モータ停止}
          - {value: 1, en: Acceleration, ja: 加速中}
          - {value: 2, en: Deceleration, ja: 減速中}
          - {value: 3, en: Constant speed, ja: 一定速運転中}
        description: {en: Motor status, ja: Motor status}

  - address: /position
    args:
      - use: motorID
      - name: ABS_POS
        type: int
        range: [-2097152, 2097151]
        description: {en: current position, ja: 現在位置}

  - address: /positionList
    args:
      - name: position
        type: int
        repeat: motors
        range: [-2097152, 2097151]
        description: {en: "current position of the motor #n", ja: n個目のモータの現在位置}

  - address: /adcVal
    args:
      - use: motorID
      - name: ADC_OUT
        type: int
        range: [0, 31]
        description: {en: 5bit reading of ADC_OUT register, ja: 5bitのADC_OUTレジスタ}

  - address: /status
    args:
      - use: motorID
      - name: status
        type: int
        range: [0, 65535]
        description: {en: 16-bit STATUS register, ja: 16bitのSTATUSレジスタ}

  - address: /configRegister
    args:
      - use: motorID
      - name: CONFIG
        type: int
        range: [0, 65535]
        description: {en: 16bit CONFIG register content, ja: 16bitのCONFIGレジスタ}

  - address: /statusList
    args:
      - name: status
        type: int
        repeat: motors
        range: [0, 65535]

  - address: /uvlo
    args:
      - use: motorID
      - name: state
        type: int
        values:
          - {value: 1, en: UVLO detected, ja: UVLO発生状態}
          - {value: 0, en: No UVLO condition, ja: UVLO発生無し}
    changes:
      - {version: "2.2.0", en: "The report sent when the UVLO state changes (enabled by [[/enableUvloReport]]) is sent with the integer type tag `i` (0 / 1), as the reply to [[/getUvlo]] always was. Before, the report used `T` / `F`. Clients that expect `T` / `F` must be updated.", ja: ""}

  - address: /thermalStatus
    args:
      - use: motorID
      - name: thermalStatus
        type: int
        range: [0, 3]
        description: {en: Thermal status, ja: Thermal status}
    tables:
      - title: Thermal status
        columns: [thermalStatus, Thermal status, {en: Set condition, ja: 発生条件}, {en: Release condition, ja: 解除条件}]
        rows:
          STEP400:
            - [0, {en: Normal, ja: 通常}, "-", "-"]
            - [1, Warning, 135℃, 125℃]
            - [2, Bridge shutdown, 155℃, 145℃]
            - [3, Device shutdown, 170℃, 130℃]
          STEP800:
            - [0, {en: Normal, ja: 通常}, "-", "-"]
            - [1, Warning, 130℃, 130℃]
            - [2, Bridge shutdown, 160℃, 130℃]

  - address: /overCurrent
    args:
      - use: motorID
    description:
      en: |-
        Sent at once when the overcurrent condition starts (if no such report of the motor went out in the last 200 ms) and then, while it lasts, at most every 200 ms per motor. Detections within the 200 ms are not lost: they give one message at the end of the interval. Detections while the report is disabled ([[/enableOverCurrentReport]]) are not sent later.
      ja: ""
    changes:
      - {version: "2.2.0", en: "Sent at once when the condition starts (if no such report of the motor went out in the last 200 ms) and then, while it lasts, at most every 200 ms per motor. Before, it was sent at every status read while the condition lasted (every 10 ms). The message is unchanged.", ja: ""}

  - address: /overCurrentThreshold
    args:
      - use: motorID
      - name: overCurrentThreshold
        type: float
        range: {STEP400: [312.5, 10000.0], STEP800: [375.0, 6000.0]}
        unit: mA
        description: {en: "thresholds in [mA].", ja: 閾値をmA単位であらわしたものです}

  - address: /stall
    args:
      - use: motorID
    description:
      en: |-
        Sent at once when the stall condition starts (if no such report of the motor went out in the last 200 ms) and then, while it lasts, at most every 200 ms per motor. Detections within the 200 ms are not lost: they give one message at the end of the interval. Detections while the report is disabled ([[/enableStallReport]]) are not sent later.
      ja: ""
    changes:
      - {version: "2.2.0", en: "Sent at once when the condition starts (if no such report of the motor went out in the last 200 ms) and then, while it lasts, at most every 200 ms per motor. Before, it was sent at every status read while the condition lasted (every 10 ms). The message is unchanged.", ja: ""}

  - address: /stallThreshold
    args:
      - use: motorID
      - name: stallThreshold
        type: float
        range: {STEP400: [312.5, 10000.0], STEP800: [31.25, 4000.0]}
        unit: mA
        description: {en: "thresholds in [mA]", ja: 閾値をmA単位であらわしたものです}

  - address: /prohibitMotionOnHomeSw
    args:
      - use: motorID
      - name: enable
        type: int
        values:
          - {value: 1, en: Prohibited, ja: 禁止}
          - {value: 0, en: Allowed, ja: 許可}

  - address: /prohibitMotionOnLimitSw
    boards: [STEP400]
    args:
      - use: motorID
      - name: enable
        type: int
        values:
          - {value: 1, en: Prohibited, ja: 禁止}
          - {value: 0, en: Allowed, ja: 許可}

  - address: /kval
    args:
      - use: motorID
      - name: holdKVAL
        type: int
        range: [0, 255]
        description: {en: KVAL when stopped, ja: 停止時のKVAL}
      - name: runKVAL
        type: int
        range: [0, 255]
        description: {en: KVAL in constant speed operation, ja: 一定速運転時のKVAL}
      - name: accKVAL
        type: int
        range: [0, 255]
        description: {en: KVAL during acceleration, ja: 加速時のKVAL}
      - name: decKVAL
        type: int
        range: [0, 255]
        description: {en: KVAL during deceleration, ja: 減速時のKVAL}

  - address: /bemfParam
    args:
      - use: motorID
      - name: INT_SPEED
        type: int
        range: [0, 16383]
        description: {en: INT_SPEED register value, ja: INT_SPEEDレジスタの値}
      - name: ST_SLP
        type: int
        range: [0, 255]
        description: {en: ST_SLP register value, ja: ST_SLPレジスタの値}
      - name: FN_SLP_ACC
        type: int
        range: [0, 255]
        description: {en: FN_SLP_ACC register value, ja: FN_SLP_ACCレジスタの値}
      - name: FN_SLP_DEC
        type: int
        range: [0, 255]
        description: {en: FN_SLP_DEC register value, ja: FN_SLP_DECレジスタの値}

  - address: /tval
    boards: [STEP400]
    args:
      - use: motorID
      - name: holdTVAL
        type: int
        range: [0, 64]
        description: {en: TVAL when stopped, ja: 停止時のTVAL}
      - name: runTVAL
        type: int
        range: [0, 64]
        description: {en: TVAL in constant speed operation, ja: 一定速運転時のTVAL}
      - name: accTVAL
        type: int
        range: [0, 64]
        description: {en: TVAL during acceleration, ja: 加速時のTVAL}
      - name: decTVAL
        type: int
        range: [0, 64]
        description: {en: TVAL during deceleration, ja: 減速時のTVAL}

  - address: /tval_mA
    boards: [STEP400]
    args:
      - use: motorID
      - name: holdTVAL_mA
        type: float
        range: [78.125, 5078.125]
        unit: mA
        description: {en: TVAL when stopped, ja: 停止時のTVAL}
      - name: runTVAL_mA
        type: float
        range: [78.125, 5078.125]
        unit: mA
        description: {en: TVAL in constant speed operation, ja: 一定速運転時のTVAL}
      - name: accTVAL_mA
        type: float
        range: [78.125, 5078.125]
        unit: mA
        description: {en: TVAL during acceleration, ja: 加速時のTVAL}
      - name: decTVAL_mA
        type: float
        range: [78.125, 5078.125]
        unit: mA
        description: {en: TVAL during deceleration, ja: 減速時のTVAL}

  - address: /decayModeParam
    boards: [STEP400]
    args:
      - use: motorID
      - name: T_FAST
        type: int
        range: [0, 255]
        description: {en: T_FAST register value, ja: T_FASTレジスタの値}
      - name: TON_MIN
        type: int
        range: [0, 127]
        description: {en: TON_MIN register value, ja: TON_MINレジスタの値}
      - name: TOFF_MIN
        type: int
        range: [0, 127]
        description: {en: TOFF_MIN register value, ja: TOFF_MINレジスタの値}

  - address: /speedProfile
    args:
      - use: motorID
      - name: acc
        type: float
        range: [14.55, 59590]
        unit: step/s/s
        description: {en: acceleration, ja: 加速度}
      - name: dec
        type: float
        range: [14.55, 59590]
        unit: step/s/s
        description: {en: deceleration, ja: 減速度}
      - name: maxSpeed
        type: float
        range: [15.25, 15610]
        unit: step/s
        description: {en: maximum speed, ja: 最大速さ}

  - address: /fullstepSpeed
    args:
      - use: motorID
      - name: fullstepSpeed
        type: float
        range: [7.63, 15625]
        unit: step/s
        description: {en: Threshold, ja: 切り替わる閾値}

  - address: /minSpeed
    args:
      - use: motorID
      - name: minSpeed
        type: float
        range: [0.0, 976.3]
        unit: step/s
        description: {en: Minimum speed, ja: 最小速さ}

  - address: /speed
    args:
      - use: motorID
      - name: speed
        type: float
        range: [-15625, 15625]
        unit: step/s
        description: {en: Current speed, ja: 現在の速度}

  - address: /speedProfileRaw
    args:
      - use: motorID
      - name: acc
        type: int
        range: [0, 4095]
        description: {en: acceleration (raw register value), ja: ""}
      - name: dec
        type: int
        range: [0, 4095]
        description: {en: deceleration (raw register value), ja: ""}
      - name: maxSpeed
        type: int
        range: [0, 1023]
        description: {en: maximum speed (raw register value), ja: ""}

  - address: /homingStatus
    args:
      - use: motorID
      - name: homingStatus
        type: int
        range: [0, 4]
        description: {en: Homing Status, ja: Homing Status}
    tables:
      - title: Homing Status
        columns: [homingStatus, Homing Status, {en: Description, ja: 説明}]
        rows:
          - [0, HOMING_UNDEFINED, {en: Not yet executing homing movement, ja: 原点復帰をまだしていない状態}]
          - [1, HOMING_GOUNTIL, {en: Executing `/goUntil`, ja: "`/goUntil`実行中"}]
          - [2, HOMING_RELEASESW, {en: Executing `/releaseSw`, ja: "`/releaseSw`実行中"}]
          - [3, HOMING_COMPLETED, {en: Homing done, ja: 原点復帰完了}]
          - [4, HOMING_TIMEOUT, {en: The movement did not complete during specified time frame., ja: 規定時間内に動作が完了しなかった}]

  - address: /homingDirection
    args:
      - use: motorID
      - name: homingDirection
        type: int
        values:
          - {value: 1, en: Forward, ja: Forward}
          - {value: 0, en: Reverse, ja: Reverse}

  - address: /homingSpeed
    args:
      - use: motorID
      - name: homingSpeed
        type: float
        range: [0.0, 15610.0]
        unit: step/s
        description: {en: Homing Speed, ja: Homing Speed}

  - address: /goUntilTimeout
    args:
      - use: motorID
      - name: timeout
        type: int
        range: [0, 2147483647]
        unit: ms
        description: {en: Time-out duration, ja: タイムアウト時間}

  - address: /releaseSwTimeout
    args:
      - use: motorID
      - name: timeout
        type: int
        range: [0, 2147483647]
        unit: ms
        description: {en: Time-out duration, ja: タイムアウト時間}

  - address: /homeSw
    args:
      - use: motorID
      - name: swState
        type: int
        values:
          - {value: 0, en: "Open, Undetected state", ja: "Open, 反応していない状態"}
          - {value: 1, en: "Closed, Detected state", ja: "Closed, 反応している状態"}
        description: {en: State, ja: 状態}
      - name: direction
        type: int
        values:
          - {value: 1, en: Forward, ja: 正転方向}
          - {value: 0, en: Reverse, ja: 逆転方向}
        description: {en: direction, ja: 方向}

  - address: /swEvent
    args:
      - use: motorID

  - address: /limitSw
    boards: [STEP400]
    args:
      - use: motorID
      - name: swState
        type: int
        values:
          - {value: 0, en: "Open, Undetected state", ja: "Open, 反応していない状態"}
          - {value: 1, en: "Closed, Detected state", ja: "Closed, 反応している状態"}
        description: {en: Status, ja: 状態}
      - name: direction
        type: int
        values:
          - {value: 1, en: Forward, ja: 正転方向}
          - {value: 0, en: Reverse, ja: 逆転方向}
        description: {en: Direction, ja: 方向}

  - address: /homeSwMode
    args:
      - use: motorID
      - name: swMode
        type: int
        range: [0, 1]

  - address: /limitSwMode
    boards: [STEP400]
    args:
      - use: motorID
      - name: swMode
        type: int
        range: [0, 1]

  - address: /elPos
    args:
      - use: motorID
      - name: fullstep
        type: int
        range: [0, 3]
        description: {en: Fullstep position, ja: フルステップでの位置}
      - name: microstep
        type: int
        range: [0, 127]
        description: {en: Microstep position, ja: マイクロステップでの位置}

  - address: /mark
    args:
      - use: motorID
      - name: MARK
        type: int
        description: {en: Position of the MARK, ja: MARKの座標}

  - address: /brakeTransitionDuration
    args:
      - use: motorID
      - name: duration
        type: int
        range: [0, 65535]
        unit: ms
        description: {en: Transitional duration, ja: 遷移時間}

  - address: /brakeStatus
    since: "2.2.0"
    args:
      - use: motorID
      - name: state
        type: int
        values:
          - {value: -1, en: The electromagnetic brake is disabled for the motor}
          - {value: 0, en: "Engaged. Brake output: engaged. Driver: HiZ"}
          - {value: 1, en: "Releasing (`/activate 1`, waiting `brakeTransitionDuration`). Brake output: engaged. Driver: energized"}
          - {value: 2, en: "Released. Brake output: released. Driver: energized"}
          - {value: 3, en: "Stopping (`/softHiZ`, `/activate 0`: decelerating, engages when stopped). Brake output: released. Driver: energized"}
          - {value: 4, en: "Engaging (waiting `brakeTransitionDuration`, then HiZ). Brake output: engaged. Driver: energized"}
          - {value: 5, en: "Free (`/free`). Brake output: released. Driver: HiZ"}
        description: {en: State of the brake, ja: ""}
    description:
      en: |
        Reply to [[/getBrakeStatus]]. The state numbers are part of the specification; new states will only be added as 6, 7, ....
      ja: ""

  - address: /servoParam
    args:
      - use: motorID
      - name: kP
        type: float
        description: {en: Proportional control gain, ja: 比例制御ゲイン}
      - name: kI
        type: float
        description: {en: Integral control gain, ja: 積分制御ゲイン}
      - name: kD
        type: float
        description: {en: Differential control gain, ja: 微分制御ゲイン}

  # --- sent on their own ---
  - address: /booted
    args:
      - name: deviceID
        type: int
        range: [0, 255]
        description: {en: The device ID set by the DIP Switch, ja: DIPスイッチで設定されたデバイスのID}
      - name: resetCause
        type: int
        since: "2.2.0"
        values:
          - {value: 0, en: Unknown}
          - {value: 1, en: "Power-on. Treat 1 and 2 both as a reset by the power supply"}
          - {value: 2, en: "Brown-out (supply voltage drop). On the SAMD21 a normal power-up is often reported as 2"}
          - {value: 3, en: Reset pin}
          - {value: 4, en: Watchdog}
          - {value: 5, en: "Software reset (for example after [[/resetDevice]] or a firmware upload over USB)"}
          - {value: 6, en: "CPU fault: the reset after a CPU exception (HardFault on the SAMD21)"}
        description:
          en: "The cause of the reset, as reported by the MCU."
          ja: ""
    description:
      en: |
        This message is automatically sent out when the device has (re)started. By watching the message, you can detect reset event of the device triggered by some reason.

        The message will be sent out one second after the firmware is started up and the ethernet link is established. The message will be sent to `255.255.255.255`, means broadcasting to all nodes within the subnet.

        This message can be disabled from the configuration tool.

        `resetCause`: the numbers are part of the specification; new causes will only be added as 7, 8, .... A client should treat a number it does not know as "other", and accept 6. If several causes are flagged, the first of CPU fault, brown-out, power-on, watchdog, reset pin, software is reported. After a power-on or a brown-out the CPU fault is never reported, so a fault followed by a power cycle reports 1 or 2. The numbers are those reported by the MCU as they are; with another MCU in the future the same operation may report a different number (the meaning of each number does not change).
      ja: |
        本デバイスが（再）起動した際に自動的に本デバイスから送信されるメッセージです。何らかの理由で本デバイスがリセットされたことを検出できます。

        ファームウェアが起動して、Ethernetがリンク状態になった1秒後に送信されます。サブネット内のすべてのノード (`255.255.255.255`) へブロードキャストされます。

        Config Toolの設定を用いて、このメッセージを送信しないようにも設定できます。
    changes:
      - {version: "2.2.0", en: "A second argument, `resetCause` (`i`), is added: `/booted myId resetCause`. Clients that check the exact number of arguments are affected.", ja: ""}
      - {version: "2.2.0", en: "After a watchdog detects a hang (about 250 ms after the last watchdog reset), every brake output is engaged first and the firmware waits for the longest `brakeTransitionDuration` of the motors with the brake enabled and not engaged (at most 1 s) before the board is reset, so the reset comes up to 1 s later than before; `resetCause` is still 4. v2.1.0 reset the board about 62.5 ms after a hang.", ja: ""}
      - {version: "2.2.0", en: "A CPU fault (HardFault) now engages every brake output at once, waits as above (at most 1 s), and restarts with `resetCause` 6.", ja: ""}
      - {version: "2.2.0", en: "The reset by [[/resetDevice]] now reports `resetCause` 5 (software).", ja: ""}

  - address: /error/osc
    args:
      - name: errorText
        type: string
        values:
          - {value: MessageNotMatch, en: There is no corresponding command, ja: 該当するコマンドがない。}
          - value: OscSyntaxError
            en: The OSC format is out of standard. Also sent for a packet larger than 512 bytes and for a message with more than 16 arguments.
            ja: OSCのフォーマットが規格に沿っていなかった
            changes:
              - {version: "2.2.0", en: "Also sent for a packet larger than 512 bytes and for a message with more than 16 arguments.", ja: ""}
          - value: WrongDataType
            en: "Wrong datatype of in argument(s): a string for a number, NaN or infinity, or a non-string for `/setConfigName`. Nothing is applied."
            ja: OSCメッセージの引数の型が異なっている
            changes:
              - {version: "2.2.0", en: "Nothing is applied. Before, such an argument was applied as 0.", ja: ""}
          - {value: MissingArgument, since: "2.2.0", en: "The message has fewer arguments than the command needs. Nothing is applied.", ja: ""}
        description: {en: A character string that indicates the details of an error., ja: エラーの内容を示す文字列です。}
    description:
      en: |-
        Sent if any error is detected in the received OSC (Open Sound Control) message.

        The arguments of every command are checked before the command is applied. Arguments beyond the ones a command needs are ignored. The message is not sent while error reports are disabled ([[/reportError]]).
      ja: 受け取ったOSCメッセージに何らかのエラーがあった場合に送信されます。
    changes:
      - {version: "2.2.0", en: "`MissingArgument` is new: a command with too few arguments replies it and applies nothing. Before, missing arguments were applied as 0 (`/setKval 1` set every KVAL of motor 1 to 0, `/setSpeedProfile 1` set acc, dec and max speed to 0, and the positions missing in `/setTargetPositionList` became 0).", ja: ""}
      - {version: "2.2.0", en: "`WrongDataType` is replied for an argument of the wrong type (a string for a number, NaN or infinity, `/setConfigName` with a non-string) and applies nothing. Before, the argument was applied as 0.", ja: ""}
      - {version: "2.2.0", en: "A packet larger than 512 bytes and a message with more than 16 arguments are answered with `OscSyntaxError`.", ja: ""}
      - {version: "2.2.0", en: "In some corner cases where the former OSC library read past the end of the address pattern (for example characters following a `{...}` list), the match result can differ from before.", ja: ""}

  - address: /error/command
    args:
      - name: errorText
        type: string
        values:
          - {value: CommandIgnored, en: "The command is currently not executable. Also refer Timing section. Also sent when a value is outside the range of the command; nothing is applied (the motor ID is 255 for `/setPositionListReportInterval`).", ja: コマンドが実行可能なタイミングではない。タイミング参照。}
          - value: MotorIdNotMatch
            en: Motor ID is not appropriate. A motor ID outside 0-255 is replied with the value sent.
            ja: モータIDが適切でない値になっている。
            changes:
              - {version: "2.2.0", en: "A motor ID outside 0-255 is replied with the value sent. Before, 257 and 511 were read as 1 and 255.", ja: ""}
          - {value: BrakeEngaged, en: "A motion command was sent while the electromagnetic brake was active. Also sent for `/enableServoMode 1` and `/homing` while the brake is engaged, releasing or engaging (not while stopping or after `/free`).", ja: 電磁ブレーキが効いた状態のままモーションコマンドを送信した。}
          - value: HomeSwActivating
            en: Movement from home sensor position towards the origin point. Also sent by `/goUntil` and `/goUntilRaw` when the home switch is already activated.
            ja: ホームセンサ上から原点復帰方向に移動しようとした。
            changes:
              - {version: "2.2.0", en: "Sent by `/goUntil` and `/goUntilRaw` when the home switch is already activated. It was sent as `HomeSwActivated` before.", ja: ""}
          - {value: LimitSwActivating, boards: [STEP400], en: Movement from limit sensor position towards the opposite direction from origin., ja: リミットセンサ上から原点復帰方向の逆向きに移動しようとした。}
          - {value: GoUntilTimeout, en: Timeout while executing `/goUntil` command., ja: "`/goUntil`コマンド実行中にタイムアウトした。"}
          - {value: ReleaseSwTimeout, en: Timeout while executing `/releaseSw` command., ja: "`/releaseSw`コマンド実行中にタイムアウトした。"}
          - value: InServoMode
            en: Received a command which can not be executed while servo mode.
            ja: サーボモードでは実行できないコマンドを送信した。
            changes:
              - {version: "2.2.0", en: "Also sent for `/goUntil`, `/goUntilRaw` and `/releaseSw`.", ja: ""}
          - {value: BrakeReleaseFailed, since: "2.2.0", en: "`/activate 1` was sent but the driver stayed HiZ (for example without motor power), so the brake stays engaged.", ja: ""}
          - {value: BrakeEngagedOnHiZ, since: "2.2.0", en: "The driver went HiZ by itself (overcurrent shutdown, thermal shutdown, UVLO) while the brake was released, so the brake was engaged.", ja: ""}
          - {value: ServoModeCancelledOnHiZ, en: "The driver went HiZ by itself (overcurrent shutdown, thermal shutdown, UVLO) in the servo mode, so the servo mode was cancelled. Enable it again with `/enableServoMode 1`.", since: "2.2.0", ja: ""}
          - {value: MotorNotHiZ, en: "The command writes a driver register that can be written only while the outputs are HiZ, and the motor is not HiZ. A motor holding its position is not HiZ: send `/softHiZ` or `/hardHiZ` first. Nothing is applied.", since: "2.2.0", ja: ""}
          - {value: MotorNotStopped, en: "The command writes a driver register that can be written only while the motor is stopped or HiZ, and the motor is turning. Nothing is applied.", since: "2.2.0", ja: ""}
        description: {en: A character string that indicates the details of an error., ja: エラーの内容を示す文字列です。}
      - use: motorID
        description: {en: The motor's ID, ja: モータのID}
    description:
      en: |
        This message will be sent if an error is detected while executing a command.
        The message can be enabled or disabled with [[/reportError]] command.

        With 255 (all motors), each motor is judged alone for the errors that depend on the state of a motor (`MotorNotHiZ`, `MotorNotStopped`): the motors in the required state are changed and the others reply the error.
      ja: |
        コマンドの実行時にエラーが発生した場合に送信されます。
        [[/reportError]] によって、送信の有効/無効を切り替えることができます。
    changes:
      - {version: "2.2.0", en: "New errors: `BrakeReleaseFailed`, `BrakeEngagedOnHiZ`, `ServoModeCancelledOnHiZ` (electromagnetic brake and servo mode), `MotorNotHiZ` and `MotorNotStopped` (registers that can be written only in some states). All follow [[/reportError]].", ja: ""}
      - {version: "2.2.0", en: "`CommandIgnored` is also replied when a value is outside the range of the command, and nothing is applied: [[/setPositionReportInterval]] and [[/setPositionListReportInterval]] above 65535 (255 for the list), [[/setGoUntilTimeout]] and [[/setReleaseSwTimeout]] below 0, [[/setElPos]] with a full step outside 0-3 or a microstep outside 0-127, [[/setServoParam]] with a negative gain, [[/setBrakeTransitionDuration]] outside 0-65535, [[/setDecayModeParam]] with TON_MIN or TOFF_MIN above 127.", ja: ""}
      - {version: "2.2.0", en: "`MotorIdNotMatch` is replied for a motor ID outside 0-255, with the value sent. Before, 257 and 511 were read as 1 and 255.", ja: ""}
      - {version: "2.2.0", en: "`HomeSwActivating` is replied by `/goUntil` and `/goUntilRaw` for an activated home switch. It was sent as `HomeSwActivated`, and it now follows `/reportError` like the other command errors.", ja: ""}
