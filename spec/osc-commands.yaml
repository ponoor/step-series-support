      ja: "電磁ブレーキが有効なとき、モータが再び励磁されるたびに、KVAL_HOLDがKVAL_RUNの半分以上に引き上げられます。引き上げられた値は保存されている設定を置き換えるため（`/saveConfig`で保存されます）、[[/getKval]]でも返されます。"

