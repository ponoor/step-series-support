        type: int
        values:
          - {value: 1, en: UVLO detected, ja: UVLO発生状態}
          - {value: 0, en: No UVLO condition, ja: UVLO発生無し}
    changes:
      - {version: "2.2.0", en: "The report sent when the UVLO state changes (enabled by [[/enableUvloReport]]) is sent with the integer type tag `i` (0 / 1), as the reply to [[/getUvlo]] always was. Before, the report used `T` / `F`. Clients that expect `T` / `F` must be updated.", ja: "電源電圧の低下（UVLO）の状態が変わったときの通知（[[/enableUvloReport]]で有効にします）は、[[/getUvlo]]への返信と同じく、整数の型タグ`i`（0 / 1）で送信されます。以前の通知は`T` / `F`でした。`T` / `F`を想定しているクライアントは、更新が必要です。"}

  - address: /thermalStatus
    args:
      - use: motorID
      - name: thermalStatus
        type: int
        range: [0, 3]
        description: {en: Thermal status, ja: 温度の状態}
    tables:
      - title: {en: Thermal status, ja: 温度の状態}
        columns: [thermalStatus, {en: Thermal status, ja: 温度の状態}, {en: Set condition, ja: 発生条件}, {en: Release condition, ja: 解除条件}, {en: Description, ja: 説明}]
        rows:
          STEP400:
            - [0, Normal, "-", "-", {en: Normal operation, ja: 通常}]
            - [1, Warning, 135℃, 125℃, {en: Thermal warning. Operation is not limited., ja: 温度警告。動作は制限されません。}]
            - [2, Bridge shutdown, 155℃, 145℃, {en: Thermal shutdown. The bridges are turned off., ja: 過熱遮断。ブリッジを止めます。}]
            - [3, Device shutdown, 170℃, 130℃, {en: Thermal shutdown. The internal regulators are also turned off., ja: 過熱遮断。内部の電源も止めます。}]
          STEP800:
            - [0, Normal, "-", "-", {en: Normal operation, ja: 通常}]
            - [1, Warning, 130℃, 130℃, {en: Thermal warning. Operation is not limited., ja: 温度警告。動作は制限されません。}]
            - [2, Bridge shutdown, 160℃, 130℃, {en: Thermal shutdown. The bridges are turned off., ja: 過熱遮断。ブリッジを止めます。}]

  - address: /overCurrent
    args:
      - use: motorID
    description:
      en: |-
        Sent at once when the overcurrent condition starts (if no such report of the motor went out in the last 200 ms) and then, while it lasts, at most every 200 ms per motor. Detections within the 200 ms are not lost: they give one message at the end of the interval. Detections while the report is disabled ([[/enableOverCurrentReport]]) are not sent later.
      ja: "過電流の状態が始まったときにすぐ送信し（直近200msにそのモータの同種の通知がなかった場合）、状態が続く間はモータごとに最短200msの間隔で送信します。200msの間の検出は失われず、その間隔の終わりに1つのメッセージとして送信されます。通知が無効の間（[[/enableOverCurrentReport]]）の検出は、後から送信されません。"
    changes:
      - {version: "2.2.0", en: "Sent at once when the condition starts (if no such report of the motor went out in the last 200 ms) and then, while it lasts, at most every 200 ms per motor. Before, it was sent at every status read while the condition lasted (every 10 ms). The message is unchanged.", ja: "状態が始まったときにすぐ送信し（直近200msにそのモータの同種の通知がなかった場合）、状態が続く間はモータごとに最短200msの間隔で送信します。以前は、状態が続く間、STATUSレジスタを読み出すたびに（10msごとに）送信していました。メッセージ自体は変わりません。"}

  - address: /overCurrentThreshold
    args:
      - use: motorID
      - name: overCurrentThreshold
        type: float
        range: {STEP400: [312.5, 10000.0], STEP800: [375.0, 6000.0]}
        unit: mA
        description: {en: "thresholds in [mA].", ja: 閾値をmA単位であらわしたものです}

  - address: /stall
    args:
      - use: motorID
    description:
      en: |-
        Sent at once when the stall condition starts (if no such report of the motor went out in the last 200 ms) and then, while it lasts, at most every 200 ms per motor. Detections within the 200 ms are not lost: they give one message at the end of the interval. Detections while the report is disabled ([[/enableStallReport]]) are not sent later.

        Stall detection lets the driver detect, from the motor current, that the motor can no longer turn against the load. Find a threshold ([[/setStallThreshold]]) as close as possible to, and slightly above, the current actually flowing. A small loss of steps cannot be detected, but a large position error may be.
      ja: "ストールの状態が始まったときにすぐ送信し（直近200msにそのモータの同種の通知がなかった場合）、状態が続く間はモータごとに最短200msの間隔で送信します。200msの間の検出は失われず、その間隔の終わりに1つのメッセージとして送信されます。通知が無効の間（[[/enableStallReport]]）の検出は、後から送信されません。\n\nストール検出は、モータが負荷に負けて回れなくなった状態を、ドライバが電流から検出する機能です。閾値（[[/setStallThreshold]]）は、実際に流れている電流にできるだけ近く、少し上になるように探って決めます。脱調（ステップのずれ）程度の小さなずれは検出できませんが、位置が大きくずれたときには検出できることがあります。"
    changes:
      - {version: "2.2.0", en: "Sent at once when the condition starts (if no such report of the motor went out in the last 200 ms) and then, while it lasts, at most every 200 ms per motor. Before, it was sent at every status read while the condition lasted (every 10 ms). The message is unchanged.", ja: "状態が始まったときにすぐ送信し（直近200msにそのモータの同種の通知がなかった場合）、状態が続く間はモータごとに最短200msの間隔で送信します。以前は、状態が続く間、STATUSレジスタを読み出すたびに（10msごとに）送信していました。メッセージ自体は変わりません。"}

  - address: /stallThreshold
    args:
      - use: motorID
      - name: stallThreshold
        type: float
        range: {STEP400: [312.5, 10000.0], STEP800: [31.25, 4000.0]}
        unit: mA
        description: {en: "thresholds in [mA]", ja: 閾値をmA単位であらわしたものです}

