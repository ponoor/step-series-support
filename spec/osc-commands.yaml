        type: int
        range: [0, 4]
        description: {en: Homing status, ja: 原点復帰の状態}
    tables:
      - title: {en: Homing status, ja: 原点復帰の状態}
        columns: [homingStatus, {en: Homing status, ja: 原点復帰の状態}, {en: Description, ja: 説明}]
        rows:
          - [0, HOMING_UNDEFINED, {en: Not yet executing homing movement, ja: 原点復帰をまだしていない状態}]
