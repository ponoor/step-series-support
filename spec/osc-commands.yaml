# =============================================================================
# Commands (PC -> board)
# Grouped by `group`, in the order of the current reference pages.
# =============================================================================

commands:
  # ---------------------------------------------------------------------------
  # system
  # ---------------------------------------------------------------------------
  - address: /setDestIp
    group: system
    timing: always
    description:
      en: |
        Sets the destination IP address (`destIp`) to where the device should send messages to, when it replies to a query or report internal state changes, etc.
        The board sets the `destIp` to the sender of this message.

        Also, until `destIp` is set, no OSC (Open Sound Control) messages will be sent from the device, so send this command first. One single exception is the [[/booted]] message.

        From the configuration tool, you can set the board to start sending out the OSC message without waiting the `destIp` to be set.

        To resolve the MAC address, the board sends one byte of UDP to port 9 (discard) of the destination; a Mac answers with ICMP port unreachable, which has no effect on the board. To check that the board is alive, use a command with a reply such as [[/getVersion]], not `/setDestIp`.
      ja: |-
        モータの状態に変化があったときに通知するメッセージや、問い合わせへ返信するメッセージなどの送り先IPアドレス（`destIp`）を指定します。このメッセージを送信したIPアドレスを`destIp`に設定します。

        また、`destIp`が設定されるまでは、ボードからOSCメッセージの送信は行いませんので、一番最初にこのコマンドを送信してください。唯一の例外は[[/booted]]メッセージです。

        Config Toolの設定を用いて、`destIp`が設定されていなくてもOSCメッセージを送信できるように設定できます。

        MACアドレスの解決のために、宛先のUDPポート9（discard）に1バイトを送信します。MacはICMPのport unreachableを返しますが、ボードには影響しません。ボードが動作しているかを確認するには、`/setDestIp`ではなく、[[/getVersion]]のように返信のあるコマンドを使ってください。
    response: [/destIp]
    changes:
      - {version: "2.2.0", en: "When this `/setDestIp` starts the resolution of the MAC address of the destination, the reply `/destIp` is sent once it has been resolved, so it can come later than before (a few ms on a wired network, up to a few seconds on Wi-Fi). If it does not come, send `/setDestIp` again. A `/setDestIp` that starts no resolution (for example one sent every second as a heartbeat) is answered at once.", ja: "この`/setDestIp`が宛先のMACアドレスの解決を始めたときは、解決が終わってから返信の`/destIp`を送信します。そのため、以前より遅れて届くことがあります（有線では数ms、Wi-Fiでは最大数秒）。届かないときは、もう一度`/setDestIp`を送ってください。解決を始めない`/setDestIp`（たとえば死活監視として毎秒送るもの）には、すぐに返信します。"}
      - {version: "2.2.0", en: "Messages to the destination (replies, reports, errors) are dropped while the MAC address is being resolved (up to a few seconds). The broadcast `/booted` is still sent.", ja: "MACアドレスの解決中（最大数秒）は、宛先へのメッセージ（返信、通知、エラー）は破棄されます。ブロードキャストの`/booted`は送信されます。"}
      - {version: "2.2.0", en: "A `/setDestIp` from a different device with the same IP address (another PC or network adapter), sent 1.5 s or more after the last packet from the old one, now makes the board send to the new device. Before, the board kept sending to the old MAC address until it was restarted.", ja: "同じIPアドレスの別のデバイス（別のPCやネットワークアダプタ）から、元のデバイスからの最後のパケットの1.5秒以上後に`/setDestIp`を受け取ると、ボードは新しいデバイスへ送信するようになります。以前は、ボードが再起動するまで古いMACアドレスへ送信し続けていました。"}
      - {version: "2.2.0", en: "A send to a destination that has never answered ARP (for example a wrong destination address) blocks the processing for about 41 ms (1.6 s or more before). It no longer happens for every message: the sends to that destination are paused for 1 s: the messages in that time are dropped, not sent later. A packet received from that destination resumes the sends at once. The broadcast `/booted` is not affected.", ja: "ARPの応答が一度もない宛先（たとえば誤った宛先アドレス）への送信は、処理を約41ms止めます（以前は1.6秒以上）。これがメッセージごとに起きることはなくなり、その宛先への送信を1秒間止めます。その間のメッセージは破棄され、後から送られることはありません。その宛先からパケットを受信すると、送信はすぐに再開します。ブロードキャストの`/booted`は影響を受けません。"}

  - address: /getVersion
    group: system
    timing: always
    description:
      en: Returns the firmware version burnt on the chip.
      ja: 本体に書き込まれているファームウェアのバージョン情報を返します。
    response: [/version]

  - address: /getConfigName
    group: system
    timing: always
    description:
      en: Returns the name of the configuration file read from the microSD card on system boot.
      ja: 起動時にmicroSDカードから読み込まれた設定ファイルの名称を返します。
    response: [/configName]
    see_also: [/setConfigName]

  - address: /reportError
    group: system
    args:
      - {use: enable, setting: network.reportError}
    timing: always
    description:
      en: Enables or disables the automatic message notification for [[/error/command]] and [[/error/osc]].
      ja: "[[/error/command]]および[[/error/osc]]メッセージの自動送信の有効/無効を切り替えます。"
    notifies: [/error/command, /error/osc]

  - address: /setConfigName
    group: system
    since: "2.1.0"
    args:
      - name: configName
        type: string
        setting: information.configName
        description: {en: Configuration name string, ja: "設定名の文字列"}
    timing: always
    description:
      en: Sets the configuration name stored in the device. This is a user-editable label for identifying configurations and is distinct from the on-disk filename.
      ja: "ボードに保存される設定名を設定します。設定を見分けるためにユーザーが自由に編集できるラベルで、ディスク上のファイル名とは別のものです。"
    see_also: [/getConfigName, /saveConfig]

  - address: /saveConfig
    group: system
    since: "2.1.0"
    timing: always
    description:
      en: Saves the current running configuration to the microSD card as a JSON file. The filename used is the one previously set, or the filename from which the configuration was originally loaded.
      ja: "現在動作中の設定を、JSONファイルとしてmicroSDカードに保存します。ファイル名は、以前に設定されたもの、または設定を最初に読み込んだファイルの名前が使われます。"
    response:
      - message: /saveConfig
        when: {en: Saved, ja: 保存できたとき}
      - message: /error/saveConfig
        when: {en: Failed, ja: 保存できなかったとき}

  - address: /resetDevice
    group: system
    timing: always
    description:
      en: |-
        Resets the entire device. A programmatic version of physically pressing the RESET button.

        After the restart, [[/booted]] is sent with `resetCause` 5 (software reset).
      ja: |-
        ボード全体をリセットします。ボード上のリセットスイッチを押した場合と同じ動作です。

        再起動後、[[/booted]]が`resetCause` 5（ソフトウェアリセット）で送信されます。
    changes:
      - {version: "2.2.0", en: "First stops the turning motors that have the electromagnetic brake enabled and not engaged with a hard stop, engages their brakes and waits for the longest `brakeTransitionDuration` of them (at most 1 s), then restarts. Motors without the brake are not stopped by the firmware. Before, the board restarted at once.", ja: "電磁ブレーキが有効でブレーキが保持されていない、回転中のモータをまず即停止で止め、ブレーキを保持し、それらのモータのうち最長の`brakeTransitionDuration`（最大1秒）を待ってから再起動します。ブレーキのないモータは、ファームウェアでは止められません。以前は、すぐに再起動していました。"}
      - {version: "2.2.0", en: "Resets with a software reset: `/booted` reports `resetCause` 5.", ja: "ソフトウェアリセットで再起動します。`/booted`の`resetCause`は5になります。"}

  # ---------------------------------------------------------------------------
  # driver
  # ---------------------------------------------------------------------------
  - address: /setMicrostepMode
    group: driver
    args:
      - use: motorID
      - name: STEP_SEL
        type: int
        range: [0, 7]
        setting: driverSettings.stepMode
        values:
          - {value: 0, en: Full-step, ja: Full-step}
          - {value: 1, en: Half-step, ja: Half-step}
          - {value: 2, en: 1/4 microstep, ja: 1/4 microstep}
          - {value: 3, en: 1/8 microstep, ja: 1/8 microstep}
          - {value: 4, en: 1/16 microstep, ja: 1/16 microstep}
          - {value: 5, en: 1/32 microstep, ja: 1/32 microstep}
          - {value: 6, en: 1/64 microstep, ja: 1/64 microstep}
          - {value: 7, en: 1/128 microstep, ja: 1/128 microstep}
        description: {en: Microstepping mode, ja: マイクロステップのモード}
    timing: hiz
    description:
      en: |
        Sets the microstepping mode.
        In the constant-current control mode (current mode), only full-step to 1/16 microstep is available.

        The motor must be HiZ. A motor holding its position is not HiZ: send [[/softHiZ]] or [[/hardHiZ]] first, otherwise `MotorNotHiZ` is replied and nothing is applied. On STEP400 in the current mode, a step mode finer than 1/16 replies `CommandIgnored`.

        A value outside 0-7 is not rejected: it is converted to 8 bits and then limited to 0-7 (-1 becomes 7, 256 becomes 0).
      ja: |-
        マイクロステップのモードを切り替えます。

        定電流制御モード（current mode）では、Full-stepから1/16 microstepまでしか使えません。

        モータは無励磁でなければなりません。励磁して位置を保っているモータは無励磁ではありません。先に[[/softHiZ]]か[[/hardHiZ]]を送ってください。そうでないときは`MotorNotHiZ`を返し、何も適用されません。STEP400の電流モードでは、1/16より細かいステップモードに`CommandIgnored`を返します。

        0〜7の範囲外の値は拒否されません。8ビットに変換されてから0〜7に制限されます（-1は7、256は0になります）。
    errors: [MotorNotHiZ, CommandIgnored]
    changes:
      - {version: "2.2.0", en: "The motor must be HiZ; otherwise `/error/command MotorNotHiZ` is replied and nothing is applied. Before, the driver ignored the write while the firmware variable and the saved configuration took the new value.", ja: "モータは無励磁でなければなりません。そうでないときは`/error/command MotorNotHiZ`を返し、何も適用されません。以前は、ドライバが書き込みを無視する一方で、ファームウェアの変数と保存される設定は新しい値になっていました。"}
      - {version: "2.2.0", en: "STEP400 in the current mode: a step mode finer than 1/16 replies `CommandIgnored` (the PowerSTEP01 current mode goes up to 1/16).", ja: "STEP400の電流モードでは、1/16より細かいステップモードに`CommandIgnored`を返します（PowerSTEP01の電流モードは1/16までです）。"}
    see_also: [/getMicrostepMode, /setCurrentMode]

  - address: /getMicrostepMode
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the mode of microstepping. See [[/setMicrostepMode]] for STEP_SEL.
      ja: マイクロステップのモードを取得します。STEP_SELについては[[/setMicrostepMode]]の項目を参照してください。
    response: [/microstepMode]

  - address: /enableLowSpeedOptimize
    group: driver
    args:
      - use: motorID
      - {use: enable, setting: voltageMode.lowSpeedOptimizeEnable}
    timing: stopped
    description:
      en: Enable/disable low speed optimization feature which compensate phase current distortion at a very low speed using a small driving voltage. When this optimization is enabled, speed profile minimum speed (`Min speed`) is force to zero. Only work with voltage mode. See data sheets for details.
      ja: 低速回転時の相電流ひずみ補正（Low speed optimization）の有効無効を切り替えます。この設定が有効になっていると、`Min Speed`は自動的に0になります。この補正は電圧モードでのみ利用可能です。詳しくは対応するデータシートの "Low speed optimization"を参照してください。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and nothing is applied.", ja: "モータは停止中か無励磁でなければなりません。回転中のモータには`/error/command MotorNotStopped`を返し、何も適用されません。"}
    see_also: [/setLowSpeedOptimizeThreshold, /setMinSpeed]

  - address: /setLowSpeedOptimizeThreshold
    group: driver
    args:
      - use: motorID
      - name: lowSpeedOptimizationThreshold
        type: float
        range: [0.0, 976.3]
        unit: step/s
        setting: voltageMode.lowSpeedOptimize
        description: {en: Low speed optimization threshold, ja: 低速最適化の閾値}
    timing: always
    description:
      en: |-
        Set the threshold for phase current distortion compensation at very low speed. For details, refer to "Low speed optimization" section in the corresponding datasheet.

        No reply is sent. Read the value back with [[/getLowSpeedOptimizeThreshold]].

        While the low speed optimization is enabled, the motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and nothing is applied.
      ja: |-
        低速回転時の相電流ひずみ補正を行う閾値を設定します。

        返信はありません。値は[[/getLowSpeedOptimizeThreshold]]で読み戻してください。

        低速最適化が有効の間は、モータは停止中か無励磁でなければなりません。回転中のモータには`MotorNotStopped`を返し、何も適用されません。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "While the low speed optimization is enabled, a turning motor replies `/error/command MotorNotStopped` and nothing is applied.", ja: "低速最適化が有効の間は、回転中のモータに`/error/command MotorNotStopped`を返し、何も適用されません。"}
    see_also: [/getLowSpeedOptimizeThreshold, /enableLowSpeedOptimize]

  - address: /getLowSpeedOptimizeThreshold
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the current value of the low speed optimization threshold.
      ja: Low speed optimization thresholdの現在の設定値を取得します。
    response: [/lowSpeedOptimizeThreshold]

  - address: /enableBusyReport
    group: driver
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportBUSY}
    timing: always
    description:
      en: Automatically sends out notification if the BUSY status of the specified motor has changed. The notification message is same as the response from [[/getBusy]] command.
      ja: 指定したモータのBUSY状態に変化があったら自動でメッセージを送信する設定を行います。メッセージは[[/getBusy]]の返信と同じです。
    notifies: [/busy]

  - address: /getBusy
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the BUSY state of the specified motor.
      ja: 指定したモータのBUSY状態を取得します。
    response: [/busy]

  - address: /enableHizReport
    group: driver
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportHiZ}
    timing: always
    description:
      en: Following message is sent automatically when there is a change in the High Z (high impedance) state of the specified motor.
      ja: 指定したモータの無励磁状態に変化があったら自動でメッセージを送信する設定を行います。送信されるメッセージは[[/getHiZ]]の返信と同じです。
    notifies: [/HiZ]

  - address: /getHiZ
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Requests the High Z (high impedance) state of the specified motor.
      ja: 指定したモータの無励磁状態を取得します。
    response: [/HiZ]

  - address: /enableDirReport
    group: driver
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportDir}
    timing: always
    description:
      en: Following message is sent automatically when there is a change in the direction of the specified motor.
      ja: 指定したモータの回転方向に変化があったら自動でメッセージを送信する設定を行います。送信されるメッセージは[[/getDir]]の返信と同じです。
    notifies: [/dir]

  - address: /getDir
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Requests the direction of the specified motor.
      ja: 指定したモータの回転方向を取得します。
    response: [/dir]
    changes:
      - {version: "2.2.0", en: "`/getDir 255` (all motors) returns the direction. It returned the HiZ state.", ja: "`/getDir 255`（全モータ）が方向を返します。以前は無励磁の状態が返っていました。"}

  - address: /enableMotorStatusReport
    group: driver
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportMotorStatus}
    timing: always
    description:
      en: Following message will be sent automatically when there is conditional change in the operating status (MOT_STATUS) of the specified motor. The response message is same as the reply from the [[/getMotorStatus]] command.
      ja: 指定したモータの動作状態（MOT_STATUS）に変化があったら自動でメッセージを送信する設定を行います。メッセージは[[/getMotorStatus]]の返信と同じです。
    notifies: [/motorStatus]

  - address: /getMotorStatus
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the operating status (MOT_STATUS) of the specified motor.
      ja: 指定したモータの動作状態（MOT_STATUS）を取得します。
    response: [/motorStatus]

  - address: /setPositionReportInterval
    group: driver
    args:
      - use: motorID
      - name: interval
        type: int
        range: [0, 65535]
        unit: ms
        setting: alarmAndReport.reportPositionInterval
        description: {en: transmit interval, ja: 送信間隔}
    timing: always
    description:
      en: |
        Send the current position (`ABS_POS`) of the specified motor with the specified interval. Disabled with the interval 0.

        When this function enabled, `/setPositionListReportInterval` will be automatically disabled and stop the transmitting.

        An interval above 65535 replies `CommandIgnored` and nothing is applied. A negative interval disables the report, as 0.
      ja: |-
        指定したモータの現在位置（`ABS_POS`）を指定間隔で自動送信します。0を指定すると無効化され、送信を停止します。
        いずれかのモータで有効化された場合、`/setPositionListReportInterval`は無効になり自動停止します。

        65535を超える間隔には`CommandIgnored`を返し、何も適用されません。負の間隔は、0と同じく通知を無効にします。
    notifies: [/position]
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A value above 65535 replies `/error/command CommandIgnored` and nothing is applied. Before, 32768 and above were read as negative and disabled the report. A negative interval still disables it.", ja: "65535を超える値には`/error/command CommandIgnored`を返し、何も適用されません。以前は32768以上が負の値として読まれ、通知が止まっていました。負の間隔で通知が止まる点は変わりません。"}
      - {version: "2.2.0", en: "When the report is enabled (interval above 0) for one motor, the saved position list report interval is cleared too, as it was for 255. Before, a configuration saved after switching from the list report to one motor's report started the list report again at the next start and cleared the motor's report.", ja: "1つのモータで通知を有効にしたとき（間隔が0より大きいとき）は、保存されている位置リスト通知の間隔も、255の場合と同じように消去されます。以前は、リスト通知から1つのモータの通知に切り替えて保存した設定が、次の起動でリスト通知を再び始め、そのモータの通知を消していました。"}
    see_also: [/getPosition, /setPositionListReportInterval]

  - address: /setPositionListReportInterval
    group: driver
    args:
      - name: interval
        type: int
        range: [0, 65535]
        unit: ms
        setting: alarmAndReport.reportPositionListInterval
        description: {en: transmit interval, ja: 送信間隔}
    timing: always
    description:
      en: |
        Send a single message with a list of the current position (`ABS_POS`) of all motors with the specified interval. Disabled with the interval 0.

        When this function enabled, `/setPositionReportInterval` will be disabled automatically for all motors and stop the transmitting.

        An interval above 65535 replies `CommandIgnored` with the motor ID 255 and nothing is applied. A negative interval disables the report, as 0.
      ja: |-
        全モータの現在位置（`ABS_POS`）をひとつのリストにまとめたメッセージを指定間隔で自動送信します。0を指定すると無効化され、送信を停止します。
        このコマンドが有効化される際には`/setPositionReportInterval`はすべての軸で無効になり自動停止します。

        65535を超える間隔には、モータID 255で`CommandIgnored`を返し、何も適用されません。負の間隔は、0と同じく通知を無効にします。
    notifies: [/positionList]
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A value above 65535 replies `/error/command CommandIgnored 255` and nothing is applied. Before, 32768 and above were read as negative and disabled the report. A negative interval still disables it.", ja: "65535を超える値には`/error/command CommandIgnored 255`を返し、何も適用されません。以前は32768以上が負の値として読まれ、通知が止まっていました。負の間隔で通知が止まる点は変わりません。"}
    see_also: [/getPositionList, /setPositionReportInterval]

  - address: /getAdcVal
    group: driver
    args: [{use: motorID}]
    boards: [STEP400]
    routed_on: [STEP400, STEP800]
    timing: always
    description:
      en: |-
        Acquires ADC_OUT register values from the PowerSTEP01 chip. This register stores 5-bit AD-converted voltage reading from ADC pin. This pin is pull-upped with 10kOhm resistor and wired to LIMITSW connector.

        STEP400 only. The firmware also accepts the command on STEP800, but it is not meaningful there.
      ja: |-
        PowerSTEP01チップのADC_OUTレジスタの値を取得します。このレジスタはADCピンの電圧を5ビットでAD変換した値が収められています。このピンは10kΩでプルアップされていて、LIMITSWコネクタに接続されています。

        STEP400のみです。ファームウェアはSTEP800でもこのコマンドを受け付けますが、意味のある値は得られません。
    response: [/adcVal]

  - address: /getStatus
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Gets the STATUS of the motor driver (PowerSTEP01 for STEP400/L6470 for STEP800). The STATUS includes the status of the motor, alarms and switches.

        Refer to "STATUS" in the data sheet for the information contained in the registers. Some of bits are latched and reset when STATUS registers are read out. Because the device firmware constantly obtains the STATUS values, these values are immediately reset. It is possible to set up these events to be reported separately, so please use those commands.

        This command does not clear the latched flags; only the status poll of the firmware (every 5 ms) does.
      ja: |-
        モータドライバ（PowerSTEP01/L6470）のSTATUSレジスタを取得します。STATUSレジスタにはモータやアラーム、スイッチの状態などが含まれます。

        レジスタに含まれる情報は、データシートを参照してください。このうち、一部の値はラッチされていて、STATUSレジスタを読み出すとリセットされます。ボードではファームウェアによって常時STATUSレジスタを繰り返し取得しているため、これらの値はすぐにリセットされてしまいます。これらの事象を個別に通知する設定が可能ですので、そちらを利用してください。

        このコマンドはラッチされたフラグを消しません。消すのはファームウェアのSTATUSレジスタの読み出し（5msごと）だけです。
    response: [/status]
    changes:
      - {version: "2.2.0", en: "Reads the STATUS register with GetParam instead of GetStatus, so it no longer clears the latched driver flags (e.g. OCD, stall flags, UVLO, SW_EVN). The register values are the same. Only the status poll of the firmware (every 5 ms) clears them now, so a `/getStatus` sent right after another can show a flag the earlier reply showed (until the next poll, up to 5 ms).", ja: "STATUSレジスタをGetStatusではなくGetParamで読み出すため、ラッチされたドライバのフラグ（OCD、ストールのフラグ、UVLO、SW_EVNなど）を消さなくなりました。レジスタの値は同じです。フラグを消すのはファームウェアのSTATUSレジスタの読み出し（5msごと）だけになったため、直前に別の`/getStatus`を送っていても、先の返信に出ていたフラグが次の返信にも出ることがあります（次の読み出しまでの最大5ms）。"}
    see_also: [/getStatusList]
    tables:
      - columns:
          - {en: Name of bits in STATUS (STEP400), ja: STATUSレジスタのビット名（STEP400）}
          - {en: Name of bits in STATUS (STEP800), ja: STATUSレジスタのビット名（STEP800）}
          - {en: The corresponding configuration commands, ja: 対応する設定コマンド}
        rows:
          - [UVLO, UVLO, "[[/enableUvloReport]]"]
          - [UVLO_ADC, "-", {en: This feature is not available in STEP400 and is always disabled., ja: この機能はSTEP400では使えませんので常時無効になっています。}]
          - [OCD, OCD, "[[/enableOverCurrentReport]]"]
          - ["STALL_A, STALL_B", "STEP_LOSS_A, STEP_LOSS_B", "[[/enableStallReport]]"]
          - [CMD_ERROR, "WRONG_CMD, NOTPREF_CMD", "[[/reportError]]"]
          - [TH_STATUS, "TH_WRN, TH_SD", "[[/enableThermalStatusReport]]"]
          - [SW_EVN, SW_EVN, "[[/enableSwEventReport]]"]
          - [MOT_STATUS, MOT_STATUS, "[[/enableMotorStatusReport]]"]
          - [SW_F, SW_F, "[[/enableHomeSwReport]]"]
          - [BUSY, BUSY, "[[/enableBusyReport]]"]
          - [HiZ, HiZ, "[[/enableHizReport]]"]

  - address: /getConfigRegister
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Acquires the CONFIG register value from the motor driver (PowerSTEP01 or L6470). The information stored in CONFIG register includes motor, alarm and switch status.

        The CONFIG register stores various settings for the motor driver. Please refer the datasheet of the PowerSTEP01/L6470 for detail.
      ja: |
        モータドライバ（PowerSTEP01/L6470）のCONFIGレジスタを取得します。CONFIGレジスタにはモータやアラーム、スイッチの状態などが含まれます。

        CONFIGレジスタにはモータドライバの各種設定が収められています。詳細についてはモータドライバのデータシートを参照してください。
    response: [/configRegister]

  - address: /resetMotorDriver
    group: driver
    args: [{use: motorID}]
    timing: always
    description:
      en: |-
        Resets the motor driver (PowerSTEP01/L6470) and rewrites the setting.

        With the electromagnetic brake enabled, the command is accepted only while the brake is engaged or after [[/free]] (the motor is HiZ); otherwise it replies `CommandIgnored`. When it is accepted (also with the brake disabled), it cancels pending motion and the servo mode. A command that is refused (`CommandIgnored`) cancels nothing.
      ja: |-
        モータドライバ（PowerSTEP01/L6470）をリセットし、初期設定値を再度書き込みます。

        電磁ブレーキが有効なときは、ブレーキが保持されている間か[[/free]]の後（モータが無励磁）だけ受け付けます。それ以外では`CommandIgnored`を返します。受け付けたときは（ブレーキが無効でも）、保留中の動作とサーボモードを取り消します。拒否されたコマンド（`CommandIgnored`）は、何も取り消しません。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "With the electromagnetic brake enabled, accepted only while the brake is engaged or after `/free`; otherwise `/error/command CommandIgnored`. Before, it made the driver HiZ with the brake released.", ja: "電磁ブレーキが有効なときは、ブレーキが保持されている間か`/free`の後だけ受け付けます。それ以外では`/error/command CommandIgnored`を返します。以前は、ブレーキを解放したままドライバを無励磁にしていました。"}
      - {version: "2.2.0", en: "Cancels pending motion (a `/goTo` etc. waiting for the BUSY flag, the homing, the servo mode) when it is accepted, also with the brake disabled. A refused command (`CommandIgnored`) cancels nothing.", ja: "受け付けたときは、保留中の動作（BUSYフラグが下りるのを待つ`/goTo`など、原点復帰、サーボモード）を取り消します。ブレーキが無効なモータでも同じです。拒否されたコマンド（`CommandIgnored`）は、何も取り消しません。"}
      - {version: "2.2.0", en: "The settings applied again after the reset include those made with the Raw commands (see [[/setAccRaw]]).", ja: "リセット後に再び適用される設定には、Rawコマンドで設定したもの（[[/setAccRaw]]を参照）も含まれます。"}

  - address: /getStatusList
    group: driver
    timing: always
    description: {en: "Gets the STATUS registers of all motors at once. See [[/getStatus]] for the contents of the register.", ja: "すべてのモータのSTATUSレジスタをまとめて取得します。レジスタの内容は[[/getStatus]]を参照してください。"}
    response: [/statusList]
    changes:
      - {version: "2.2.0", en: "Reads the STATUS registers with GetParam instead of GetStatus, so it no longer clears the latched driver flags. See [[/getStatus]].", ja: "STATUSレジスタをGetStatusではなくGetParamで読み出すため、ラッチされたドライバのフラグを消さなくなりました。[[/getStatus]]を参照してください。"}
    see_also: [/getStatus]

  # ---------------------------------------------------------------------------
  # alarm
  # ---------------------------------------------------------------------------
  - address: /enableUvloReport
    group: alarm
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportUVLO}
    timing: always
    description:
      en: |
        Set the notification message when UVLO (Undervoltage Lockout) occurs in the specified motor driver.
        UVLO occurs when the supplied voltage to the motor driver falls below the UVLO turn-off threshold voltage, with or without notification. In this state, the motor cannot be operated. It will be reset when the supply voltage is above the UVLO turn-on threshold.

        These thresholds are different between STEP400(PowerSTEP01) and STEP800(L6470). For details, please refer to the corresponding datasheets.
      ja: |
        指定したモータドライバで電源電圧の低下（UVLO, Undervoltage Lockout）が発生した際に自動で通知メッセージを送信するかどうかを指定します。
        UVLOはモータドライバへ供給されている電圧がUVLO発生条件電圧を下回ったら通知の有無にかかわらず発生します。この状態ではモータを動かすことはできません。供給電圧がUVLO解除条件電圧を上回ったら解除されます。

        これらの電圧はSTEP400（PowerSTEP01）とSTEP800（L6470）で異なっていますので、詳しくは対応するデータシートで確認してください。
    notifies: [/uvlo]
    see_also: [/getUvlo]

  - address: /getUvlo
    group: alarm
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the current state of UVLO
      ja: 電源電圧の低下（UVLO）の現在の状態を取得します。
    response: [/uvlo]

  - address: /enableThermalStatusReport
    group: alarm
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportThermalStatus}
    timing: always
    description:
      en: Sends a notification message when a change in the temperature status (thermalStatus) of the specified motor driver is detected. On bridge shutdown or device shutdown, the motor state will automatically enter High Z state with or without notification.
      ja: 指定したモータドライバの温度状態（thermalStatus）に変化があったら自動でメッセージを送信するかどうかを指定します。Bridge shutdown, Device shutdown状態では、通知の有無にかかわらずモータは無励磁状態になります。
    notifies: [/thermalStatus]
    see_also: [/getThermalStatus]

  - address: /getThermalStatus
    group: alarm
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Gets the current condition of the ThermalStatus. Thermal status thresholds are different between STEP400(PowerSTEP01) and STEP800(L6470).

        In the bridge shutdown and device shutdown states, the motor goes into the High Z state with or without notification.
      ja: |
        ThermalStatusの現在の状態を取得します。STEP400とSTEP800ではThermal statusの種類や発生条件が異なります。

        Bridge shutdown, Device shutdown状態では、通知の有無にかかわらずモータは無励磁状態になります。
    response: [/thermalStatus]

  - address: /enableOverCurrentReport
    group: alarm
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportOCD}
    timing: always
    description:
      en: |
        Set to send a notification when the specified motor driver goes into an overcurrent state (OCD, Over Current Detection).
        When overcurrent is detected, the device automatically enters High Z state regardless of whether a notification being sent. The threshold can be set with [[/setOverCurrentThreshold]].
      ja: |
        指定したモータドライバが過電流状態（OCD, Over Current Detection）になった場合に自動でメッセージを送信するかどうかを指定します。
        過電流状態になった場合は、通知の有無にかかわらず自動で無励磁状態になります。閾値は[[/setOverCurrentThreshold]]で設定できます。
    notifies: [/overCurrent]

  - address: /setOverCurrentThreshold
    group: alarm
    args:
      - use: motorID
      - name: OCD_TH
        type: int
        range: {STEP400: [0, 31], STEP800: [0, 15]}
        setting: alarmAndReport.OCThreshold
        description: {en: Overcurrent detection threshold, ja: 過電流検出の閾値}
    timing: always
    description:
      en: |-
        Sets the overcurrent threshold. The setting value range and corresponding currents are different between STEP400(PowerSTEP01) and STEP800(L6470).

        A value above the range is not rejected; it wraps around: the value after the maximum is 0 (on STEP800, 16 becomes 0 and 17 becomes 1).
      ja: |-
        過電流の閾値を設定します。STEP400とSTEP800では設定値の範囲と対応する電流が異なっています。

        範囲を超える値は拒否されず、最大値の次を0として数え直した値になります（STEP800で16は0、17は1）。
    response: [/overCurrentThreshold]
    see_also: [/getOverCurrentThreshold, /enableOverCurrentReport]
    tables:
      - title: {en: Overcurrent detection threshold, ja: 過電流検出の閾値}
        columns: [OCD_TH, {en: Overcurrent detection threshold, ja: 過電流検出の閾値}]
        rows:
          STEP400:
            - [0, 312.5mA]
            - [1, 625mA]
            - ["...", "..."]
            - [30, 9.6875A]
            - [31, 10A]
          STEP800:
            - [0, 375mA]
            - [1, 750mA]
            - ["...", "..."]
            - [14, 5.625A]
            - [15, 6A]

  - address: /getOverCurrentThreshold
    group: alarm
    args: [{use: motorID}]
    timing: always
    description:
      en: Get the threshold of overcurrent.
      ja: 過電流の閾値を取得します。
    response: [/overCurrentThreshold]

  - address: /enableStallReport
    group: alarm
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportStall}
    timing: always
    description:
      en: |
        The threshold can be set by [[/setStallThreshold]].
        When the stall is detected by the specified motor driver, the following message is sent automatically.
      ja: |
        閾値は[[/setStallThreshold]]で設定できます。
        指定したモータドライバでストールが検出された場合、自動で下記のメッセージを送信します。
    notifies: [/stall]

  - address: /setStallThreshold
    group: alarm
    args:
      - use: motorID
      - name: STALL_TH
        type: int
        range: {STEP400: [0, 31], STEP800: [0, 127]}
        setting: voltageMode.STALL_TH
        description: {en: Stall detection threshold, ja: ストール検出の閾値}
    timing: always
    description:
      en: |-
        Sets the threshold for stall detection. The setting value range and corresponding currents are different between STEP400(PowerSTEP01) and STEP800(L6470).

        Stall detection lets the driver detect, from the motor current, that the motor can no longer turn against the load. Find a threshold (`/setStallThreshold`) as close as possible to, and slightly above, the current actually flowing. A small loss of steps cannot be detected, but a large position error may be.

        A value above the range is not rejected; it wraps around: the value after the maximum is 0 (on STEP800, 128 becomes 0 and 129 becomes 1).
      ja: |-
        ストール検出の閾値を設定します。STEP400とSTEP800で設定する値の範囲は異なります。

        ストール検出は、モータが負荷に負けて回れなくなった状態を、ドライバが電流から検出する機能です。閾値（`/setStallThreshold`）は、実際に流れている電流にできるだけ近く、少し上になるように探って決めます。脱調（ステップのずれ）程度の小さなずれは検出できませんが、位置が大きくずれたときには検出できることがあります。

        範囲を超える値は拒否されず、最大値の次を0として数え直した値になります（STEP800で128は0、129は1）。
    response: [/stallThreshold]
    changes:
      - {version: "2.2.0", en: "Also changes the saved STALL_TH (`/saveConfig`, `/resetMotorDriver`). Before, it changed the register only.", ja: "保存されるSTALL_TH（`/saveConfig`、`/resetMotorDriver`）も変更します。以前は、レジスタだけを変更していました。"}
    see_also: [/getStallThreshold, /enableStallReport]
    tables:
      - title: {en: Stall detection threshold, ja: ストール検出の閾値}
        columns: [STALL_TH, {en: Stall detection threshold, ja: ストール検出の閾値}]
        rows:
          STEP400:
            - [0, 312.5mA]
            - [1, 625mA]
            - ["...", "..."]
            - [30, 9.6875A]
            - [31, 10A]
          STEP800:
            - [0, 31.25mA]
            - [1, 62.5mA]
            - ["...", "..."]
            - [126, 3.969A]
            - [127, 4A]

  - address: /getStallThreshold
    group: alarm
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the stall detection threshold.
      ja: ストール検出の閾値を取得します。
    response: [/stallThreshold]

  - address: /setProhibitMotionOnHomeSw
    group: alarm
    args:
      - use: motorID
      - use: enable
        setting: driverSettings.prohibitMotionOnHomeSw
        values:
          - {value: 1, en: Prohibit, ja: 禁止}
          - {value: 0, en: Allow, ja: 許可}
    timing: always
    description:
      en: Prohibits any motion commands towards the origin point when the HOME switch is activated. The direction to the origin point can be configured through the configuration tool or by the `/setHomingDirection` command.
      ja: HOMEスイッチがオンの状態で、原点復帰方向へのモーションコマンドを禁止します。原点復帰方向はconfigToolや`/setHomingDirection`で設定できます。
    changes:
      - {version: "2.2.0", en: "The automatic hard stop at the home switch is not sent to a motor whose driver is HiZ, also with the brake disabled (a hard stop energizes a HiZ driver).", ja: "ドライバが無励磁のモータには、HOMEスイッチでの自動の即停止を送りません。電磁ブレーキが無効でも同じです（即停止は無励磁のドライバを励磁してしまうため）。"}
    see_also: [/getProhibitMotionOnHomeSw, /setHomingDirection]

  - address: /getProhibitMotionOnHomeSw
    group: alarm
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns whether the motion command towards the origin point is prohibited when the HOME switch is activated.
      ja: HOMEスイッチがオンの状態で、原点復帰方向へのモーションコマンドが禁止されているかどうかを返します。
    response: [/prohibitMotionOnHomeSw]

  - address: /setProhibitMotionOnLimitSw
    group: alarm
    args:
      - use: motorID
      - use: enable
        setting: driverSettings.prohibitMotionOnLimitSw
        values:
          - {value: 1, en: Prohibit, ja: 禁止}
          - {value: 0, en: Allow, ja: 許可}
    boards: [STEP400]
    timing: always
    description:
      en: Prohibits any motion commands towards the leaving direction from origin point, when the LIMIT switch is activated. The direction to the origin point can be configured through the configuration tool or by the `/setHomingDirection` command.
      ja: LIMITスイッチがオンの状態で、原点復帰方向の逆方向へのモーションコマンドを禁止します。原点復帰方向はconfigToolや`/setHomingDirection`で設定できます。
    see_also: [/getProhibitMotionOnLimitSw, /setHomingDirection]

  - address: /getProhibitMotionOnLimitSw
    group: alarm
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: Returns whether the motion command towards reverse direction to the origin point is prohibited when the LIMIT switch is activated.
      ja: LIMITスイッチがオンの状態で、原点復帰方向の逆方向へのモーションコマンドが禁止されているかどうかを返します。
    response: [/prohibitMotionOnLimitSw]

  # ---------------------------------------------------------------------------
  # drive_mode
  # ---------------------------------------------------------------------------
  - address: /setVoltageMode
    group: drive_mode
    args: [{use: motorID}]
    boards: [STEP400]
    timing: hiz
    description:
      en: |
        Switches the specified motor to the voltage drive mode.

        Note: This command is only available in STEP400.
        STEP800 is always in this voltage mode and cannot change.
      ja: 指定したモータを電圧モードに切り替えます。STEP800は常に電圧モードで動作しますので、この切替コマンドはSTEP400のみ利用可能です。
    errors: [MotorNotHiZ, CommandIgnored]
    changes:
      - {version: "2.2.0", en: "The outputs must be HiZ; otherwise `/error/command MotorNotHiZ` is replied and nothing is applied.", ja: "出力は無励磁でなければなりません。そうでないときは`/error/command MotorNotHiZ`を返し、何も適用されません。"}
      - {version: "2.2.0", en: "The mode is changed only if the driver took it (STEP_MODE is read back); otherwise `/error/command CommandIgnored`. Before, the stored mode was changed while the driver kept the old one, so [[/setKval]] and [[/setTval]] then wrote the wrong registers.", ja: "ドライバがモードを受け付けたとき（STEP_MODEを読み戻して確認します）だけモードを変更します。そうでないときは`/error/command CommandIgnored`を返します。以前は、ドライバが元のモードのままなのに保存されるモードだけが変わっていたため、その後の[[/setKval]]と[[/setTval]]が誤ったレジスタに書き込んでいました。"}
    see_also: [/setCurrentMode]

  - address: /setKval
    group: drive_mode
    args:
      - use: motorID
      - name: holdKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_HOLD
        description: {en: KVAL when stopped, ja: 停止時のKVAL}
      - name: runKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_RUN
        description: {en: KVAL in constant speed operation, ja: 一定速運転時のKVAL}
      - name: accKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_ACC
        description: {en: KVAL during acceleration, ja: 加速時のKVAL}
      - name: decKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_DEC
        description: {en: KVAL during deceleration, ja: 減速時のKVAL}
    timing: always
    description:
      en: |-
        Sets the four KVALs together.

        A value outside 0-255 is not rejected: it is limited to 0-255.

        On STEP400 in the current mode only the stored setting changes; [[/setVoltageMode]] writes it to the registers.
      ja: |-
        KVAL4種をまとめて設定します。

        0〜255の範囲外の値は拒否されず、0〜255に制限されます。

        STEP400の電流モードでは、保存される設定だけが変わります。[[/setVoltageMode]]でレジスタに書き込まれます。
    see_also: [/getKval, /setHoldKval, /setRunKval, /setAccKval, /setDecKval]

  - address: /getKval
    group: drive_mode
    args: [{use: motorID}]
    timing: always
    description:
      en: |-
        Get the four KVALs together.

        With the electromagnetic brake enabled and the voltage mode, KVAL_HOLD is raised to at least half of KVAL_RUN whenever the motor is energized again (from engaged, engaging or after [[/free]]), and this command returns the raised value. In the current mode TVAL_HOLD is raised instead.
      ja: |-
        KVAL4種をまとめて取得します。

        電磁ブレーキが有効で電圧モードのとき、モータが再び励磁されるたびに（保持、保持への移行中、`/free`の後から）KVAL_HOLDがKVAL_RUNの半分以上に引き上げられ、このコマンドは引き上げられた値を返します。電流モードでは、代わりにTVAL_HOLDが引き上げられます。
    response: [/kval]
    changes:
      - {version: "2.2.0", en: "Returns the settings (what [[/setKval]] sets and `/saveConfig` saves) instead of the driver registers. In the current mode the KVAL registers keep the value from before; in the voltage mode they are the registers. KVAL_HOLD raised for a motor with the electromagnetic brake is returned too. STEP800: the reply is the same as before.", ja: "ドライバのレジスタではなく、設定（[[/setKval]]で設定し、`/saveConfig`で保存される値）を返します。電流モードではKVALのレジスタは以前の値のままで、電圧モードではレジスタの値です。電磁ブレーキのモータで引き上げられたKVAL_HOLDも返されます。STEP800の返信は以前と同じです。"}

  - address: /setBemfParam
    group: drive_mode
    args:
      - use: motorID
      - name: INT_SPEED
        type: int
        range: [0, 16383]
        setting: voltageMode.INT_SPEED
        description: {en: INT_SPEED register value, ja: INT_SPEEDレジスタの値}
      - name: ST_SLP
        type: int
        range: [0, 255]
        setting: voltageMode.ST_SLP
        description: {en: ST_SLP register value, ja: ST_SLPレジスタの値}
      - name: FN_SLP_ACC
        type: int
        range: [0, 255]
        setting: voltageMode.FN_SLP_ACC
        description: {en: FN_SLP_ACC register value, ja: FN_SLP_ACCレジスタの値}
      - name: FN_SLP_DEC
        type: int
        range: [0, 255]
        setting: voltageMode.FN_SLP_DEC
        description: {en: FN_SLP_DEC register value, ja: FN_SLP_DECレジスタの値}
    timing: hiz
    description:
      en: |-
        Sets BEMF compensation parameter register. For the values for each parameter, refer voltage mode and current mode.

        The outputs must be HiZ; otherwise `MotorNotHiZ` is replied and nothing is applied.

        A value outside the range is not rejected: INT_SPEED is limited to 0-16383 and the other parameters to 0-255.
      ja: |-
        BEMF補償パラメータのレジスタを設定します。各レジスタの設定値については電圧モードの設定を参照してください。

        出力は無励磁でなければなりません。そうでないときは`MotorNotHiZ`を返し、何も適用されません。

        範囲外の値は拒否されません。INT_SPEEDは0〜16383に、他のパラメータは0〜255に制限されます。
    errors: [MotorNotHiZ]
    changes:
      - {version: "2.2.0", en: "The outputs must be HiZ (INT_SPEED, ST_SLP, FN_SLP_ACC and FN_SLP_DEC are writable only in HiZ); otherwise `/error/command MotorNotHiZ` and nothing is applied.", ja: "出力は無励磁でなければなりません（INT_SPEED、ST_SLP、FN_SLP_ACC、FN_SLP_DECは無励磁のときだけ書き込めます）。そうでないときは`/error/command MotorNotHiZ`を返し、何も適用されません。"}
    see_also: [/getBemfParam]

  - address: /getBemfParam
    group: drive_mode
    args: [{use: motorID}]
    timing: always
    description:
      en: Get register values for the BEMF parameter.
      ja: BEMFパラメータを設定するレジスタ値を取得します。
    response: [/bemfParam]

  - address: /setHoldKval
    group: drive_mode
    args:
      - use: motorID
      - name: holdKVAL
        type: int
        range: [0, 255]
        setting: voltageMode.KVAL_HOLD
        description: {en: KVAL when stopped, ja: 停止時のKVAL}
    timing: always
    description:
      en: |-
        Sets only the hold KVAL value.

        A value outside 0-255 is not rejected: it is limited to 0-255.

        On STEP400 in the current mode only the stored setting changes; [[/setVoltageMode]] writes it to the registers.
      ja: |-
        停止時のKVALのみを設定します。

        0〜255の範囲外の値は拒否されず、0〜255に制限されます。

        STEP400の電流モードでは、保存される設定だけが変わります。[[/setVoltageMode]]でレジスタに書き込まれます。
