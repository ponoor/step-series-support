  # ---------------------------------------------------------------------------
  - address: /setSpeedProfile
    group: speed_profile
    args:
      - use: motorID
      - name: acc
        type: float
        range: [14.55, 59575]
        unit: step/s/s
        setting: speedProfile.acc
        description: {en: acceleration, ja: 加速度}
      - name: dec
        type: float
        range: {STEP400: [14.55, 59590], STEP800: [14.55, 59575]}
        unit: step/s/s
        setting: speedProfile.dec
        description: {en: deceleration, ja: 減速度}
      - name: maxSpeed
        type: float
        range: [15.25, 15610]
        unit: step/s
        setting: speedProfile.maxSpeed
        description: {en: maximum speed, ja: 最大速度}
    timing: stopped
    description:
      en: |-
        Sets the acc, dec, and maxSpeed of the speed profile together.

        The speed profile is the set of acceleration, deceleration and maximum speed held in the motor driver. It is not sent with each command: it applies to every motion after it is written ([[/run]], [[/goTo]] and so on). The minimum speed is set separately with [[/setMinSpeed]].

        ACC and DEC are rounded to the nearest register value, so the written value can differ by 1 LSB. MAX_SPEED alone is writable at any time, but nothing is written to a motor that replies with `MotorNotStopped`. A value outside the range is limited by the driver library. On STEP400, a maximum speed of 0 is written as 1 (the register value 0 is reserved).
      ja: |-
        スピードプロファイルの加速度（`acc`）、減速度（`dec`）、最大速度（`maxSpeed`）をまとめて設定します。

        スピードプロファイルは、モータドライバに書き込んでおく加速度・減速度・最大速度の組です。コマンドごとに送るものではなく、書き込んだ後のすべての動作（[[/run]]、[[/goTo]]など）に使われます。最小速度は[[/setMinSpeed]]で別に設定します。

        ACCとDECは最も近いレジスタ値に丸められるため、書き込まれる値は1LSBずれることがあります。MAX_SPEEDだけはいつでも書き込めますが、`MotorNotStopped`を返したモータには何も書き込まれません。範囲外の値は、ドライバライブラリによって制限されます。STEP400では、最大速度0は1として書き込まれます（レジスタ値0は予約されています）。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old values.", ja: "モータは停止中か無励磁でなければなりません。回転中のモータには`/error/command MotorNotStopped`を返し、元の値のままにします。"}
      - {version: "2.2.0", en: "`acc` and `dec` are rounded to the nearest register value, so the written value can differ by 1 LSB.", ja: "`acc`と`dec`は最も近いレジスタ値に丸められるため、書き込まれる値は1LSBずれることがあります。"}
      - {version: "2.2.0", en: "STEP400: a maximum speed of 0 is written as 1 (the register value 0 is reserved).", ja: "STEP400: 最大速度0は1として書き込まれます（レジスタ値0は予約されています）。"}
    see_also: [/getSpeedProfile, /setAcc, /setDec, /setMaxSpeed]

  - address: /getSpeedProfile
    group: speed_profile
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the acc, dec, and maxSpeed of the speed profile together.
      ja: スピードプロファイルのacc, dec, maxSpeedをまとめて取得します。
    response: [/speedProfile]
    changes:
      - {version: "2.2.0", en: "The acceleration and deceleration are reported about 4.9% smaller than before; they now match the datasheet (driver libraries v1.2.0).", ja: "加速度と減速度の返信値が、以前より約4.9% 小さくなりました。データシートに一致する値になっています（ドライバライブラリv1.2.0）。"}

  - address: /setFullstepSpeed
    group: speed_profile
    args:
      - use: motorID
      - name: fullstepSpeed
        type: float
        range: [7.63, 15625]
        unit: step/s
        setting: speedProfile.fullStepSpeed
        description: {en: threshold, ja: 切り替わる閾値}
    timing: always
    description:
      en: |-
        Sets the threshold at which the microstepping mode automatically switches to full-step mode.

        A value above the range is limited to 15625 step/s by the driver library. A value from 0 up to the lower end of the range is written as the lower end (7.63 step/s). A negative value below about -7.6 is not limited to the lower end: the driver library converts it to a huge unsigned number and limits that to the maximum, so it becomes 15625 step/s.
      ja: |-
        マイクロステップモードが自動でフルステップモードに切り替わる閾値を設定します。

        範囲を超える値は、ドライバライブラリによって15625step/sに制限されます。0から範囲の下限までの値は、下限（7.63step/s）として書き込まれます。-7.6程度より小さい負の値は下限に制限されません。ドライバライブラリが大きな符号なしの数に変換してから最大値に制限するため、15625step/sになります。
    see_also: [/getFullstepSpeed]

  - address: /getFullstepSpeed
    group: speed_profile
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the threshold at which the microstepping mode automatically switches to full-step mode.
      ja: マイクロステップモードが自動でフルステップモードに切り替わる閾値を取得します。
    response: [/fullstepSpeed]

  - address: /setMaxSpeed
    group: speed_profile
    args:
      - use: motorID
      - name: maxSpeed
        type: float
        range: [15.25, 15610]
        unit: step/s
        setting: speedProfile.maxSpeed
        description: {en: maximum speed, ja: 最大速度}
    timing: always
    description:
      en: |-
        Set the maximum speed of the speed profile

        A value outside the range is limited by the driver library. On STEP400, a maximum speed of 0 is written as 1 (the register value 0 is reserved).
      ja: |-
        スピードプロファイルの最大速度を設定します。

        範囲外の値は、ドライバライブラリによって制限されます。STEP400では、最大速度0は1として書き込まれます（レジスタ値0は予約されています）。
    changes:
      - {version: "2.2.0", en: "STEP400: a maximum speed of 0 is written as 1 (the register value 0 is reserved). STEP800 is unchanged.", ja: "STEP400: 最大速度0は1として書き込まれます（レジスタ値0は予約されています）。STEP800は変わりません。"}
    see_also: [/setSpeedProfile]

  - address: /setAcc
    group: speed_profile
    args:
      - use: motorID
      - name: acc
        type: float
        range: [14.55, 59575]
        unit: step/s/s
        setting: speedProfile.acc
        description: {en: acceleration, ja: 加速度}
    timing: stopped
    description:
      en: |-
        Sets the acceleration of the speed profile.

        The value is rounded to the nearest register value, so the written value can differ by 1 LSB. A value outside the range is limited by the driver library.

        The motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value.
      ja: |-
        スピードプロファイルの加速度を設定します。

        最も近いレジスタ値に丸められるため、書き込まれる値は1LSBずれることがあります。範囲外の値は、ドライバライブラリによって制限されます。

        モータは停止中か無励磁でなければなりません。回転中のモータには`MotorNotStopped`を返し、元の値のままにします。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: "モータは停止中か無励磁でなければなりません。回転中のモータには`/error/command MotorNotStopped`を返し、元の値のままにします。"}
      - {version: "2.2.0", en: "Rounds to the nearest register value, so the written value can differ by 1 LSB.", ja: "最も近いレジスタ値に丸められるため、書き込まれる値は1LSBずれることがあります。"}
    see_also: [/setSpeedProfile]

  - address: /setDec
    group: speed_profile
    args:
      - use: motorID
      - name: dec
        type: float
        range: {STEP400: [14.55, 59590], STEP800: [14.55, 59575]}
        unit: step/s/s
        setting: speedProfile.dec
        description: {en: deceleration, ja: 減速度}
    timing: stopped
    description:
      en: |-
        Sets the deceleration of the speed profile.

        The value is rounded to the nearest register value, so the written value can differ by 1 LSB. A value outside the range is limited by the driver library.

        The motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value.
      ja: |-
        スピードプロファイルの減速度（deceleration）を設定します。

        最も近いレジスタ値に丸められるため、書き込まれる値は1LSBずれることがあります。範囲外の値は、ドライバライブラリによって制限されます。

        モータは停止中か無励磁でなければなりません。回転中のモータには`MotorNotStopped`を返し、元の値のままにします。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: "モータは停止中か無励磁でなければなりません。回転中のモータには`/error/command MotorNotStopped`を返し、元の値のままにします。"}
      - {version: "2.2.0", en: "Rounds to the nearest register value, so the written value can differ by 1 LSB.", ja: "最も近いレジスタ値に丸められるため、書き込まれる値は1LSBずれることがあります。"}
    see_also: [/setSpeedProfile]

  - address: /setMinSpeed
    group: speed_profile
    args:
      - use: motorID
      - name: minSpeed
        type: float
        range: [0.0, 976.3]
        unit: step/s
        setting: speedProfile.minSpeed
        description: {en: Minimum speed, ja: 最小速度}
    timing: stopped
    description:
      en: |-
        Set the speed profile minimum speed. This value is also used for the motor speed of [[/releaseSw]]. When Low speed optimization ([[/enableLowSpeedOptimize]]) is enabled, the minimum speed of the speed profile is set to zero.

        While the low speed optimization is disabled, the motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value. While it is enabled, only the saved value changes and no error is sent.

        A value above the range is limited to 976.3 step/s by the driver library. A negative value below about -0.24 is not limited to 0: the driver library converts it to a huge unsigned number and limits that to the maximum, so it becomes 976.3 step/s.
      ja: |-
        スピードプロファイルの最小速度を設定します。この値は[[/releaseSw]]時のモータ回転速度にも使用されます。Low speed optimization（[[/enableLowSpeedOptimize]]）が有効になっている場合、minSpeedは強制的に0になります。

        低速最適化が無効の間は、モータは停止中か無励磁でなければなりません。回転中のモータには`MotorNotStopped`を返し、元の値のままにします。有効の間は、保存される値だけが変わり、エラーは送信されません。

        範囲を超える値は、ドライバライブラリによって976.3step/sに制限されます。-0.24程度より小さい負の値は0に制限されません。ドライバライブラリが大きな符号なしの数に変換してから最大値に制限するため、976.3step/sになります。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "While the low speed optimization is disabled, the motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: "低速最適化が無効の間は、モータは停止中か無励磁でなければなりません。回転中のモータには`/error/command MotorNotStopped`を返し、元の値のままにします。"}
      - {version: "2.2.0", en: "`/setMinSpeed 255` (all motors) checks the low speed optimization setting of each motor. It read an invalid array element.", ja: "`/setMinSpeed 255`（全モータ）は、モータごとに低速最適化の設定を確認します。以前は、不正な配列の要素を読んでいました。"}
    see_also: [/getMinSpeed]

  - address: /getMinSpeed
    group: speed_profile
    args: [{use: motorID}]
    timing: always
    description:
      en: |-
        Return the speed profile minimum speed.

        Returns 0.0 for a motor with the low speed optimization enabled: the MIN_SPEED register then holds the optimization threshold (read it with [[/getLowSpeedOptimizeThreshold]]) and the actual minimum speed is 0. For a motor with the optimization disabled, it returns the MIN_SPEED register value of the driver in step/s.
      ja: |-
        スピードプロファイルの最小速度を返します。

        低速最適化が有効なモータでは0.0を返します。このときMIN_SPEEDレジスタには最適化の閾値が入っていて（[[/getLowSpeedOptimizeThreshold]]で読み出せます）、実際の最小速度は0です。低速最適化が無効のモータでは、ドライバのMIN_SPEEDレジスタの値をstep/sで返します。
    response: [/minSpeed]
    changes:
      - {version: "2.2.0", en: "Returns 0.0 for a motor with the low speed optimization enabled. A single motor returned the MIN_SPEED register value (the threshold) and `255` (all motors) returned the stored minimum speed setting; both behave the same now.", ja: "低速最適化が有効なモータでは0.0を返します。以前は、1つのモータではMIN_SPEEDレジスタの値（閾値）を返し、`255`（全モータ）では保存されている最小速度の設定を返していました。今はどちらも同じ動作です。"}

  - address: /getSpeed
    group: speed_profile
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the current motor speed.
      ja: モータの現在の速度を返します。
    response: [/speed]

  - address: /setSpeedProfileRaw
    group: speed_profile
    args:
      - use: motorID
      - name: acc
        type: int
        range: [0, 4095]
        description: {en: acceleration (raw register value), ja: "加速度（Rawレジスタ値）"}
      - name: dec
        type: int
        range: [0, 4095]
        description: {en: deceleration (raw register value), ja: "減速度（Rawレジスタ値）"}
      - name: maxSpeed
        type: int
        range: [0, 1023]
        description: {en: maximum speed (raw register value), ja: "最大速度（Rawレジスタ値）"}
    timing: stopped
    description:
      en: |-
        Sets the acc, dec, and maxSpeed of the speed profile using raw driver IC register values.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver. The motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value.
      ja: |-
        ドライバICのレジスタ値（Raw）で、スピードプロファイルのacc, dec, maxSpeedを設定します。

        範囲外の値は拒否されません。16ビットに変換され（70000は4464になります）、さらにドライバがレジスタの幅でマスクします。モータは停止中か無励磁でなければなりません。回転中のモータには`MotorNotStopped`を返し、元の値のままにします。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "Also sets the acceleration, deceleration and maximum speed setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: "保存される設定（`/saveConfig`）と、`/resetMotorDriver`で再び適用される加速度、減速度、最大速度の設定も変更します。以前はレジスタだけを変更していたため、リセットや保存した設定で元の値に戻っていました。"}
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: "モータは停止中か無励磁でなければなりません。回転中のモータには`/error/command MotorNotStopped`を返し、元の値のままにします。"}
    see_also: [/getSpeedProfileRaw, /setSpeedProfile]

  - address: /getSpeedProfileRaw
    group: speed_profile
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the acc, dec, and maxSpeed of the speed profile as raw driver IC register values.
      ja: "ドライバICのレジスタ値（Raw）で、スピードプロファイルのacc, dec, maxSpeedを取得します。"
    response: [/speedProfileRaw]

  - address: /setMaxSpeedRaw
    group: speed_profile
    args:
      - use: motorID
      - name: maxSpeed
        type: int
        range: [0, 1023]
        description: {en: maximum speed (raw register value), ja: "最大速度（Rawレジスタ値）"}
    timing: always
    description:
      en: |-
        Sets the maximum speed of the speed profile using a raw register value.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver.

        `/setMaxSpeedRaw 0` writes 0, also on STEP400.
      ja: |-
        レジスタ値（Raw）で、スピードプロファイルの最大速度を設定します。

        範囲外の値は拒否されません。16ビットに変換され（70000は4464になります）、さらにドライバがレジスタの幅でマスクします。

        `/setMaxSpeedRaw 0`は、STEP400でも0を書き込みます。
    changes:
      - {version: "2.2.0", en: "Also sets the maximum speed setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: "保存される設定（`/saveConfig`）と、`/resetMotorDriver`で再び適用される最大速度の設定も変更します。以前はレジスタだけを変更していたため、リセットや保存した設定で元の値に戻っていました。"}
    see_also: [/setMaxSpeed]

  - address: /setMinSpeedRaw
    group: speed_profile
    args:
      - use: motorID
      - name: minSpeed
        type: int
        range: [0, 4095]
        description: {en: minimum speed (raw register value), ja: "最小速度（Rawレジスタ値）"}
    timing: stopped
    description:
      en: |-
        Sets the minimum speed of the speed profile using a raw register value.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver. While the low speed optimization is disabled, the motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value. While it is enabled, only the saved value changes and no error is sent.
      ja: |-
        レジスタ値（Raw）で、スピードプロファイルの最小速度を設定します。

        範囲外の値は拒否されません。16ビットに変換され（70000は4464になります）、さらにドライバがレジスタの幅でマスクします。低速最適化が無効の間は、モータは停止中か無励磁でなければなりません。回転中のモータには`MotorNotStopped`を返し、元の値のままにします。有効の間は、保存される値だけが変わり、エラーは送信されません。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "Also sets the minimum speed setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: "保存される設定（`/saveConfig`）と、`/resetMotorDriver`で再び適用される最小速度の設定も変更します。以前はレジスタだけを変更していたため、リセットや保存した設定で元の値に戻っていました。"}
      - {version: "2.2.0", en: "While the low speed optimization is disabled, the motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: "低速最適化が無効の間は、モータは停止中か無励磁でなければなりません。回転中のモータには`/error/command MotorNotStopped`を返し、元の値のままにします。"}
      - {version: "2.2.0", en: "Bit 12 is ignored (it switched the low speed optimization on without [[/enableLowSpeedOptimize]]). While the optimization is on, the command only changes the saved value, as [[/setMinSpeed]] does.", ja: "ビット12は無視されます（以前は、[[/enableLowSpeedOptimize]]なしで低速最適化が有効になっていました）。低速最適化が有効の間は、[[/setMinSpeed]]と同じく、保存される値だけを変更します。"}
    see_also: [/setMinSpeed]

  - address: /setFullstepSpeedRaw
    group: speed_profile
    args:
      - use: motorID
      - name: fullstepSpeed
        type: int
        range: [0, 1023]
        description: {en: full-step speed threshold (raw register value), ja: "フルステップ速度の閾値（Rawレジスタ値）"}
    timing: always
    description:
      en: |-
        Sets the full-step speed threshold using a raw register value.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver.
      ja: |-
        レジスタ値（Raw）で、フルステップに切り替わる速度の閾値を設定します。

        範囲外の値は拒否されません。16ビットに変換され（70000は4464になります）、さらにドライバがレジスタの幅でマスクします。
    changes:
      - {version: "2.2.0", en: "Also sets the full-step speed setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: "保存される設定（`/saveConfig`）と、`/resetMotorDriver`で再び適用されるフルステップ速度の設定も変更します。以前はレジスタだけを変更していたため、リセットや保存した設定で元の値に戻っていました。"}
    see_also: [/setFullstepSpeed]

  - address: /setAccRaw
    group: speed_profile
    args:
      - use: motorID
      - name: acc
        type: int
        range: [0, 4095]
        description: {en: acceleration (raw register value), ja: "加速度（Rawレジスタ値）"}
    timing: stopped
    description:
      en: |-
        Sets the acceleration of the speed profile using a raw register value.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver. The motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value.
      ja: |-
        レジスタ値（Raw）で、スピードプロファイルの加速度を設定します。

        範囲外の値は拒否されません。16ビットに変換され（70000は4464になります）、さらにドライバがレジスタの幅でマスクします。モータは停止中か無励磁でなければなりません。回転中のモータには`MotorNotStopped`を返し、元の値のままにします。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "Also sets the acceleration setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: "保存される設定（`/saveConfig`）と、`/resetMotorDriver`で再び適用される加速度の設定も変更します。以前はレジスタだけを変更していたため、リセットや保存した設定で元の値に戻っていました。"}
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: "モータは停止中か無励磁でなければなりません。回転中のモータには`/error/command MotorNotStopped`を返し、元の値のままにします。"}
    see_also: [/setAcc]

  - address: /setDecRaw
    group: speed_profile
    args:
      - use: motorID
      - name: dec
        type: int
        range: [0, 4095]
        description: {en: deceleration (raw register value), ja: "減速度（Rawレジスタ値）"}
    timing: stopped
    description:
      en: |-
        Sets the deceleration of the speed profile using a raw register value.

        A value outside the range is not rejected: it is converted to 16 bits (70000 becomes 4464) and then masked to the width of the register by the driver. The motor must be stopped or HiZ; a turning motor replies `MotorNotStopped` and keeps its old value.
      ja: |-
        レジスタ値（Raw）で、スピードプロファイルの減速度を設定します。

        範囲外の値は拒否されません。16ビットに変換され（70000は4464になります）、さらにドライバがレジスタの幅でマスクします。モータは停止中か無励磁でなければなりません。回転中のモータには`MotorNotStopped`を返し、元の値のままにします。
    errors: [MotorNotStopped]
    changes:
      - {version: "2.2.0", en: "Also sets the deceleration setting that `/saveConfig` saves and `/resetMotorDriver` applies again. Before, only the register was changed, so a reset or a saved configuration brought back the value from before.", ja: "保存される設定（`/saveConfig`）と、`/resetMotorDriver`で再び適用される減速度の設定も変更します。以前はレジスタだけを変更していたため、リセットや保存した設定で元の値に戻っていました。"}
      - {version: "2.2.0", en: "The motor must be stopped or HiZ; a turning motor replies `/error/command MotorNotStopped` and keeps its old value.", ja: "モータは停止中か無励磁でなければなりません。回転中のモータには`/error/command MotorNotStopped`を返し、元の値のままにします。"}
    see_also: [/setDec]

  # ---------------------------------------------------------------------------
  # homing
  # ---------------------------------------------------------------------------
  - address: /homing
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Start the homing movement. Move towards origin direction, stop when the HOME switch is activated. Then the motor reverses the direction and move slowly, halts when the HOME switch is not active anymore, then reset location to zero at the current point.

        This is equivalent to the following actions of executing [[/goUntil]] command, and after the motor stops on HOME switch activation, execute [[/releaseSw]] command.

        The `homingDirection` and the `homingSpeed` can be set by [[/setHomingDirection]] and [[/setHomingSpeed]] commands, as well as configuring from the configuration tool.

        Time-out can be set for each of the `/goUntil` and `/releaseSw` commands. The controller halts the motor movement if the sensor state has not changed during this time frame. The time-out values can be set from [[/setGoUntilTimeout]] and from the [[/setReleaseSwTimeout]] command.

        Depending on the state change on the homing movement, following response will be sent.
      ja: |
        原点復帰動作を行います。原点復帰方向に移動し、HOMEスイッチがオンになると停止し、方向を反転してゆっくり移動し、HOMEスイッチがオフになった時点で停止し、現在位置を0にします。

        これは[[/goUntil]]コマンドを実行し、HOMEスイッチがオンになると停止して[[/releaseSw]]コマンドを実行することに相当します。

        原点復帰方向`homingDirection`と原点復帰の速度`homingSpeed`はそれぞれ[[/setHomingDirection]]と[[/setHomingSpeed]]で設定できるほか、configToolからも設定できます。

        `/goUntil`と`/releaseSw`それぞれにタイムアウト時間が設定可能で、この時間内にスイッチの状態に変化がなかった場合はタイムアウトとして動作を中止します。この時間はぞれぞれ[[/setGoUntilTimeout]] [[/setReleaseSwTimeout]]で設定できます。

        原点復帰動作の状態変化に応じて下記の通知があります。
    response: [/homingStatus]
    errors: [CommandIgnored, BrakeEngaged, GoUntilTimeout, ReleaseSwTimeout, InServoMode]
    changes:
      - {version: "2.2.0", en: "While the brake is engaged, releasing or engaging (not while stopping or after `/free`), replies `/error/command BrakeEngaged` and does nothing. Before, it set the homing state although it did not start.", ja: "ブレーキが保持されている間、解放中、保持への移行中（停止処理中と`/free`の後は除く）は、`/error/command BrakeEngaged`を返し、何もしません。以前は、原点復帰が始まらないのに原点復帰の状態になっていました。"}
      - {version: "2.2.0", en: "The homing no longer often ends with `/homingStatus` 4 and `ReleaseSwTimeout` about 1 ms after the switch was found, instead of 3 (a timing error of the timeout check; it happened in almost every homing or almost never, depending on the start-up).", ja: "原点復帰が、センサを検出した約1ms後に、3（ReleaseSW完了）ではなく`/homingStatus` 4と`ReleaseSwTimeout`で終わることが多かった問題を修正しました（タイムアウト判定の時刻の誤差が原因で、起動のしかたによって、ほとんどの原点復帰で起きるか、ほとんど起きないかのどちらかでした）。"}
    see_also: [/getHomingStatus]

  - address: /getHomingStatus
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns current state of homing movement.
      ja: 原点復帰の現在の状態を返します。
    response: [/homingStatus]

  - address: /setHomingDirection
    group: homing
    args:
      - use: motorID
      - name: direction
        type: bool
        setting: driverSettings.homingDirection
        values:
          - {value: 1, en: Forward, ja: Forward}
          - {value: 0, en: Reverse, ja: Reverse}
    timing: always
    description:
      en: Sets the `homingDirection` for the [[/homing]] command. It can be also configured from the configuration tool.
      ja: "[[/homing]]実行時の原点復帰方向`homingDirection`を指定します。configToolからも指定できます。"
    see_also: [/getHomingDirection]

  - address: /getHomingDirection
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns `homingDirection` parameter.
      ja: "`homingDirection`を取得します。"
    response: [/homingDirection]

  - address: /setHomingSpeed
    group: homing
    args:
      - use: motorID
      - name: speed
        type: float
        range: [0.0, 15610.0]
        unit: step/s
        setting: driverSettings.homingSpeed
        description: {en: homing speed, ja: 原点復帰の速度}
    timing: always
    description:
      en: |-
        Sets the `homingSpeed` when executing the command [[/homing]]. It can be configured from the configuration tool.

        A value outside the range is not rejected: it is limited to 0-15610.
      ja: |-
        [[/homing]]実行時の原点復帰の速度`homingSpeed`を指定します。configToolからも指定できます。

        範囲外の値は拒否されず、0〜15610に制限されます。
    see_also: [/getHomingSpeed]

  - address: /getHomingSpeed
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns `homingSpeed` parameter.
      ja: "`homingSpeed`を取得します。"
    response: [/homingSpeed]

  - address: /goUntil
    group: homing
    args:
      - use: motorID
      - name: ACT
        type: bool
        values:
          - {value: 0, en: Reset the ABS_POS register, ja: ABS_POSレジスタをリセットします}
          - {value: 1, en: Copy the value of the ABS_POS register to the MARK register, ja: ABS_POSレジスタの内容をMARKレジスタにコピーします}
      - name: speed
        type: float
        range: [-15625, 15625]
        unit: step/s
    timing: always
    description:
      en: |
        Move the motor at specified speed and direction. When the HOME switch turns on (the HOME switch terminal is closed), process ABS_POS register according to the ACT value.
        The motor will softStop afterwards, but if the SW_MODE is set to 0 in the [[/setHomeSwMode]] command, it will be a hardStop instead. This command will keep the motor to the BUSY state until it stops.

        The sign of the speed is the direction. A speed whose absolute value is above the range is limited to the largest register value (0xFFFFF, about 15625 step/s) by the driver library.
      ja: |-
        指定の速度で回転し、HOMEスイッチがオンになるとACTの値に応じた処理を行います。
        その後softStopしますが、[[/setHomeSwMode]]コマンドでSW_MODEが0に設定されていると、softStopではなくhardStopになります。このコマンドは、モータが停止するまでBUSY状態を保ちます。

        速度の符号が方向になります。絶対値が範囲を超える速度は、ドライバライブラリによってレジスタの最大値（0xFFFFF、約15625step/s）に制限されます。
    errors: [BrakeEngaged, GoUntilTimeout, HomeSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "An activated home switch is reported as `/error/command HomeSwActivating`, the text in the error list. It was sent as `HomeSwActivated`. It now follows [[/reportError]] like the other command errors.", ja: "HOMEスイッチがオンの場合は、エラーの一覧にあるとおり`/error/command HomeSwActivating`として送信されます。以前は`HomeSwActivated`として送信されていました。他のコマンドのエラーと同じように、[[/reportError]]に従います。"}
      - {version: "2.2.0", en: "For a motor in the servo mode, replies `/error/command InServoMode` and does nothing. Before, the command was sent to the driver. With 255, only the motors in the servo mode reply the error; the others execute the command.", ja: "サーボモードのモータには`/error/command InServoMode`を返し、何もしません。以前は、コマンドがドライバに送られていました。255のときは、サーボモードのモータだけがエラーを返し、他のモータはコマンドを実行します。"}
    see_also: [/setGoUntilTimeout, /releaseSw, /goUntilRaw]

  - address: /setGoUntilTimeout
    group: homing
    args:
      - use: motorID
      - name: timeOut
        type: int
        range: [0, 2147483647]
        unit: ms
        setting: driverSettings.goUntilTimeout
        description: {en: Time-out duration, ja: タイムアウト時間}
    timing: always
    description:
      en: |-
        Sets the time-out duration when executing [[/goUntil]] command. If the sensor did not detect during this time frame, the controller will regard time-out and halts the movement. Specify 0 to disable the timeout. It can also be configured from the configuration tool.

        A negative value replies `CommandIgnored` and nothing is applied. The maximum is 2147483647. The automatic hard stop at the timeout is not sent to a motor whose driver is HiZ (the timeout error is still sent).
      ja: |-
        [[/goUntil]]実行時のタイムアウト時間を指定します。この時間内にスイッチがオンにならなかった場合にはtimeoutとして動作を中止します。0を指定するとタイムアウトが無効になります。configToolからも指定できます。

        負の値には`CommandIgnored`を返し、何も適用されません。最大値は2147483647です。タイムアウトでの自動の即停止は、ドライバが無励磁のモータには送られません（タイムアウトのエラーは送信されます）。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A negative value replies `/error/command CommandIgnored` and nothing is applied. Before, it became about 49 days.", ja: "負の値には`/error/command CommandIgnored`を返し、何も適用されません。以前は約49日になっていました。"}
      - {version: "2.2.0", en: "The hard stop at the timeout is not sent to a motor whose driver is HiZ, also with the brake disabled (a hard stop energizes a HiZ driver). The timeout error is still sent.", ja: "タイムアウト時の即停止は、ドライバが無励磁のモータには送りません。電磁ブレーキが無効でも同じです（即停止は無励磁のドライバを励磁してしまうため）。タイムアウトのエラーは送信されます。"}
    see_also: [/getGoUntilTimeout]

  - address: /getGoUntilTimeout
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the time-out duration when executing [[/goUntil]] command.
      ja: "[[/goUntil]]実行時のタイムアウト時間を取得します。"
    response: [/goUntilTimeout]

  - address: /releaseSw
    group: homing
    args:
      - use: motorID
      - name: ACT
        type: bool
        values:
          - {value: 0, en: Reset the ABS_POS register, ja: ABS_POSレジスタをリセットします}
          - {value: 1, en: Copy the value of the ABS_POS register to the MARK register, ja: ABS_POSレジスタの内容をMARKレジスタにコピーします}
      - name: DIR
        type: bool
        values:
          - {value: 1, en: Forward, ja: 正転方向}
          - {value: 0, en: Reverse, ja: 逆転方向}
    timing: always
    description:
      en: Move at minimum speed (5[step/s] by default) in the specified direction until the HOME switch pin becomes open. Then it will process the ABS_POS register according to the value of ACT. The process of the ACT is same as the [[/goUntil]] command. Then halt the motor with hardStop.
      ja: 指定方向にminimum speed（初期状態では5[step/s]）で回転し、HOMEスイッチがオフになると、ACTの値に応じた処理を行います。ACTの処理内容は[[/goUntil]]と同じです。その後hardStopします。
    errors: [BrakeEngaged, ReleaseSwTimeout, InServoMode]
    changes:
      - {version: "2.2.0", en: "`ACT` is read like the other boolean arguments (a number of 1.0 or more, or a positive integer, is true). It was read as an integer, so 0.5 was 0.", ja: "`ACT`は、他の真偽値の引数と同じように読まれます（1.0以上の数か、正の整数が真）。以前は整数として読まれていたため、0.5は0になっていました。"}
      - {version: "2.2.0", en: "For a motor in the servo mode, replies `/error/command InServoMode` and does nothing. Before, the command was sent to the driver. With 255, only the motors in the servo mode reply the error; the others execute the command.", ja: "サーボモードのモータには`/error/command InServoMode`を返し、何もしません。以前は、コマンドがドライバに送られていました。255のときは、サーボモードのモータだけがエラーを返し、他のモータはコマンドを実行します。"}
    see_also: [/setReleaseSwTimeout, /setMinSpeed]

  - address: /setReleaseSwTimeout
    group: homing
    args:
      - use: motorID
      - name: timeOut
        type: int
        range: [0, 2147483647]
        unit: ms
        setting: driverSettings.releaseSwTimeout
        description: {en: Time-out duration, ja: タイムアウト時間}
    timing: always
    description:
      en: |-
        Sets the time-out duration when executing [[/releaseSw]] command. If the sensor cannot be released during this time frame, halt the movement as time-out. Specify 0 to disable the timeout. It can be configured from the configuration tool.

        A negative value replies `CommandIgnored` and nothing is applied. The maximum is 2147483647. The automatic hard stop at the timeout is not sent to a motor whose driver is HiZ (the timeout error is still sent).
      ja: |-
        [[/releaseSw]]実行時のタイムアウト時間を指定します。この時間内にスイッチがオフにならなかった場合にはtimeoutとして動作を中止します。0を指定するとタイムアウトが無効になります。configToolからも指定できます。

        負の値には`CommandIgnored`を返し、何も適用されません。最大値は2147483647です。タイムアウトでの自動の即停止は、ドライバが無励磁のモータには送られません（タイムアウトのエラーは送信されます）。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A negative value replies `/error/command CommandIgnored` and nothing is applied. Before, it became about 49 days.", ja: "負の値には`/error/command CommandIgnored`を返し、何も適用されません。以前は約49日になっていました。"}
      - {version: "2.2.0", en: "The hard stop at the timeout is not sent to a motor whose driver is HiZ, also with the brake disabled (a hard stop energizes a HiZ driver). The timeout error is still sent.", ja: "タイムアウト時の即停止は、ドライバが無励磁のモータには送りません。電磁ブレーキが無効でも同じです（即停止は無励磁のドライバを励磁してしまうため）。タイムアウトのエラーは送信されます。"}
    see_also: [/getReleaseSwTimeout]

  - address: /getReleaseSwTimeout
    group: homing
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the time-out duration when executing [[/releaseSw]] command.
      ja: "[[/releaseSw]]実行時のタイムアウト時間を取得します。"
    response: [/releaseSwTimeout]

  # ---------------------------------------------------------------------------
  # sensors
  # ---------------------------------------------------------------------------
  - address: /enableHomeSwReport
    group: sensors
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportHomeSwStatus}
    timing: always
    description:
      en: Sets the following message to be sent automatically when conditional change of the HOME switch of the specified motor is detected. The response message is same as [[/getHomeSw]] command.
      ja: 指定したモータのHOME端子の状態に変化があったら自動でメッセージを送信する設定を行います。送信されるメッセージは[[/getHomeSw]]の返信と同じです。
    notifies: [/homeSw]

  - address: /enableSwEventReport
    group: sensors
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportSwEvn}
    timing: always
    description:
      en: |
        Sets the following message to be sent automatically when the specified motor's HOME switch terminal state drops from HIGH level to LOW (Falling Edge).
        While the [[/enableHomeSwReport]] command observes the status by polling the STATUS register of motor driver IC from microcomputer's firmware, this `/enableSwEventReport` detects the event by driver IC's hardware, able to pick up the sensor detection shorter than 1ms.
      ja: |
        指定したモータのHOME端子の状態がHIGHレベルからLOWレベルに遷移した際（Falling Edge）に自動でメッセージを送信する設定を行います。
        [[/enableHomeSwReport]]はMCUのファームウェア上から約1ms毎にモータドライバICのSTATUSレジスタをポーリングすることによって状態を監視していますが、この`/enableSwEventReport`のほうはドライバIC内でハードウェアによってイベントが検出されるため、1ms以下のごくわずかな時間だけスイッチがオンになった場合でももとり逃しません。
    notifies: [/swEvent]

  - address: /getHomeSw
    group: sensors
    args: [{use: motorID}]
    timing: always
    description:
      en: Gets the status of the HOME switch, closed or opened.
      ja: HOMEスイッチの状態を取得します。
    response: [/homeSw]

  - address: /enableLimitSwReport
    group: sensors
    args:
      - use: motorID
      - {use: enable, setting: alarmAndReport.reportLimitSwStatus}
    boards: [STEP400]
    timing: always
    description:
      en: Sets automatic response when conditional change on the specified motor's LIMIT switch terminal is detected. The sent message is as same as the response from [[/getLimitSw]] command.
      ja: 指定したモータのLIMIT端子の状態に変化があったら自動でメッセージを送信する設定を行います。送信されるメッセージは[[/getLimitSw]]の返信と同じです。
    notifies: [/limitSw]

  - address: /getLimitSw
    group: sensors
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: Returns the status of LIMIT switch.
      ja: LIMITスイッチの状態を取得します。
    response: [/limitSw]

  - address: /setHomeSwMode
    group: sensors
    args:
      - use: motorID
      - name: SW_MODE
        type: bool
        setting: driverSettings.homeSwMode
        values:
          - {value: 0, en: HardStop interrupt (stop immediately), ja: HardStop interrupt（即停止する）}
          - {value: 1, en: User disposal (not stop), ja: User disposal（停止しない）}
        description: {en: Switch mode, ja: スイッチがオンになったときの動作}
    timing: hiz
    description:
      en: |-
        Sets switch mode whether to stop immediately when the HOME switch terminal state changes (falling edge).

        The outputs must be HiZ; otherwise `MotorNotHiZ` is replied and nothing is applied.
      ja: |-
        HOME端子に入力があった際に即停止するかどうか（Switch mode）を指定します。

        出力は無励磁でなければなりません。そうでないときは`MotorNotHiZ`を返し、何も適用されません。
    errors: [MotorNotHiZ]
    changes:
      - {version: "2.2.0", en: "The outputs must be HiZ (SW_MODE of the CONFIG register is writable only in HiZ); otherwise `/error/command MotorNotHiZ` and nothing is applied.", ja: "出力は無励磁でなければなりません（CONFIGレジスタのSW_MODEは無励磁のときだけ書き込めます）。そうでないときは`/error/command MotorNotHiZ`を返し、何も適用されません。"}
    see_also: [/getHomeSwMode]

  - address: /getHomeSwMode
    group: sensors
    args: [{use: motorID}]
    timing: always
    description:
      en: Get the Switch mode described above.
      ja: 上記のSwitch modeを取得します。
    response: [/homeSwMode]
    see_also: [/setHomeSwMode]

  - address: /setLimitSwMode
    group: sensors
    args:
      - use: motorID
      - name: SW_MODE
        type: bool
        setting: driverSettings.limitSwMode
        values:
          - {value: 0, en: HardStop interrupt (Immediate stop), ja: HardStop interrupt（即停止する）}
          - {value: 1, en: User disposal (Does not stop), ja: User disposal（停止しない）}
        description: {en: Switch mode, ja: スイッチがオンになったときの動作}
    boards: [STEP400]
    timing: always
    description:
      en: Sets the Switch mode whether to stop the motor immediately when the LIMIT switch terminal condition is changed.
      ja: LIMIT端子に入力があった際に即停止するかどうか（Switch mode）を指定します。
    changes:
      - {version: "2.2.0", en: "The automatic hard stop at the limit switch (`SW_HARD_STOP`) is not sent to a motor whose driver is HiZ, also with the brake disabled (a hard stop energizes a HiZ driver).", ja: "ドライバが無励磁のモータには、LIMITスイッチでの自動の即停止（`SW_HARD_STOP`）を送りません。電磁ブレーキが無効でも同じです（即停止は無励磁のドライバを励磁してしまうため）。"}
    see_also: [/getLimitSwMode]

  - address: /getLimitSwMode
    group: sensors
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: Get the Switch mode described above.
      ja: 上記のSwitch modeを取得します。
    response: [/limitSwMode]
    see_also: [/setLimitSwMode]

  # ---------------------------------------------------------------------------
  # position
  # ---------------------------------------------------------------------------
  - address: /setPosition
    group: position
    args:
      - use: motorID
      - name: newPosition
        type: int
        range: [-2097152, 2097151]
        description: {en: specified coordinates, ja: 指定座標}
    timing: stopped
    description:
      en: |-
        Rewrites ABS_POS register to the specified coordinates. The current motor position is set to the specified coordinates.

        Do not use it while the motor is running or in the servo mode. There is no guard: if the driver refuses the write, `CommandIgnored` is sent.

        A value outside the range is not rejected: the driver truncates it to 22 bits.
      ja: |-
        ABS_POSレジスタを指定座標に書き換えます。現在のモータ位置が指定座標になります。

        モータの回転中やサーボモード中には使わないでください。ガードはありません。ドライバが書き込みを拒否した場合は`CommandIgnored`が送信されます。

        範囲外の値は拒否されません。ドライバが22ビットに切り捨てます。
    errors: [CommandIgnored]
    see_also: [/getPosition, /resetPos]

  - address: /getPosition
    group: position
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Returns the contents of the ABS_POS register (current position).
        [[/setPositionReportInterval]] can make the controller to send this message with a specified interval.
      ja: |
        ABS_POSレジスタの内容（現在位置）を取得します。

        [[/setPositionReportInterval]]コマンドで、指定間隔で自動送信させることもできます。
    response: [/position]

  - address: /getPositionList
    group: position
    timing: always
    description:
      en: |
        Returns the current position of all motors at once. `/getPosition 255` returns individual messages for each motor but this command returns single message with a position list.
        [[/setPositionListReportInterval]] can make the controller to send this list with a specified interval.
      ja: |
        全モータの現在位置（`ABS_POS`）を取得します。`/getPosition 255`を送信した場合は、モータの軸数分の個別のメッセージが返されますが、このコマンドは、すべてのモータの位置をリストにまとめた1個のメッセージが返されます。

        [[/setPositionListReportInterval]]コマンドで、指定間隔で自動送信させることもできます。
    response: [/positionList]
    see_also: [/getPosition]

  - address: /resetPos
    group: position
    args: [{use: motorID}]
    timing: always
    description:
      en: |-
        Reset ABS_POS register to 0.

        Do not use it while the motor is running or in the servo mode. There is no guard: if the driver refuses the write, `CommandIgnored` is sent.
      ja: |-
        ABS_POSレジスタを0にリセットします。

        モータの回転中やサーボモード中には使わないでください。ガードはありません。ドライバが書き込みを拒否した場合は`CommandIgnored`が送信されます。
    errors: [CommandIgnored]
    see_also: [/setPosition]

  - address: /setElPos
    group: position
    args:
      - use: motorID
      - name: newFullstep
        type: int
        range: [0, 3]
        description: {en: Fullstep position, ja: フルステップでの位置}
      - name: newMicrostep
        type: int
        range: [0, 127]
        description: {en: Microstep position, ja: マイクロステップでの位置}
    timing: stopped
    description:
      en: |-
        Set the electrical position of the motor. The microstep is expressed in step/128, and the value has to be matched with the current microstep mode.

        Use it while the motor is HiZ. There is no guard on the motor state: the L6470 also refuses the write while the motor is stopped and energized (which the datasheet allows), and then `CommandIgnored` is sent.

        A full step outside 0-3 or a microstep outside 0-127 replies `CommandIgnored` and nothing is applied.
      ja: |-
        モータの電気的位置（electrical position）を設定します。マイクロステップは0〜127の128段階で表現されていますので、設定時は現在のマイクロステップと齟齬のない値を設定する必要があります。

        モータが無励磁のときに使ってください。モータの状態に対するガードはありません。L6470は、モータが停止して励磁されているとき（データシートでは書き込める）も書き込みを拒否し、そのときは`CommandIgnored`が送信されます。

        0〜3の範囲外のフルステップ、0〜127の範囲外のマイクロステップには`CommandIgnored`を返し、何も適用されません。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A full step outside 0-3 or a microstep outside 0-127 replies `/error/command CommandIgnored` and nothing is applied. Before, they were clamped.", ja: "0〜3の範囲外のフルステップ、0〜127の範囲外のマイクロステップには、`/error/command CommandIgnored`を返し、何も適用されません。以前は範囲内に丸められていました。"}
    see_also: [/getElPos]

  - address: /getElPos
    group: position
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the current electrical position of the motor.
      ja: モータの電気的位置（electrical position）を取得します。
    response: [/elPos]

  - address: /setMark
    group: position
    args:
      - use: motorID
      - name: MARK
        type: int
        description: {en: Coordination to be set, ja: 設定する座標}
    timing: always
    description:
      en: |-
        Set the MARK register to arbitrary position.

        A value outside the range is not rejected: the driver truncates it to 22 bits.
      ja: |-
        markを任意の位置に設定します。

        範囲外の値は拒否されません。ドライバが22ビットに切り捨てます。
    see_also: [/getMark, /goMark]

  - address: /getMark
    group: position
    args: [{use: motorID}]
    timing: always
    description:
      en: Get the MARK position.
      ja: MARKの位置を取得します。
    response: [/mark]

  - address: /goHome
    group: position
    args: [{use: motorID}]
    timing: motion_start
    description:
      en: Move the motor to the HOME position (zero position) according to the speed profile.
      ja: HOME位置までスピードプロファイルに従って移動します。
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "Judges its direction correctly when the home switch or the limit switch prohibits a motion ([[/setProhibitMotionOnHomeSw]], [[/setProhibitMotionOnLimitSw]]): it is the sign of the 22-bit difference to the target, the way the driver goes (the shortest way). The direction was reversed for a target less than 2048 steps away (so a short move away from the switch was refused with `HomeSwActivating` / `LimitSwActivating` and a short move towards it was started), and wrong again beyond 2^21 steps.", ja: "HOMEスイッチまたはLIMITスイッチが動作を禁止する場合（[[/setProhibitMotionOnHomeSw]]、[[/setProhibitMotionOnLimitSw]]）の方向を、正しく判定します。目標との22ビットの差の符号で決まり、ドライバが進む向き（最短経路）と同じです。以前は、目標が2048ステップ未満の距離にあると方向が逆になり（スイッチから離れる短い移動が`HomeSwActivating` / `LimitSwActivating`で拒否され、スイッチに向かう短い移動が開始されていました）、2^21ステップを超えるとまた誤っていました。"}
      - {version: "2.2.0", en: "On a busy motor, the STATUS register is read with GetParam, which does not clear the latched flags. Before, it was read with GetStatus, so the status poll could miss a flag and the report (`/overCurrent`, `/stall`, `/swEvent`, `/uvlo`, ...) was lost.", ja: "BUSYのモータでは、ラッチされたフラグを消さないGetParamでSTATUSレジスタを読みます。以前はGetStatusで読んでいたため、STATUSレジスタの読み出しがフラグを見逃し、通知（`/overCurrent`、`/stall`、`/swEvent`、`/uvlo`など）が失われることがありました。"}

  - address: /goMark
    group: position
    args: [{use: motorID}]
    timing: motion_start
    description:
      en: Move the motor to the MARK position according to the speed profile.
      ja: MARK位置までスピードプロファイルに従って移動します。
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "Judges its direction correctly when the home switch or the limit switch prohibits a motion ([[/setProhibitMotionOnHomeSw]], [[/setProhibitMotionOnLimitSw]]): it is the sign of the 22-bit difference to the target, the way the driver goes (the shortest way). The direction was reversed for a target less than 2048 steps away (so a short move away from the switch was refused with `HomeSwActivating` / `LimitSwActivating` and a short move towards it was started), and wrong again beyond 2^21 steps.", ja: "HOMEスイッチまたはLIMITスイッチが動作を禁止する場合（[[/setProhibitMotionOnHomeSw]]、[[/setProhibitMotionOnLimitSw]]）の方向を、正しく判定します。目標との22ビットの差の符号で決まり、ドライバが進む向き（最短経路）と同じです。以前は、目標が2048ステップ未満の距離にあると方向が逆になり（スイッチから離れる短い移動が`HomeSwActivating` / `LimitSwActivating`で拒否され、スイッチに向かう短い移動が開始されていました）、2^21ステップを超えるとまた誤っていました。"}
      - {version: "2.2.0", en: "On a busy motor, the STATUS register is read with GetParam, which does not clear the latched flags. Before, it was read with GetStatus, so the status poll could miss a flag and the report (`/overCurrent`, `/stall`, `/swEvent`, `/uvlo`, ...) was lost.", ja: "BUSYのモータでは、ラッチされたフラグを消さないGetParamでSTATUSレジスタを読みます。以前はGetStatusで読んでいたため、STATUSレジスタの読み出しがフラグを見逃し、通知（`/overCurrent`、`/stall`、`/swEvent`、`/uvlo`など）が失われることがありました。"}
    see_also: [/setMark]

  # ---------------------------------------------------------------------------
  # motion
  # ---------------------------------------------------------------------------
  - address: /run
    group: motion
    args:
      - use: motorID
      - name: speed
        type: float
        range: [-15625, 15625]
        unit: step/s
        description: {en: Rotation speed, ja: 回転速度}
    timing: motion_start
    description:
      en: |-
        Rotates the motor at specified speed. The acceleration is controlled with the pre-set speed profile. The speed is limited by maxSpeed. It remains in the BUSY state until the motor reaches the specified speed.

        The sign of the speed is the direction. A speed whose absolute value is above the range is limited to the largest register value (0xFFFFF, about 15625 step/s) by the driver library.
      ja: |-
        モータを指定速度で回転させます。事前に設定したスピードプロファイルの加速度に従って加速します。指定する回転速度は、maxSpeedを超えるとmaxSpeedでリミットされます。指定速度に到達するまではBUSY状態になります。

        速度の符号が方向になります。絶対値が範囲を超える速度は、ドライバライブラリによってレジスタの最大値（0xFFFFF、約15625step/s）に制限されます。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/runRaw, /combine/run]

  - address: /move
    group: motion
    args:
      - use: motorID
      - name: step
        type: int
        description: {en: Moving step counts, ja: 移動ステップ数}
    timing: [stopped, motion_start]
    description:
      en: |-
        Moves specified number of steps according to the pre-set speed profile. It remains in the BUSY state until it reaches the specified step count. This command can only execute when the motor is stopped.

        A step count whose absolute value is above 4,194,303 (22 bits) is not rejected: it is limited to 4,194,303 by the driver library.
      ja: |-
        事前に設定したスピードプロファイルに従って、指定ステップ数移動します。指定ステップ数を移動し終わるまではBUSY状態になります。このコマンドはモータが停止していないと実行できません。

        絶対値が4,194,303（22ビット）を超えるステップ数は拒否されず、ドライバライブラリによって4,194,303に制限されます。
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/combine/move]

  - address: /goTo
    group: motion
    args:
      - use: motorID
      - name: position
        type: int
        range: [-2097152, 2097151]
        description: {en: Destination, ja: 目標位置}
    timing: motion_start
    description:
      en: |
        Moves to the specified position in the shortest route according to the pre-set speed profile. Remains in the BUSY state until it finishes moving to the specified position.
        Inside the driver, -2,097,152 and 2,097,151 are located next to each other in a loop.

        A position outside the range is not rejected. A position above 4,194,303 is limited to 4,194,303 by the driver library, which the driver reads as -1. Any other position is cut to its lower 22 bits and read as a signed number: 2,097,152 becomes -2,097,152 and -2,097,153 becomes 2,097,151.
      ja: |-
        事前に設定したスピードプロファイルに従って、指定位置まで最短経路で移動します。指定位置まで移動し終わるまではBUSY状態になります。

        ※ドライバ内部では -2,097,152と2,097,151は1周して隣り合った位置になっています。

        範囲外の位置は拒否されません。4,194,303を超える位置は、ドライバライブラリによって4,194,303に制限され、ドライバはこれを -1として読みます。それ以外の位置は、下位22ビットだけが使われ、符号付きの数として読まれます。2,097,152は -2,097,152に、-2,097,153は2,097,151になります。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "Judges its direction correctly when the home switch or the limit switch prohibits a motion ([[/setProhibitMotionOnHomeSw]], [[/setProhibitMotionOnLimitSw]]): it is the sign of the 22-bit difference to the target, the way the driver goes (the shortest way). The direction was reversed for a target less than 2048 steps away (so a short move away from the switch was refused with `HomeSwActivating` / `LimitSwActivating` and a short move towards it was started), and wrong again beyond 2^21 steps.", ja: "HOMEスイッチまたはLIMITスイッチが動作を禁止する場合（[[/setProhibitMotionOnHomeSw]]、[[/setProhibitMotionOnLimitSw]]）の方向を、正しく判定します。目標との22ビットの差の符号で決まり、ドライバが進む向き（最短経路）と同じです。以前は、目標が2048ステップ未満の距離にあると方向が逆になり（スイッチから離れる短い移動が`HomeSwActivating` / `LimitSwActivating`で拒否され、スイッチに向かう短い移動が開始されていました）、2^21ステップを超えるとまた誤っていました。"}
      - {version: "2.2.0", en: "On a busy motor, the STATUS register is read with GetParam, which does not clear the latched flags. Before, it was read with GetStatus, so the status poll could miss a flag and the report (`/overCurrent`, `/stall`, `/swEvent`, `/uvlo`, ...) was lost.", ja: "BUSYのモータでは、ラッチされたフラグを消さないGetParamでSTATUSレジスタを読みます。以前はGetStatusで読んでいたため、STATUSレジスタの読み出しがフラグを見逃し、通知（`/overCurrent`、`/stall`、`/swEvent`、`/uvlo`など）が失われることがありました。"}
    see_also: [/goToDir, /combine/goTo]

  - address: /goToDir
    group: motion
    args:
      - use: motorID
      - name: DIR
        type: bool
        description: {en: Rotation direction, ja: 回転方向}
      - name: position
        type: int
        range: [-2097152, 2097151]
        description: {en: Destination, ja: 目標位置}
    timing: motion_start
    description:
      en: |-
        Moves to the specified position in the specified direction according to the pre-set speed profile. Remains in the BUSY state until it finishes moving to the specified position.

        A position outside the range is not rejected. A position above 4,194,303 is limited to 4,194,303 by the driver library, which the driver reads as -1. Any other position is cut to its lower 22 bits and read as a signed number: 2,097,152 becomes -2,097,152 and -2,097,153 becomes 2,097,151.
      ja: |-
        事前に設定したスピードプロファイルに従って、指定位置まで指定方向で移動します。指定位置まで移動し終わるまではBUSY状態になります。

        範囲外の位置は拒否されません。4,194,303を超える位置は、ドライバライブラリによって4,194,303に制限され、ドライバはこれを -1として読みます。それ以外の位置は、下位22ビットだけが使われ、符号付きの数として読まれます。2,097,152は -2,097,152に、-2,097,153は2,097,151になります。
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "On a busy motor, the STATUS register is read with GetParam, which does not clear the latched flags. Before, it was read with GetStatus, so the status poll could miss a flag and the report (`/overCurrent`, `/stall`, `/swEvent`, `/uvlo`, ...) was lost.", ja: "BUSYのモータでは、ラッチされたフラグを消さないGetParamでSTATUSレジスタを読みます。以前はGetStatusで読んでいたため、STATUSレジスタの読み出しがフラグを見逃し、通知（`/overCurrent`、`/stall`、`/swEvent`、`/uvlo`など）が失われることがありました。"}
    see_also: [/goTo, /combine/goToDir]

  - address: /softStop
    group: motion
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        After decelerating according to the speed profile, the motor stops while it is kept excited. Remains in the BUSY state until the motor stops. If it was originally in the High Z state, the motor will be excited while it keeps its position.
        If it was in the servo mode, the mode will be released.

        With the electromagnetic brake enabled, the command does nothing while the brake is engaged or after [[/free]] (the motor is HiZ). During the deceleration of [[/softHiZ]] or `/activate 0` (brake state 3), the command is executed and cancels the engaging: the brake stays released (state 2).
      ja: |-
        スピードプロファイルに従って減速したのち、モータを励磁したまま停止します。モータが停止するまではBUSY状態になります。もともと無励磁状態だった場合は、停止したままモータが励磁します。

        サーボモードだった場合は解除されます。

        電磁ブレーキが有効なとき、ブレーキが保持されている間と[[/free]]の後（モータが無励磁）は、何もしません。[[/softHiZ]]または`/activate 0`の減速中（ブレーキの状態3）は、コマンドが実行され、ブレーキの保持を取り消します。ブレーキは解放されたままになります（状態2）。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "With the brake enabled, does nothing while the brake is engaged or after `/free` (motor HiZ). Before, it energized the motor and left the brake state engaged, so `/activate 0` and `/hardHiZ` could not make the motor HiZ again.", ja: "電磁ブレーキが有効なとき、ブレーキが保持されている間と`/free`の後（モータが無励磁）は、何もしません。以前は、モータを励磁してブレーキの状態は保持のままにしていたため、`/activate 0`と`/hardHiZ`でモータを再び無励磁にできませんでした。"}
      - {version: "2.2.0", en: "Cancels pending motion, also for a motor with the brake disabled: a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: "保留中の動作を取り消します。ブレーキが無効なモータでも同じです。取り消されるのは、BUSYフラグが下りるのを待っている`/goTo`、`/goToDir`、`/goHome`、`/goMark`（以前は、モータがBUSYでなくなったときに送られていたため、止まっていたモータが再び動き出していました）、原点復帰（以前は、そのタイムアウトで送られる即停止が、その間に無励磁になったモータを励磁していました）、サーボモードです。"}
    see_also: [/combine/softStop]

  - address: /hardStop
    group: motion
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Immediately stops the motor and leaves it excited. Remains in the BUSY state until the motor stops. If it was originally in the High Z state, the motor is excited while it keeps its position.
        If it was in the servo mode, the mode will be released.

        With the electromagnetic brake enabled, the command does nothing while the brake is engaged or after [[/free]] (the motor is HiZ). During the deceleration of [[/softHiZ]] or `/activate 0` (brake state 3), the command is executed and cancels the engaging: the brake stays released (state 2).
      ja: |-
        モータを即停止し、励磁したままにします。モータが停止するまではBUSY状態になります。もともと無励磁状態だった場合は、停止したままモータが励磁します。

        サーボモードだった場合は解除されます。

        電磁ブレーキが有効なとき、ブレーキが保持されている間と[[/free]]の後（モータが無励磁）は、何もしません。[[/softHiZ]]または`/activate 0`の減速中（ブレーキの状態3）は、コマンドが実行され、ブレーキの保持を取り消します。ブレーキは解放されたままになります（状態2）。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "With the brake enabled, does nothing while the brake is engaged or after `/free` (motor HiZ). Before, it energized the motor and left the brake state engaged, so `/activate 0` and `/hardHiZ` could not make the motor HiZ again.", ja: "電磁ブレーキが有効なとき、ブレーキが保持されている間と`/free`の後（モータが無励磁）は、何もしません。以前は、モータを励磁してブレーキの状態は保持のままにしていたため、`/activate 0`と`/hardHiZ`でモータを再び無励磁にできませんでした。"}
      - {version: "2.2.0", en: "Cancels pending motion, also for a motor with the brake disabled: a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: "保留中の動作を取り消します。ブレーキが無効なモータでも同じです。取り消されるのは、BUSYフラグが下りるのを待っている`/goTo`、`/goToDir`、`/goHome`、`/goMark`（以前は、モータがBUSYでなくなったときに送られていたため、止まっていたモータが再び動き出していました）、原点復帰（以前は、そのタイムアウトで送られる即停止が、その間に無励磁になったモータを励磁していました）、サーボモードです。"}
    see_also: [/combine/hardStop]

  - address: /softHiZ
    group: motion
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Decelerate according to the speed profile, then stop the motor and release excitation. When the excitation is released, it goes into the High Z state. It remains in the BUSY state until the motor is stopped.
        If it was in the servo mode, it will be released.
        if electromagnetic brake mode is enabled, the controller puts the brake into hold state, and then transits to High Z state.
      ja: |
        スピードプロファイルに従って減速停止してから、モータを無励磁にします。モータが停止するまではBUSY状態になります。

        サーボモードだった場合は解除されます。

        電磁ブレーキモードが有効になっている場合は、電磁ブレーキを保持状態にしてから無励磁状態に移行します。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "With the brake enabled, on a stopped motor the brake is engaged at the next status read (up to 5 ms later). The stop is judged on a status read after the command.", ja: "電磁ブレーキが有効で、モータが停止しているときは、次のSTATUSレジスタの読み出し（最大5ms後）でブレーキを保持します。停止の判定は、コマンドの後のSTATUSレジスタの読み出しで行います。"}
      - {version: "2.2.0", en: "A motion command (`/run`, `/move`, `/goTo`, ...) or `/activate 1` during the deceleration cancels the engaging; the brake stays released. Before, the brake engaged when the motor stopped later.", ja: "減速中に動作コマンド（`/run`、`/move`、`/goTo`など）か`/activate 1`を受け取ると、ブレーキの保持を取り消し、ブレーキは解放されたままになります。以前は、モータがその後止まったときにブレーキが保持されていました。"}
      - {version: "2.2.0", en: "After `/free`, the brake is engaged at once (the motor is already HiZ).", ja: "`/free`の後は、ブレーキをすぐに保持します（モータはすでに無励磁です）。"}
      - {version: "2.2.0", en: "Cancels pending motion, also for a motor with the brake disabled: a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: "保留中の動作を取り消します。ブレーキが無効なモータでも同じです。取り消されるのは、BUSYフラグが下りるのを待っている`/goTo`、`/goToDir`、`/goHome`、`/goMark`（以前は、モータがBUSYでなくなったときに送られていたため、止まっていたモータが再び動き出していました）、原点復帰（以前は、そのタイムアウトで送られる即停止が、その間に無励磁になったモータを励磁していました）、サーボモードです。"}
    see_also: [/combine/softHiZ, /enableElectromagnetBrake]

  - address: /hardHiZ
    group: motion
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Immediately stops the motor and releases the stepper excitation. When the motor excitation is released, it goes into the High Z state. Remains in the BUSY state until the motor is stopped.
        If it was in the servo mode, it will be released.
        if electromagnetic brake mode is enabled, the controller puts the brake into hold state, and then transits to High Z state.
      ja: |
        モータを即座に無励磁にします。モータが停止するまではBUSY状態になります。

        サーボモードだった場合は解除されます。

        電磁ブレーキモードが有効になっている場合は、電磁ブレーキを保持状態にしてから無励磁状態に移行します。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "A single motor no longer sends a soft stop before the hard HiZ; a single motor, all motors (255) and `/combine/hardHiZ` behave the same. With the brake enabled and released (after `/activate 1`), the motor is stopped with a hard stop (still energized) before the brake is engaged, so it does not keep running during the brake transition time. While the brake is engaged or engaging, the command does nothing as before.", ja: "1つのモータでも、`/hardHiZ`の前に減速停止を送らなくなりました。1つのモータ、全モータ（255）、`/combine/hardHiZ`は同じ動作です。電磁ブレーキが有効で解放されている（`/activate 1`の後の）ときは、ブレーキを保持する前に、即停止でモータを止めます（励磁されたまま）。ブレーキの移行時間の間にモータが回り続けることはありません。ブレーキが保持されている間と保持への移行中は、以前と同じく何もしません。"}
      - {version: "2.2.0", en: "After `/free`, the brake is engaged at once (the motor is already HiZ).", ja: "`/free`の後は、ブレーキをすぐに保持します（モータはすでに無励磁です）。"}
      - {version: "2.2.0", en: "Cancels pending motion, also for a motor with the brake disabled: a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: "保留中の動作を取り消します。ブレーキが無効なモータでも同じです。取り消されるのは、BUSYフラグが下りるのを待っている`/goTo`、`/goToDir`、`/goHome`、`/goMark`（以前は、モータがBUSYでなくなったときに送られていたため、止まっていたモータが再び動き出していました）、原点復帰（以前は、そのタイムアウトで送られる即停止が、その間に無励磁になったモータを励磁していました）、サーボモードです。"}
    see_also: [/combine/hardHiZ, /enableElectromagnetBrake]

  - address: /combine/run
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
      - name: speed
        type: float
        range: [-15625, 15625]
        unit: step/s
        description: {en: Rotation speed, ja: 回転速度}
    timing: motion_start
    description:
      en: Same as [[/run]] for two motors. The sign of the speed is the direction. A speed whose absolute value is above the range is limited to the largest register value (0xFFFFF, about 15625 step/s) by the driver library.
      ja: "2つのモータに対する[[/run]]と同じです。速度の符号が方向になります。絶対値が範囲を超える速度は、ドライバライブラリによってレジスタの最大値（0xFFFFF、約15625step/s）に制限されます。"
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/run]

  - address: /combine/move
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
      - name: step
        type: int
        description: {en: Moving step counts, ja: 移動ステップ数}
    timing: [stopped, motion_start]
    description:
      en: |-
        Same as [[/move]] for two motors. A step count whose absolute value is above 4,194,303 (22 bits) is not rejected: it is limited to 4,194,303 by the driver library.
      ja: "2つのモータに対する[[/move]]と同じです。絶対値が4,194,303（22ビット）を超えるステップ数は拒否されず、ドライバライブラリによって4,194,303に制限されます。"
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/move]

  - address: /combine/goTo
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
      - name: position
        type: int
        range: [-2097152, 2097151]
        description: {en: Destination, ja: 目標位置}
    timing: motion_start
    description:
      en: |-
        Same as [[/goTo]] for two motors. A position outside the range is not rejected. A position above 4,194,303 is limited to 4,194,303 by the driver library, which the driver reads as -1. Any other position is cut to its lower 22 bits and read as a signed number: 2,097,152 becomes -2,097,152 and -2,097,153 becomes 2,097,151.
      ja: "2つのモータに対する[[/goTo]]と同じです。範囲外の位置は拒否されません。4,194,303を超える位置は、ドライバライブラリによって4,194,303に制限され、ドライバはこれを -1として読みます。それ以外の位置は、下位22ビットだけが使われ、符号付きの数として読まれます。2,097,152は -2,097,152に、-2,097,153は2,097,151になります。"
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "Judges its direction correctly when the home switch or the limit switch prohibits a motion ([[/setProhibitMotionOnHomeSw]], [[/setProhibitMotionOnLimitSw]]): it is the sign of the 22-bit difference to the target, the way the driver goes (the shortest way). The direction was reversed for a target less than 2048 steps away (so a short move away from the switch was refused with `HomeSwActivating` / `LimitSwActivating` and a short move towards it was started), and wrong again beyond 2^21 steps.", ja: "HOMEスイッチまたはLIMITスイッチが動作を禁止する場合（[[/setProhibitMotionOnHomeSw]]、[[/setProhibitMotionOnLimitSw]]）の方向を、正しく判定します。目標との22ビットの差の符号で決まり、ドライバが進む向き（最短経路）と同じです。以前は、目標が2048ステップ未満の距離にあると方向が逆になり（スイッチから離れる短い移動が`HomeSwActivating` / `LimitSwActivating`で拒否され、スイッチに向かう短い移動が開始されていました）、2^21ステップを超えるとまた誤っていました。"}
    see_also: [/goTo]

  - address: /combine/goToDir
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
      - name: DIR
        type: bool
        description: {en: Rotation direction, ja: 回転方向}
      - name: position
        type: int
        range: [-2097152, 2097151]
        description: {en: Destination, ja: 目標位置}
    timing: motion_start
    description:
      en: |-
        Same as [[/goToDir]] for two motors. A position outside the range is not rejected. A position above 4,194,303 is limited to 4,194,303 by the driver library, which the driver reads as -1. Any other position is cut to its lower 22 bits and read as a signed number: 2,097,152 becomes -2,097,152 and -2,097,153 becomes 2,097,151.
      ja: "2つのモータに対する[[/goToDir]]と同じです。範囲外の位置は拒否されません。4,194,303を超える位置は、ドライバライブラリによって4,194,303に制限され、ドライバはこれを -1として読みます。それ以外の位置は、下位22ビットだけが使われ、符号付きの数として読まれます。2,097,152は -2,097,152に、-2,097,153は2,097,151になります。"
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/goToDir]

  - address: /combine/softStop
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
    timing: always
    description:
      en: "Same as [[/softStop]] for two motors: it is handled as [[/softStop]] for motorID1 and then for motorID2."
      ja: "2つのモータに対する[[/softStop]]と同じです。motorID1、続いてmotorID2に対して、[[/softStop]]として処理されます。"
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "Cancels pending motion like [[/softStop]] (each of the two motors is handled as a separate [[/softStop]]), also for a motor with the brake disabled.", ja: "[[/softStop]]と同じように、保留中の動作を取り消します（2つのモータは、それぞれ別の[[/softStop]]として処理されます）。ブレーキが無効なモータでも同じです。"}
    see_also: [/softStop]

  - address: /combine/hardStop
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
    timing: always
    description:
      en: "Same as [[/hardStop]] for two motors: it is handled as [[/hardStop]] for motorID1 and then for motorID2."
      ja: "2つのモータに対する[[/hardStop]]と同じです。motorID1、続いてmotorID2に対して、[[/hardStop]]として処理されます。"
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "Cancels pending motion like [[/hardStop]] (each of the two motors is handled as a separate [[/hardStop]]), also for a motor with the brake disabled.", ja: "[[/hardStop]]と同じように、保留中の動作を取り消します（2つのモータは、それぞれ別の[[/hardStop]]として処理されます）。ブレーキが無効なモータでも同じです。"}
    see_also: [/hardStop]

  - address: /combine/softHiZ
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
    timing: always
    description:
      en: "Same as [[/softHiZ]] for two motors: it is handled as [[/softHiZ]] for motorID1 and then for motorID2."
      ja: "2つのモータに対する[[/softHiZ]]と同じです。motorID1、続いてmotorID2に対して、[[/softHiZ]]として処理されます。"
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "Cancels pending motion like [[/softHiZ]] (each of the two motors is handled as a separate [[/softHiZ]]), also for a motor with the brake disabled.", ja: "[[/softHiZ]]と同じように、保留中の動作を取り消します（2つのモータは、それぞれ別の[[/softHiZ]]として処理されます）。ブレーキが無効なモータでも同じです。"}
    see_also: [/softHiZ]

  - address: /combine/hardHiZ
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
    timing: always
    description:
      en: "Same as [[/hardHiZ]] for two motors: it is handled as [[/hardHiZ]] for motorID1 and then for motorID2."
      ja: "2つのモータに対する[[/hardHiZ]]と同じです。motorID1、続いてmotorID2に対して、[[/hardHiZ]]として処理されます。"
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    changes:
      - {version: "2.2.0", en: "Cancels pending motion like [[/hardHiZ]] (each of the two motors is handled as a separate [[/hardHiZ]]), also for a motor with the brake disabled.", ja: "[[/hardHiZ]]と同じように、保留中の動作を取り消します（2つのモータは、それぞれ別の[[/hardHiZ]]として処理されます）。ブレーキが無効なモータでも同じです。"}
    see_also: [/hardHiZ]

  - address: /runRaw
    group: motion
    args:
      - use: motorID
      - name: speed
        type: int
        description: {en: "Rotation speed (raw register value, signed)", ja: "回転速度（Rawレジスタ値、符号付き）"}
    timing: motion_start
    description:
      en: |-
        Rotates the motor at the specified speed using a raw register value. The sign of the speed value determines the direction.

        A speed outside the 20-bit range is limited to 20 bits by the driver.
      ja: |-
        レジスタ値（Raw）で指定した速度で、モータを回転させます。速度の符号が方向になります。

        20ビットの範囲を超える速度は、ドライバによって20ビットに制限されます。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/run, /combine/runRaw]

  - address: /goUntilRaw
    group: motion
    args:
      - use: motorID
      - name: ACT
        type: bool
        description: {en: Same as `/goUntil`, ja: "`/goUntil`と同じ"}
      - name: speed
        type: int
        description: {en: "Speed (raw register value, signed)", ja: "速度（Rawレジスタ値、符号付き）"}
    timing: always
    description:
      en: |-
        Same as `/goUntil` but uses a raw register value for speed. The sign of the speed value determines the direction.

        The speed is limited to 20 bits (0xFFFFF) by the firmware and the driver libraries. `/goUntilRaw 255` (all motors) interprets the speed as a raw register value, like for a single motor.
      ja: |-
        `/goUntil`と同じですが、速度にレジスタ値（Raw）を使います。速度の符号が方向になります。

        速度は、ファームウェアとドライバライブラリによって20ビット（0xFFFFF）に制限されます。`/goUntilRaw 255`（全モータ）は、1つのモータのときと同じように、速度をレジスタ値として解釈します。
    errors: [BrakeEngaged, GoUntilTimeout, HomeSwActivating, InServoMode]
    changes:
      - {version: "2.2.0", en: "Limits the speed to 20 bits (`0xFFFFF`), like [[/runRaw]]. Larger values were sent as is, and the driver ignored the upper bits.", ja: "[[/runRaw]]と同じように、速度を20ビット（`0xFFFFF`）に制限します。以前は、大きな値がそのまま送られ、ドライバは上位ビットを無視していました。"}
      - {version: "2.2.0", en: "`/goUntilRaw 255` (all motors) interprets the speed as a raw register value, like for a single motor. It was treated as steps/s.", ja: "`/goUntilRaw 255`（全モータ）は、1つのモータのときと同じように、速度をレジスタ値として解釈します。以前はstep/sとして扱われていました。"}
      - {version: "2.2.0", en: "An activated home switch is reported as `/error/command HomeSwActivating`, the text in the error list. It was sent as `HomeSwActivated`. It now follows [[/reportError]] like the other command errors.", ja: "HOMEスイッチがオンの場合は、エラーの一覧にあるとおり`/error/command HomeSwActivating`として送信されます。以前は`HomeSwActivated`として送信されていました。他のコマンドのエラーと同じように、[[/reportError]]に従います。"}
      - {version: "2.2.0", en: "For a motor in the servo mode, replies `/error/command InServoMode` and does nothing. Before, the command was sent to the driver. With 255, only the motors in the servo mode reply the error; the others execute the command.", ja: "サーボモードのモータには`/error/command InServoMode`を返し、何もしません。以前は、コマンドがドライバに送られていました。255のときは、サーボモードのモータだけがエラーを返し、他のモータはコマンドを実行します。"}
    see_also: [/goUntil]

  - address: /combine/runRaw
    group: motion
    args:
      - {use: motorID, name: motorID1}
      - {use: motorID, name: motorID2}
      - name: speed
        type: int
        description: {en: "Rotation speed (raw register value, signed)", ja: "回転速度（Rawレジスタ値、符号付き）"}
    timing: motion_start
    description:
      en: A speed outside the 20-bit range is limited to 20 bits by the driver.
      ja: "20ビットの範囲を超える速度は、ドライバによって20ビットに制限されます。"
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged, HomeSwActivating, LimitSwActivating, InServoMode]
    see_also: [/runRaw]

  # ---------------------------------------------------------------------------
  # brake
  # ---------------------------------------------------------------------------
  - address: /enableElectromagnetBrake
    group: brake
    args:
      - use: motorID
      - {use: enable, setting: driverSettings.electromagnetBrakeEnable}
    timing: always
    description:
      en: |
        Enables / disables electromagnetic brake mode.
        While in the mode, the controller replies the `BrakeEngaged` ([[/error/command]]) if motor movement command is sent without releasing the electromagnetic brake.

        The setting is changed only while the driver is HiZ, and the brake is disabled only while it is engaged or after [[/free]]; otherwise the command replies `CommandIgnored`. Sending the current value does nothing. After a change, the brake output is engaged and the brake state is engaged. The same rule applies to a configuration loaded over USB serial (a warning is printed for a motor that is not changed).
      ja: |
        電磁ブレーキモードを有効・無効にします。
        電磁ブレーキモードが有効になると、電磁ブレーキを解放しないままモータを回すコマンドを送っても`BrakeEngaged`（[[/error/command]]）エラーになります。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "Changes the setting only while the driver is HiZ, and disables the brake only while it is engaged or after `/free`; otherwise `/error/command CommandIgnored`. Sending the current value does nothing. After a change the brake output is engaged and the state is engaged. Before, disabling a released brake engaged it on a turning motor, and enabling it on an energized motor left a state where `/activate 0` and `/hardHiZ` did nothing.", ja: "ドライバが無励磁のときだけ設定を変更し、ブレーキを無効にできるのは、ブレーキが保持されている間か`/free`の後だけです。それ以外では`/error/command CommandIgnored`を返します。現在の値を送っても何も起きません。変更後は、ブレーキ出力が保持され、状態も保持になります。以前は、解放中のブレーキを無効にすると、回転中のモータでブレーキが保持され、励磁中のモータで有効にすると、`/activate 0`と`/hardHiZ`が何もしない状態になっていました。"}
    see_also: [/activate, /free, /setBrakeTransitionDuration, /getBrakeStatus]

  - address: /activate
    group: brake
    args:
      - use: motorID
      - name: state
        type: bool
        values:
          - {value: 1, en: "Motor excited, EM brake released", ja: "モータ励磁, 電磁ブレーキ解放"}
          - {value: 0, en: "Motor not excited, EM brake engaged", ja: "モータ励磁解除, 電磁ブレーキ保持"}
    timing: always
    description:
      en: |
        Switches motor excitation / release when electromagnetic brake mode is enabled. The electromagnetic brake (EM) also works conjunction with the motor. You cannot send motor movement command when the motor is not excited by this command.
        If the EM mode is disabled, this command is ignored: only `CommandIgnored` is sent, and pending motion is not cancelled.

        `/activate 1` while the brake is released does nothing. From the engaged state it energizes the driver and releases the brake after `brakeTransitionDuration`, but only if a status read after the command shows the driver energized (during the engaging it goes back to the release sequence (the transition time starts again), during the stopping it only cancels the engaging, after [[/free]] it releases at once). If the driver stays HiZ (for example without motor power), the brake stays engaged and `BrakeReleaseFailed` is sent.

        `/activate 0` on a turning motor decelerates it and engages the brake when it has stopped, like [[/softHiZ]]; on a stopped motor the brake is engaged at the next status read (up to 5 ms later). The driver goes HiZ after `brakeTransitionDuration`. The brake state can be read with [[/getBrakeStatus]].
      ja: |-
        電磁ブレーキモードの場合に、モータの励磁、励磁解除を切り替えます。電磁ブレーキも連動して動作します。このコマンドでモータが励磁状態になっていないと、モータを回転させるコマンドを送ることはできません。

        電磁ブレーキモードが無効の場合は拒否されます。`CommandIgnored`だけが送信され、保留中の動作は取り消されません。

        ブレーキが解放されているときの`/activate 1`は、何もしません。ブレーキが保持されている状態からは、ドライバを励磁し、`brakeTransitionDuration`の後にブレーキを解放しますが、コマンドの後のSTATUSレジスタの読み出しでドライバが励磁されていることを確認できたときだけです（保持への移行中は解放の手順に戻り（移行時間は最初からやり直しです）、停止処理中は保持の取り消しだけを行い、[[/free]]の後はすぐに解放します）。ドライバが無励磁のまま（たとえばモータ電源がない）のときは、ブレーキは保持されたままになり、`BrakeReleaseFailed`が送信されます。

        回転中のモータへの`/activate 0`は、[[/softHiZ]]と同じように減速し、停止してからブレーキを保持します。停止中のモータでは、次のSTATUSレジスタの読み出し（最大5ms後）でブレーキを保持します。`brakeTransitionDuration`の後にドライバが無励磁になります。ブレーキの状態は[[/getBrakeStatus]]で読み出せます。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [CommandIgnored, BrakeReleaseFailed]
    changes:
      - {version: "2.2.0", en: "`/activate 1` while the brake is released does nothing. Before, it sent a hard stop, which stopped a turning motor abruptly.", ja: "ブレーキが解放されているときの`/activate 1`は、何もしません。以前は即停止を送り、回転中のモータを急停止させていました。"}
      - {version: "2.2.0", en: "`/activate 1` releases the brake only if a status read after the command shows the driver energized. If the driver stays HiZ (e.g. no motor power), the brake stays engaged and `/error/command BrakeReleaseFailed motorID` is sent. Before, the brake was released after `brakeTransitionDuration` in any case.", ja: "`/activate 1`は、コマンドの後のSTATUSレジスタの読み出しでドライバが励磁されていることを確認できたときだけ、ブレーキを解放します。ドライバが無励磁のままのとき（たとえばモータ電源がないとき）は、ブレーキは保持されたままになり、`/error/command BrakeReleaseFailed motorID`が送信されます。以前は、常に`brakeTransitionDuration`の後にブレーキを解放していました。"}
      - {version: "2.2.0", en: "`/activate 1` during the deceleration of `/softHiZ` (or `/activate 0`) cancels the engaging and keeps the brake released; the deceleration goes on. Before, it stopped the motor with a hard stop, and the brake still engaged when the motor stopped.", ja: "`/softHiZ`（または`/activate 0`）の減速中の`/activate 1`は、ブレーキの保持を取り消し、ブレーキは解放されたままになります。減速は続きます。以前は、即停止でモータを止め、モータが止まるとブレーキが保持されていました。"}
      - {version: "2.2.0", en: "`/activate 0` on a turning motor decelerates it and engages the brake when it has stopped, like `/softHiZ`. Before, it engaged the brake without stopping the motor.", ja: "回転中のモータへの`/activate 0`は、`/softHiZ`と同じように、減速してモータが止まってからブレーキを保持します。以前は、モータを止めずにブレーキを保持していました。"}
      - {version: "2.2.0", en: "`/activate 0` on a stopped motor engages the brake at the next status read (up to 5 ms later). The stop is now judged on a status read after the command.", ja: "停止中のモータへの`/activate 0`は、次のSTATUSレジスタの読み出し（最大5ms後）でブレーキを保持します。停止の判定は、コマンドの後のSTATUSレジスタの読み出しで行うようになりました。"}
      - {version: "2.2.0", en: "After `/free`: `/activate 1` returns the motor to the released (energized) state, and `/activate 0` engages the brake at once (the motor is already HiZ).", ja: "`/free`の後: `/activate 1`はモータを解放（励磁）の状態に戻し、`/activate 0`はブレーキをすぐに保持します（モータはすでに無励磁です）。"}
      - {version: "2.2.0", en: "KVAL_HOLD (TVAL_HOLD in the current mode) is raised to at least half of KVAL_RUN (TVAL_RUN) whenever the motor is energized again: from engaged or engaging (as before), and now also after `/free`.", ja: "モータが再び励磁されるたびに、KVAL_HOLD（電流モードではTVAL_HOLD）がKVAL_RUN（TVAL_RUN）の半分以上に引き上げられます。ブレーキが保持中または保持への移行中だった場合は以前と同じで、`/free`の後も引き上げられるようになりました。"}
      - {version: "2.2.0", en: "`/activate 0` cancels pending motion of a motor with the brake enabled (with the brake disabled it replies `CommandIgnored` and cancels nothing): a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: "`/activate 0`は、電磁ブレーキが有効なモータの保留中の動作を取り消します（ブレーキが無効なモータには`CommandIgnored`を返し、何も取り消しません）。取り消されるのは、BUSYフラグが下りるのを待っている`/goTo`、`/goToDir`、`/goHome`、`/goMark`（以前は、モータがBUSYでなくなったときに送られていたため、止まっていたモータが再び動き出していました）、原点復帰（以前は、そのタイムアウトで送られる即停止が、その間に無励磁になったモータを励磁していました）、サーボモードが対象です。"}
    see_also: [/enableElectromagnetBrake, /free, /getBrakeStatus]

  - address: /free
    group: brake
    args: [{use: motorID}]
    timing: always
    description:
      en: |
        Releases motor axis when the electromagnetic brake mode is active. It releases motor excitation and keep EM brake in release state.
        Be cautious when sending this command. If some load is hanged to the motor, it will loose the hold and the load may fall down.
        If the EM mode is disabled, this command is ignored: only `CommandIgnored` is sent, and pending motion is not cancelled.

        After `/free`, a stop of the motor no longer engages the brake (when `/free` was sent during the deceleration of [[/softHiZ]]). A motion command (`/run`, `/move`, `/goTo`, ...) or `/activate 1` energizes the motor again and returns it to the released state. `/activate 0`, `/softHiZ` and `/hardHiZ` engage the brake at once.
      ja: |-
        電磁ブレーキモードの場合に、モータ軸を自由に回せる状態にします。モータの励磁を解除し、電磁ブレーキも解放のままになります。

        負荷を吊り下げている場合は、支えがなくなって負荷が落下する原因になりますので、送信時には十分注意してください。

        電磁ブレーキモードが無効の場合は拒否されます。`CommandIgnored`だけが送信され、保留中の動作は取り消されません。

        `/free`の後は、モータが停止してもブレーキを保持しなくなります（`/softHiZ`の減速中に`/free`を送った場合）。動作コマンド（`/run`、`/move`、`/goTo`など）か`/activate 1`を送ると、モータが再び励磁されて、解放の状態に戻ります。`/activate 0`、`/softHiZ`、`/hardHiZ`は、ブレーキをすぐに保持します。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "After `/free`, a stop of the motor no longer engages the brake (when `/free` was sent during the deceleration of `/softHiZ`).", ja: "`/free`の後は、モータが停止してもブレーキを保持しなくなりました（`/softHiZ`の減速中に`/free`を送った場合）。"}
      - {version: "2.2.0", en: "After `/free`, a motion command (`/run`, `/move`, `/goTo`, ...) is executed and the motor returns to the released (energized) state. `/activate 1` does the same. `/activate 0`, `/softHiZ` and `/hardHiZ` engage the brake at once (the motor is already HiZ).", ja: "`/free`の後に動作コマンド（`/run`、`/move`、`/goTo`など）を送ると、コマンドが実行され、モータは解放（励磁）の状態に戻ります。`/activate 1`も同じです。`/activate 0`、`/softHiZ`、`/hardHiZ`は、ブレーキをすぐに保持します（モータはすでに無励磁です）。"}
      - {version: "2.2.0", en: "KVAL_HOLD (TVAL_HOLD in the current mode) is raised to at least half of KVAL_RUN (TVAL_RUN) when the motor is energized again after `/free`. Before, the motor was energized with the configured holding value.", ja: "`/free`の後でモータが再び励磁されるとき、KVAL_HOLD（電流モードではTVAL_HOLD）がKVAL_RUN（TVAL_RUN）の半分以上に引き上げられます。以前は、設定された停止時の値で励磁されていました。"}
      - {version: "2.2.0", en: "`/free` cancels pending motion of a motor with the brake enabled (with the brake disabled it replies `CommandIgnored`): a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: "`/free`は、電磁ブレーキが有効なモータの保留中の動作を取り消します（ブレーキが無効なモータには`CommandIgnored`を返します）。取り消されるのは、BUSYフラグが下りるのを待っている`/goTo`、`/goToDir`、`/goHome`、`/goMark`（以前は、モータがBUSYでなくなったときに送られていたため、止まっていたモータが再び動き出していました）、原点復帰（以前は、そのタイムアウトで送られる即停止が、その間に無励磁になったモータを励磁していました）、サーボモードが対象です。"}
    see_also: [/enableElectromagnetBrake, /activate, /getBrakeStatus]

  - address: /setBrakeTransitionDuration
    group: brake
    args:
      - use: motorID
      - name: duration
        type: int
        range: [0, 65535]
        unit: ms
        setting: driverSettings.brakeTransitionDuration
        description: {en: Transition duration, ja: 移行時間}
    timing: always
    description:
      en: |-
        Sets the transitional duration to keep the motor excited when the electromagnetic brake is activated or released. This is to keep holding the motor axis until the brake movement is completed, due to the physical transition time for the brake mechanism.

        A value outside 0-65535 replies `CommandIgnored` and the setting is kept. The release after [[/activate]] comes 0-5 ms after the set time, because the brake is handled every 5 ms.
      ja: |-
        電磁ブレーキの保持・解放時に、モータを励磁したままにしておく移行時間を指定します。これは物理的にブレーキ機構が動作する時間がかかるため、ブレーキの動作が完了するまでモータ軸を励磁したまま保っておくために必要な時間です。

        0〜65535の範囲外の値には`CommandIgnored`を返し、設定は変わりません。ブレーキは5msごとに処理されるため、[[/activate]]の後の解放は、設定した時間の0〜5ms後になります。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A value outside 0-65535 replies `/error/command CommandIgnored` and keeps the setting. Before, the value was taken as a 16-bit unsigned integer, so only its lower 16 bits were used (65536 became 0, -1 became 65535).", ja: "0〜65535の範囲外の値には`/error/command CommandIgnored`を返し、設定は変わりません。以前は、値が16ビットの符号なし整数として扱われ、下位16ビットだけが使われていました（65536は0、-1は65535になっていました）。"}
      - {version: "2.2.0", en: "The brake times are in 5 ms steps: the release after `/activate 1` comes 0-5 ms after `brakeTransitionDuration` (measured 99.8-105.4 ms for 100 ms; before 99.8-107.6 ms), and the engage after a stop or a HiZ is judged at the next status read.", ja: "ブレーキの時間は5ms単位です。`/activate 1`の後の解放は、`brakeTransitionDuration`の0〜5ms後になります（100msの設定で実測99.8〜105.4ms。以前は99.8〜107.6ms）。停止や無励磁の後のブレーキの保持は、次のSTATUSレジスタの読み出しで判定されます。"}
    see_also: [/getBrakeTransitionDuration]

  - address: /getBrakeTransitionDuration
    group: brake
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the transitional duration to keep holding the motor axis when the electromagnetic brake is activated or released.
      ja: 電磁ブレーキの保持・解放時に、モータを励磁したままにしておく移行時間を取得します。
    response: [/brakeTransitionDuration]

  - address: /getBrakeStatus
    group: brake
    since: "2.2.0"
    args: [{use: motorID}]
    timing: always
    description:
      en: Returns the state of the electromagnetic brake of the specified motor. The state is -1 for a motor with the brake disabled.
      ja: "指定したモータの電磁ブレーキの状態を返します。ブレーキが無効なモータでは -1です。"
    response: [/brakeStatus]
    see_also: [/activate, /free, /enableElectromagnetBrake]

  # ---------------------------------------------------------------------------
  # servo
  # ---------------------------------------------------------------------------
  - address: /enableServoMode
    group: servo
    args:
      - use: motorID
      - use: enable
    timing: always
    description:
      en: |
        Turns on/off the servo mode (position tracking mode). To avoid sudden movement, the current position at the moment of activation is set to the target position.
        It is not possible to send other motor control commands such as `/run` or `/goTo` while operating in this mode.

        Enabling the servo mode turns off the BUSY, motor status and direction reports ([[/enableBusyReport]], [[/enableMotorStatusReport]], [[/enableDirReport]]) of the motor. Disabling the servo mode does not turn them on again; send the enable commands again if needed. It also resets the integral term and the previous error of the PID controller. While in the servo mode, [[/goUntil]], [[/goUntilRaw]], [[/releaseSw]] and [[/homing]] reply `InServoMode`.

        With the electromagnetic brake enabled, `/enableServoMode 1` replies `BrakeEngaged` and does nothing while the brake is engaged, releasing or engaging (while stopping or after `/free` the command is executed); `/enableServoMode 0` does nothing while the brake is engaged or after [[/free]].

        When the driver goes HiZ by itself (overcurrent shutdown, thermal shutdown, UVLO) in the servo mode, the servo mode is cancelled and `ServoModeCancelledOnHiZ` is sent (`BrakeEngagedOnHiZ` too, with the brake enabled). Enable the servo mode again with `/enableServoMode 1`; the current position becomes the target.
      ja: |-
        サーボモード（位置追従モード）をオンオフします。急に動き出すことを避けるため、有効になった瞬間の現在位置が目標位置にセットされます。

        このモードで動作している間は、`/run`や`/goTo`など他のモータ制御コマンドを送ることはできません。

        サーボモードを有効にすると、そのモータのBUSY、モータの状態、方向の通知（[[/enableBusyReport]]、[[/enableMotorStatusReport]]、[[/enableDirReport]]）がオフになります。サーボモードを無効にしても、オンには戻りません。必要なら、有効にするコマンドをもう一度送ってください。積分項とPID制御の前回の誤差もリセットされます。サーボモード中に[[/goUntil]]、[[/goUntilRaw]]、[[/releaseSw]]、[[/homing]]を送ると`InServoMode`を返します。

        電磁ブレーキが有効なとき、ブレーキが保持されている間、解放中、保持への移行中の`/enableServoMode 1`は`BrakeEngaged`を返し、何もしません（停止処理中と`/free`の後はコマンドが実行されます）。`/enableServoMode 0`は、ブレーキが保持されている間と[[/free]]の後は何もしません。

        サーボモード中にドライバが過電流、過熱、電源電圧の低下（UVLO）による遮断で自分で無励磁になったとき、サーボモードを取り消し、`ServoModeCancelledOnHiZ`を送信します（電磁ブレーキが有効なときは`BrakeEngagedOnHiZ`も送信されます）。もう一度`/enableServoMode 1`で有効にしてください。現在位置が目標位置になります。
    response:
      - message: /homingStatus
        when: {en: While homing is in progress, ja: 原点復帰動作中のとき}
    errors: [BrakeEngaged]
    changes:
      - {version: "2.2.0", en: "With the brake enabled, `/enableServoMode 1` while the brake is engaged, releasing or engaging (not while stopping or after `/free`) replies `/error/command BrakeEngaged` and does nothing. Before, it energized and moved the motor with the brake engaged.", ja: "電磁ブレーキが有効なとき、ブレーキが保持されている間、解放中、保持への移行中（停止処理中と`/free`の後は除く）の`/enableServoMode 1`は、`/error/command BrakeEngaged`を返し、何もしません。以前は、ブレーキが保持されたままモータを励磁して動かしていました。"}
      - {version: "2.2.0", en: "With the brake enabled, `/enableServoMode 0` while the brake is engaged or after `/free` (motor HiZ) does nothing. Before, it energized the motor.", ja: "電磁ブレーキが有効なとき、ブレーキが保持されている間と`/free`の後（モータが無励磁）の`/enableServoMode 0`は、何もしません。以前は、モータを励磁していました。"}
      - {version: "2.2.0", en: "When a driver goes HiZ by itself (overcurrent shutdown, thermal shutdown, UVLO) in the servo mode, the servo mode is cancelled and `/error/command ServoModeCancelledOnHiZ` is sent (follows [[/reportError]]), with or without the brake. With the brake enabled, `BrakeEngagedOnHiZ` is also sent. Before, with the brake disabled the next servo update energized the driver again. The commands that make the driver HiZ cancel the servo mode first and do not send this error.", ja: "サーボモード中にドライバが過電流、過熱、電源電圧の低下（UVLO）による遮断で自分で無励磁になったとき、サーボモードを取り消し、`/error/command ServoModeCancelledOnHiZ`を送信します（[[/reportError]]に従います）。ブレーキの有無によらず同じです。電磁ブレーキが有効なときは、`BrakeEngagedOnHiZ`も送信されます。以前は、ブレーキが無効だと、次のサーボの更新でドライバが再び励磁されていました。ドライバを無励磁にするコマンドは、先にサーボモードを取り消すので、このエラーは送信されません。"}
      - {version: "2.2.0", en: "Enabling the servo mode resets the integral and the previous error of the PID controller. The previous values were kept from the last time the servo mode was used.", ja: "サーボモードを有効にすると、PID制御の積分値と前回の誤差がリセットされます。以前は、前回サーボモードを使ったときの値が残っていました。"}
      - {version: "2.2.0", en: "The update period is 5 ms instead of 10 ms (and no longer varies between 7 and 13 ms when position reports are enabled; an OSC message that sends several replies can still delay one update, up to 7.75 ms measured). The integral and derivative terms are scaled by the period, so the same `kP`, `kI` and `kD` were designed to give about the same response; retune the gains if needed.", ja: "更新周期が10msから5msになりました（位置レポートが有効なときに7〜13msの間で変動することもなくなりました。複数の返信を送るOSCメッセージが、1回の更新を遅らせることはあります。実測で最大7.75ms）。積分項と微分項は周期に応じて換算されるので、同じ`kP`、`kI`、`kD`でほぼ同じ動きになるように設計されていますが、必要に応じてゲインを調整してください。"}
      - {version: "2.2.0", en: "STEP400: the home switch and the limit switch are judged separately. A pressed home switch stops the motion towards `homingDirection` (with `/setProhibitMotionOnHomeSw` or the home switch in the hard stop mode), and a pressed limit switch stops the motion away from it (with `/setProhibitMotionOnLimitSw` or the limit switch in the hard stop mode), as before. While the home switch was pressed, the limit switch was not checked. Only a motor with both switches pressed behaves differently.", ja: "STEP400: HOMEスイッチとLIMITスイッチを別々に判定します。オンのHOMEスイッチは`homingDirection`に向かう動作を止め（`/setProhibitMotionOnHomeSw`が有効か、HOMEスイッチの動作が即停止のとき）、オンのLIMITスイッチはそれと逆向きの動作を止めます（`/setProhibitMotionOnLimitSw`が有効か、LIMITスイッチの動作が即停止のとき）。ここまでは以前と同じです。以前は、HOMEスイッチがオンの間はLIMITスイッチを確認していませんでした。動作が変わるのは、2つのスイッチが両方オンのモータだけです。"}
      - {version: "2.2.0", en: "The automatic hard stop at a switch event in the servo mode is not sent to a motor whose driver is HiZ.", ja: "サーボモード中のセンサイベントでの自動の即停止は、ドライバが無励磁のモータには送りません。"}
      - {version: "2.2.0", en: "Cancels pending motion, also for a motor with the brake disabled: a `/goTo`, `/goToDir`, `/goHome` or `/goMark` waiting for the BUSY flag to clear (it was sent when the motor became not busy, so a stopped motor started again), the homing (its timeout sent a hard stop, which energized a motor made HiZ in the meantime) and the servo mode.", ja: "保留中の動作を取り消します。ブレーキが無効なモータでも同じです。取り消されるのは、BUSYフラグが下りるのを待っている`/goTo`、`/goToDir`、`/goHome`、`/goMark`（以前は、モータがBUSYでなくなったときに送られていたため、止まっていたモータが再び動き出していました）、原点復帰（以前は、そのタイムアウトで送られる即停止が、その間に無励磁になったモータを励磁していました）、サーボモードです。"}
    see_also: [/setTargetPosition, /setServoParam]

  - address: /setServoParam
    group: servo
    args:
      - use: motorID
      - name: kP
        type: float
        setting: servoMode.kP
        description: {en: Proportional control gain, ja: 比例制御ゲイン}
      - name: kI
        type: float
        setting: servoMode.kI
        description: {en: Integral control gain, ja: 積分制御ゲイン}
      - name: kD
        type: float
        setting: servoMode.kD
        description: {en: Differential control gain, ja: 微分制御ゲイン}
    timing: always
    description:
      en: |-
        Adjusts the PID control gain.

        A negative gain replies `CommandIgnored` and nothing is applied. The update period of the servo mode is 5 ms; the integral and derivative terms are scaled by the period.
      ja: |-
        PID制御のゲインを調整します。

        負のゲインには`CommandIgnored`を返し、何も適用されません。サーボモードの更新周期は5msです。積分項と微分項は周期に応じて換算されます。
    errors: [CommandIgnored]
    changes:
      - {version: "2.2.0", en: "A negative gain replies `/error/command CommandIgnored` and nothing is applied. Before, it was set to 0.", ja: "負のゲインには`/error/command CommandIgnored`を返し、何も適用されません。以前は0に設定されていました。"}
      - {version: "2.2.0", en: "The servo update period is 5 ms instead of 10 ms. The same gains were designed to give about the same response, but retune them if needed.", ja: "サーボの更新周期が10msから5msになりました。同じゲインでほぼ同じ動きになるように設計されていますが、必要に応じて調整してください。"}
    see_also: [/getServoParam]

  - address: /getServoParam
    group: servo
    args: [{use: motorID}]
    timing: always
    description: {en: "Gets the PID gains (kP, kI, kD) of the servo mode.", ja: "サーボモードのPIDゲイン（kP、kI、kD）を取得します。"}
    response: [/servoParam]

  - address: /setTargetPosition
    group: servo
    args:
      - use: motorID
      - name: position
        type: int
        range: [-2097152, 2097151]
        description: {en: target position, ja: 目標位置}
    timing: always
    description:
      en: Sets the target position in servo mode.
      ja: サーボモードの目標位置を設定します。
    see_also: [/enableServoMode, /setTargetPositionList]

  - address: /setTargetPositionList
    group: servo
    args:
      - name: position
        type: int
        repeat: motors
        range: [-2097152, 2097151]
        description: {en: target position, ja: 目標位置}
    timing: always
    description:
      en: Sets the target positions of the servo mode for all axes at once.
      ja: サーボモードの目標位置を全軸分まとめて設定します。引数として各軸の目標位置を指定しますので、STEP400の場合は4個、STEP800の場合は8個の引数が必要です。
    changes:
      - {version: "2.2.0", en: "A message with fewer positions than the number of motors replies `/error/osc MissingArgument` and nothing is applied. Before, the missing positions became 0 and a servo-mode motor ran to 0.", ja: "モータの数より少ない位置のメッセージには`/error/osc MissingArgument`を返し、何も適用されません。以前は、足りない位置が0になり、サーボモードのモータが0に向かって動いていました。"}
    see_also: [/setTargetPosition]

# =============================================================================
# Messages (board -> PC)
# In the order of the commands that request them; messages sent on their own
# (/booted, /error/osc, /error/command) at the end.
# `type` is the OSC type tag the firmware actually sends.
# =============================================================================

messages:
  - address: /destIp
    args:
      - name: "destIp[0]"
        type: int
        range: [0, 255]
        description: {en: Each byte of destIp, ja: destIpの各桁}
      - name: "destIp[1]"
        type: int
        range: [0, 255]
        description: {en: Each byte of destIp, ja: destIpの各桁}
      - name: "destIp[2]"
        type: int
        range: [0, 255]
        description: {en: Each byte of destIp, ja: destIpの各桁}
      - name: "destIp[3]"
        type: int
        range: [0, 255]
        description: {en: Each byte of destIp, ja: destIpの各桁}
      - name: isNewDestIp
        type: int
        range: [0, 1]
        description:
          en: Indicates if destIp has been changed. 1 if it has been changed, or 0 if the same address has already been set.
          ja: destIpが変更されたかどうかを示します。変更されていると1, すでに同じアドレスが設定されていた場合は0
    changes:
      - {version: "2.2.0", en: "When the [[/setDestIp]] starts the resolution of the MAC address (the first one, one from another address, or one 1.5 s or more after the last packet from the destination), the message is sent once it has been resolved, so it can come up to about 2 s later; otherwise it is sent at once. If it does not come, send `/setDestIp` again.", ja: "[[/setDestIp]]がMACアドレスの解決を始めるとき（最初の1回、別のアドレスからのとき、宛先からの最後のパケットから1.5秒以上後のとき）は、解決が終わってからこのメッセージを送信するため、最大約2秒遅れることがあります。それ以外のときはすぐに送信されます。届かないときは、もう一度`/setDestIp`を送ってください。"}

  - address: /version
    args:
      - name: version
        type: string

  - address: /configName
    args:
      - name: configName
        type: string
        description: {en: The name of the configuration, ja: コンフィギュレーションの名称。}
      - name: sdInitializeSucceeded
        type: int
        range: [0, 1]
        description: {en: If the reading from microSD card was successful., ja: microSDカードとの通信に成功したかどうか}
      - name: configFileOpenSucceeded
        type: int
        range: [0, 1]
        description: {en: If the device could open the configuration file successfully., ja: 設定ファイルを開くことができたかどうか}
      - name: configFileParseSucceeded
        type: int
        range: [0, 1]
        description: {en: If the config Json data could be parsed successfully., ja: 設定ファイルのJsonをパースできたかどうか}
      - name: configFilename
        type: string
        since: "2.1.0"
        description:
          en: The filename of the configuration file on the microSD card (e.g., `config.txt` or `STEP400_venue-A.json`). This is the on-disk filename, distinct from `configName` which is the user-editable label.
          ja: "microSDカード上の設定ファイルのファイル名です（例: `config.txt`、`STEP400_venue-A.json`）。ディスク上のファイル名で、ユーザーが編集できるラベルである`configName`とは別のものです。"

  - address: /saveConfig
    since: "2.1.0"
    args:
      - name: message
        type: string
        value: Saved to SD. Reboot to apply.

  - address: /error/saveConfig
    since: "2.1.0"
    args:
      - name: errorText
        type: string
        values:
          - {value: SD open failed}
          - {value: No SD card}

  - address: /microstepMode
    args:
      - use: motorID
      - name: STEP_SEL
        type: int
        range: [0, 7]
        values:
          - {value: 0, en: Full-step, ja: Full-step}
          - {value: 1, en: Half-step, ja: Half-step}
          - {value: 2, en: 1/4 microstep, ja: 1/4 microstep}
          - {value: 3, en: 1/8 microstep, ja: 1/8 microstep}
          - {value: 4, en: 1/16 microstep, ja: 1/16 microstep}
          - {value: 5, en: 1/32 microstep, ja: 1/32 microstep}
          - {value: 6, en: 1/64 microstep, ja: 1/64 microstep}
          - {value: 7, en: 1/128 microstep, ja: 1/128 microstep}
        description: {en: Microstepping mode, ja: マイクロステップのモード}

  - address: /lowSpeedOptimizeThreshold
    args:
      - use: motorID
      - name: lowSpeedOptimizeThreshold
        type: float
        range: [0.0, 976.3]
        unit: step/s
        description: {en: Low speed optimization threshold, ja: 低速最適化の閾値}
      - name: optimizationEnabled
        type: int
        values:
          - {value: 1, en: Low speed optimization enabled, ja: Low speed optimization有効}
          - {value: 0, en: Low speed optimization disabled, ja: Low speed optimization無効}
    changes:
      - {version: "2.2.0", en: "The third argument `optimizationEnabled` is sent with the integer type tag `i` (0 / 1). Before, it used `T` / `F`. Clients that expect `T` / `F` must be updated.", ja: "第3引数の`optimizationEnabled`は、整数の型タグ`i`（0 / 1）で送信されます。以前は`T` / `F`でした。`T` / `F`を想定しているクライアントは、更新が必要です。"}

