  - address: /brakeStatus
    since: "2.2.0"
    args:
      - use: motorID
      - name: state
        type: int
        values:
          - {value: -1, en: The electromagnetic brake is disabled for the motor, ja: "このモータの電磁ブレーキは無効です"}
          - {value: 0, en: "Engaged. Brake output: engaged. Driver: HiZ", ja: "保持。ブレーキ出力: 保持。ドライバ: 無励磁"}
          - {value: 1, en: "Releasing (`/activate 1`, waiting `brakeTransitionDuration`). Brake output: engaged. Driver: energized", ja: "解放中（`/activate 1`、`brakeTransitionDuration`を待っています）。ブレーキ出力: 保持。ドライバ: 励磁"}
          - {value: 2, en: "Released. Brake output: released. Driver: energized", ja: "解放。ブレーキ出力: 解放。ドライバ: 励磁"}
          - {value: 3, en: "Stopping (`/softHiZ`, `/activate 0`: decelerating, engages when stopped). Brake output: released. Driver: energized", ja: "停止処理中（`/softHiZ`、`/activate 0`: 減速中で、停止すると保持します）。ブレーキ出力: 解放。ドライバ: 励磁"}
          - {value: 4, en: "Engaging (waiting `brakeTransitionDuration`, then HiZ). Brake output: engaged. Driver: energized", ja: "保持への移行中（`brakeTransitionDuration`を待ち、その後無励磁にします）。ブレーキ出力: 保持。ドライバ: 励磁"}
          - {value: 5, en: "Free (`/free`). Brake output: released. Driver: HiZ", ja: "フリー（`/free`）。ブレーキ出力: 解放。ドライバ: 無励磁"}
        description: {en: State of the brake, ja: "ブレーキの状態"}
    description:
      en: |
        Reply to [[/getBrakeStatus]]. The state numbers are part of the specification; new states will only be added as 6, 7, ....
      ja: "[[/getBrakeStatus]]への返信です。状態の番号は仕様の一部です。新しい状態は6、7、... として追加されます。"

  - address: /servoParam
    args:
      - use: motorID
      - name: kP
        type: float
        description: {en: Proportional control gain, ja: 比例制御ゲイン}
      - name: kI
        type: float
        description: {en: Integral control gain, ja: 積分制御ゲイン}
      - name: kD
        type: float
        description: {en: Differential control gain, ja: 微分制御ゲイン}

  # --- sent on their own ---
  - address: /booted
    args:
      - name: deviceID
        type: int
        range: [0, 255]
        description: {en: The device ID set by the DIP Switch, ja: DIPスイッチで設定されたデバイスのID}
      - name: resetCause
        type: int
        since: "2.2.0"
        values:
          - {value: 0, en: Unknown, ja: "不明"}
          - {value: 1, en: "Power-on. Treat 1 and 2 both as a reset by the power supply", ja: "電源投入。1と2は、どちらも電源によるリセットとして扱ってください"}
          - {value: 2, en: "Brown-out (supply voltage drop). On the SAMD21 a normal power-up is often reported as 2", ja: "電源電圧の低下（ブラウンアウト）。SAMD21では、通常の電源投入が2になることが多くあります"}
          - {value: 3, en: Reset pin, ja: "リセットピン"}
          - {value: 4, en: Watchdog, ja: "ウォッチドッグ"}
          - {value: 5, en: "Software reset (for example after [[/resetDevice]] or a firmware upload over USB)", ja: "ソフトウェアリセット（たとえば[[/resetDevice]]の後や、USBでのファームウェア書き込みの後）"}
          - {value: 6, en: "CPU fault: the reset after a CPU exception (HardFault on the SAMD21)", ja: "CPU動作異常: CPU例外（SAMD21ではHardFault）の後のリセット"}
        description:
          en: "The cause of the reset, as reported by the MCU."
          ja: "MCUが示す、リセットの原因です。"
    description:
      en: |
        This message is automatically sent out when the device has (re)started. By watching the message, you can detect reset event of the device triggered by some reason.

        The message will be sent out one second after the firmware is started up and the ethernet link is established. The message will be sent to `255.255.255.255`, means broadcasting to all nodes within the subnet.

        This message can be disabled from the configuration tool.

        `resetCause`: the numbers are part of the specification; new causes will only be added as 7, 8, .... A client should treat a number it does not know as "other", and accept 6. If several causes are flagged, the first of CPU fault, brown-out, power-on, watchdog, reset pin, software is reported. After a power-on or a brown-out the CPU fault is never reported, so a fault followed by a power cycle reports 1 or 2. The numbers are those reported by the MCU as they are; with another MCU in the future the same operation may report a different number (the meaning of each number does not change).
      ja: |-
        ボードが（再）起動した際に自動的にボードから送信されるメッセージです。何らかの理由でボードがリセットされたことを検出できます。

        ファームウェアが起動して、Ethernetがリンク状態になった1秒後に送信されます。サブネット内のすべてのノード（`255.255.255.255`）へブロードキャストされます。

        Config Toolの設定を用いて、このメッセージを送信しないようにも設定できます。

        `resetCause`: 番号は仕様の一部です。新しい原因は7、8、... として追加されます。クライアントは、知らない番号を「その他」として扱い、6を受け付けてください。複数の原因が記録されているときは、CPU動作異常、電源電圧の低下（ブラウンアウト）、電源投入、ウォッチドッグ、リセットピン、ソフトウェアの順で最初のものが`resetCause`になります。電源投入やブラウンアウトの後にはCPU動作異常は記録されないため、CPU動作異常の後に電源を入れ直すと1か2になります。番号はMCUが返したものがそのまま使われます。将来別のMCUを使うと、同じ操作でも別の番号になることがあります（各番号の意味は変わりません）。
    changes:
      - {version: "2.2.0", en: "A second argument, `resetCause` (`i`), is added: `/booted myId resetCause`. Clients that check the exact number of arguments are affected.", ja: "第2引数`resetCause`（`i`）が追加されました: `/booted myId resetCause`。引数の数を厳密に確認しているクライアントは影響を受けます。"}
      - {version: "2.2.0", en: "After a watchdog detects a hang (about 250 ms after the last watchdog reset), every brake output is engaged first and the firmware waits for the longest `brakeTransitionDuration` of the motors with the brake enabled and not engaged (at most 1 s) before the board is reset, so the reset comes up to 1 s later than before; `resetCause` is still 4. v2.1.0 reset the board about 62.5 ms after a hang.", ja: "ウォッチドッグが停止を検出すると（最後のウォッチドッグのリセットから約250ms後）、まずすべてのブレーキ出力を保持し、電磁ブレーキが有効でブレーキが保持されていないモータのうち最長の`brakeTransitionDuration`（最大1秒）を待ってから、ボードをリセットします。そのため、リセットは以前より最大1秒遅れます。`resetCause`は4のままです。v2.1.0は、停止から約62.5ms後にボードをリセットしていました。"}
      - {version: "2.2.0", en: "A CPU fault (HardFault) now engages every brake output at once, waits as above (at most 1 s), and restarts with `resetCause` 6.", ja: "CPU動作異常（HardFault）では、すべてのブレーキ出力をすぐに保持し、上と同じように待って（最大1秒）から、`resetCause` 6で再起動します。"}
      - {version: "2.2.0", en: "The reset by [[/resetDevice]] now reports `resetCause` 5 (software).", ja: "[[/resetDevice]]によるリセットでは、`resetCause`が5（ソフトウェア）になります。"}

  - address: /error/osc
    args:
      - name: errorText
        type: string
        values:
          - {value: MessageNotMatch, en: There is no corresponding command, ja: 該当するコマンドがない。}
          - value: OscSyntaxError
            en: The OSC format is out of standard. Also sent for a packet larger than 512 bytes and for a message with more than 16 arguments.
            ja: "OSCのフォーマットが規格に沿っていなかった。512バイトを超えるパケットと、16個を超える引数を持つメッセージにも送信される。"
            changes:
              - {version: "2.2.0", en: "Also sent for a packet larger than 512 bytes and for a message with more than 16 arguments.", ja: "512バイトを超えるパケットと、16個を超える引数を持つメッセージにも送信されます。"}
          - value: WrongDataType
            en: "Wrong datatype of in argument(s): a string for a number, NaN or infinity, or a non-string for `/setConfigName`. Nothing is applied."
            ja: "OSCメッセージの引数の型が異なっている: 数値の位置に文字列、NaN、無限大、または`/setConfigName`に文字列以外。何も適用されない。"
            changes:
              - {version: "2.2.0", en: "Nothing is applied. Before, such an argument was applied as 0.", ja: "何も適用されません。以前は、このような引数は0として適用されていました。"}
          - {value: MissingArgument, since: "2.2.0", en: "The message has fewer arguments than the command needs. Nothing is applied.", ja: "メッセージの引数の数が、コマンドに必要な数より少なかった。何も適用されない。"}
        description: {en: A character string that indicates the details of an error., ja: エラーの内容を示す文字列です。}
    description:
      en: |-
        Sent if any error is detected in the received OSC (Open Sound Control) message.

        The arguments of every command are checked before the command is applied. Arguments beyond the ones a command needs are ignored. The message is not sent while error reports are disabled ([[/reportError]]).
      ja: |-
        受け取ったOSCメッセージに何らかのエラーがあった場合に送信されます。

        コマンドを適用する前に、すべてのコマンドの引数が検査されます。コマンドが必要とする数を超える引数は無視されます。エラーの通知が無効の間（[[/reportError]]）は送信されません。
    changes:
      - {version: "2.2.0", en: "`MissingArgument` is new: a command with too few arguments replies it and applies nothing. Before, missing arguments were applied as 0 (`/setKval 1` set every KVAL of motor 1 to 0, `/setSpeedProfile 1` set acc, dec and max speed to 0, and the positions missing in `/setTargetPositionList` became 0).", ja: "`MissingArgument`が新しく追加されました。引数が足りないコマンドにはこのエラーを返し、何も適用しません。以前は、足りない引数が0として適用されていました（`/setKval 1`はモータ1のすべてのKVALを0に、`/setSpeedProfile 1`はacc、dec、最大速度を0にし、`/setTargetPositionList`の足りない位置は0になっていました）。"}
      - {version: "2.2.0", en: "`WrongDataType` is replied for an argument of the wrong type (a string for a number, NaN or infinity, `/setConfigName` with a non-string) and applies nothing. Before, the argument was applied as 0.", ja: "`WrongDataType`は、型の誤った引数（数値の位置の文字列、NaN、無限大、`/setConfigName`の文字列以外）に対して返され、何も適用されません。以前は、その引数が0として適用されていました。"}
      - {version: "2.2.0", en: "A packet larger than 512 bytes and a message with more than 16 arguments are answered with `OscSyntaxError`.", ja: "512バイトを超えるパケットと、16個を超える引数を持つメッセージには、`OscSyntaxError`を返します。"}
      - {version: "2.2.0", en: "In some corner cases where the former OSC library read past the end of the address pattern (for example characters following a `{...}` list), the match result can differ from before.", ja: "以前のOSCライブラリがアドレスパターンの末尾を越えて読んでいた一部の特殊なケース（たとえば`{...}`のリストの後ろに文字が続く場合）では、マッチの結果が以前と異なることがあります。"}

  - address: /error/command
    args:
      - name: errorText
        type: string
        values:
          - {value: CommandIgnored, en: "The command is currently not executable. Also refer Timing section. Also sent when a value is outside the range of the command; nothing is applied (the motor ID is 255 for `/setPositionListReportInterval`).", ja: "コマンドが実行可能なタイミングではない。タイミング参照。値がコマンドの範囲外のときにも送信され、何も適用されない（`/setPositionListReportInterval`のモータIDは255）。"}
          - value: MotorIdNotMatch
            en: Motor ID is not appropriate. A motor ID outside 0-255 is replied with the value sent.
            ja: "モータIDが適切でない値になっている。0〜255の範囲外のモータIDは、送信された値のまま返される。"
            changes:
              - {version: "2.2.0", en: "A motor ID outside 0-255 is replied with the value sent. Before, 257 and 511 were read as 1 and 255.", ja: "0〜255の範囲外のモータIDは、送信された値のまま返されます。以前は、257と511が1と255として読まれていました。"}
          - {value: BrakeEngaged, en: "A motion command was sent while the electromagnetic brake was active. Also sent for `/enableServoMode 1` and `/homing` while the brake is engaged, releasing or engaging (not while stopping or after `/free`).", ja: "電磁ブレーキが効いた状態のままモーションコマンドを送信した。ブレーキが保持されている間、解放中、保持への移行中の`/enableServoMode 1`と`/homing`でも送信される（停止処理中と`/free`の後は除く）。"}
          - value: HomeSwActivating
            en: Movement from home switch position towards the origin point. Also sent by `/goUntil` and `/goUntilRaw` when the home switch is already activated.
            ja: "HOMEスイッチがオンの状態から原点復帰方向に移動しようとした。HOMEスイッチがすでにオンのときの`/goUntil`と`/goUntilRaw`でも送信される。"
            changes:
              - {version: "2.2.0", en: "Sent by `/goUntil` and `/goUntilRaw` when the home switch is already activated. It was sent as `HomeSwActivated` before.", ja: "`/goUntil`と`/goUntilRaw`が、HOMEスイッチがすでにオンのときに送信します。以前は`HomeSwActivated`として送信されていました。"}
          - {value: LimitSwActivating, boards: [STEP400], en: Movement from limit switch position towards the opposite direction from origin., ja: LIMITスイッチがオンの状態から原点復帰方向の逆向きに移動しようとした。}
          - {value: GoUntilTimeout, en: Timeout while executing `/goUntil` command., ja: "`/goUntil`コマンド実行中にタイムアウトした。"}
          - {value: ReleaseSwTimeout, en: Timeout while executing `/releaseSw` command., ja: "`/releaseSw`コマンド実行中にタイムアウトした。"}
          - value: InServoMode
            en: Received a command which can not be executed while servo mode.
            ja: サーボモードでは実行できないコマンドを送信した。
            changes:
              - {version: "2.2.0", en: "Also sent for `/goUntil`, `/goUntilRaw` and `/releaseSw`.", ja: "`/goUntil`、`/goUntilRaw`、`/releaseSw`でも送信されます。"}
          - {value: BrakeReleaseFailed, since: "2.2.0", en: "`/activate 1` was sent but the driver stayed HiZ (for example without motor power), so the brake stays engaged.", ja: "`/activate 1`を送信したが、ドライバが無励磁のままだった（たとえばモータ電源がない）ため、ブレーキは保持されたままになった。"}
          - {value: BrakeEngagedOnHiZ, since: "2.2.0", en: "The driver went HiZ by itself (overcurrent shutdown, thermal shutdown, UVLO) while the brake was released, so the brake was engaged.", ja: "ブレーキが解放されている間に、ドライバのアラーム（過電流、過熱、電源電圧の低下）で無励磁になった結果、ブレーキを保持した。"}
          - {value: ServoModeCancelledOnHiZ, en: "The driver went HiZ by itself (overcurrent shutdown, thermal shutdown, UVLO) in the servo mode, so the servo mode was cancelled. Enable it again with `/enableServoMode 1`.", since: "2.2.0", ja: "サーボモード中に、ドライバのアラーム（過電流、過熱、電源電圧の低下）で無励磁になった結果、サーボモードを取り消した。`/enableServoMode 1`でもう一度有効にする。"}
          - {value: MotorNotHiZ, en: "The command writes a driver register that can be written only while the outputs are HiZ, and the motor is not HiZ. A motor holding its position is not HiZ: send `/softHiZ` or `/hardHiZ` first. Nothing is applied.", since: "2.2.0", ja: "ドライバのレジスタのうち、出力が無励磁のときだけ書き込めるものをコマンドが書き込もうとしたが、モータが無励磁ではなかった。励磁して位置を保っているモータは無励磁ではない。先に`/softHiZ`か`/hardHiZ`を送る。何も適用されない。"}
          - {value: MotorNotStopped, en: "The command writes a driver register that can be written only while the motor is stopped or HiZ, and the motor is turning. Nothing is applied.", since: "2.2.0", ja: "停止中か無励磁のときだけ書き込めるドライバのレジスタをコマンドが書き込もうとしたが、モータが回転していた。何も適用されない。"}
        description: {en: A character string that indicates the details of an error., ja: エラーの内容を示す文字列です。}
      - use: motorID
        description: {en: The motor's ID, ja: モータのID}
    description:
      en: |
        This message will be sent if an error is detected while executing a command.
        The message can be enabled or disabled with [[/reportError]] command.

        With 255 (all motors), each motor is judged alone for the errors that depend on the state of a motor (`MotorNotHiZ`, `MotorNotStopped`): the motors in the required state are changed and the others reply the error.
      ja: |-
        コマンドの実行時にエラーが発生した場合に送信されます。
        [[/reportError]]によって、送信の有効/無効を切り替えることができます。

        255（全モータ）のとき、モータの状態に依存するエラー（`MotorNotHiZ`、`MotorNotStopped`）は、モータごとに判定されます。必要な状態のモータは変更され、他のモータはエラーを返します。
    changes:
      - {version: "2.2.0", en: "New errors: `BrakeReleaseFailed`, `BrakeEngagedOnHiZ`, `ServoModeCancelledOnHiZ` (electromagnetic brake and servo mode), `MotorNotHiZ` and `MotorNotStopped` (registers that can be written only in some states). All follow [[/reportError]].", ja: "新しいエラー: `BrakeReleaseFailed`、`BrakeEngagedOnHiZ`、`ServoModeCancelledOnHiZ`（電磁ブレーキとサーボモード）、`MotorNotHiZ`と`MotorNotStopped`（特定の状態でしか書き込めないレジスタ）。いずれも[[/reportError]]に従います。"}
      - {version: "2.2.0", en: "`CommandIgnored` is also replied when a value is outside the range of the command, and nothing is applied: [[/setPositionReportInterval]] and [[/setPositionListReportInterval]] above 65535 (255 for the list), [[/setGoUntilTimeout]] and [[/setReleaseSwTimeout]] below 0, [[/setElPos]] with a full step outside 0-3 or a microstep outside 0-127, [[/setServoParam]] with a negative gain, [[/setBrakeTransitionDuration]] outside 0-65535, [[/setDecayModeParam]] with TON_MIN or TOFF_MIN above 127.", ja: "`CommandIgnored`は、値がコマンドの範囲外のときにも返され、何も適用されません: 65535を超える[[/setPositionReportInterval]]と[[/setPositionListReportInterval]]（リストは255）、0未満の[[/setGoUntilTimeout]]と[[/setReleaseSwTimeout]]、0〜3の範囲外のフルステップまたは0〜127の範囲外のマイクロステップの[[/setElPos]]、負のゲインの[[/setServoParam]]、0〜65535の範囲外の[[/setBrakeTransitionDuration]]、127を超えるTON_MINまたはTOFF_MINの[[/setDecayModeParam]]。"}
      - {version: "2.2.0", en: "`MotorIdNotMatch` is replied for a motor ID outside 0-255, with the value sent. Before, 257 and 511 were read as 1 and 255.", ja: "`MotorIdNotMatch`は、0〜255の範囲外のモータIDに対して、送信された値とともに返されます。以前は、257と511が1と255として読まれていました。"}
      - {version: "2.2.0", en: "`HomeSwActivating` is replied by `/goUntil` and `/goUntilRaw` for an activated home switch. It was sent as `HomeSwActivated`, and it now follows `/reportError` like the other command errors.", ja: "`HomeSwActivating`は、HOMEスイッチがオンのときの`/goUntil`と`/goUntilRaw`が返します。以前は`HomeSwActivated`として送信され、今は他のコマンドのエラーと同じように`/reportError`に従います。"}
