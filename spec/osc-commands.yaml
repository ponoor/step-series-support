      en: |-
        Sets only the deceleration KVAL value.

        A value outside 0-255 is not rejected: it is limited to 0-255.

        On STEP400 in the current mode only the stored setting changes; [[/setVoltageMode]] writes it to the registers.
      ja: |-
        減速時のKVALのみを設定します。

        0〜255の範囲外の値は拒否されず、0〜255に制限されます。

        STEP400の電流モードでは、保存される設定だけが変わります。[[/setVoltageMode]]でレジスタに書き込まれます。
    see_also: [/setKval]

  - address: /setCurrentMode
    group: drive_mode
    args: [{use: motorID}]
    boards: [STEP400]
    timing: hiz
    description:
      en: |-
        Switches the specified motor to the current drive mode.

        The PowerSTEP01 current mode goes up to 1/16 microsteps: a finer microstep mode is lowered to 1/16, and the stored setting ([[/setMicrostepMode]], `driverSettings.stepMode`) is changed with it.
      ja: |-
        指定したモータを電流モードに切り替えます。

        PowerSTEP01の電流モードは1/16マイクロステップまでです。それより細かいマイクロステップモードは1/16に下げられ、保存されている設定（[[/setMicrostepMode]]、`driverSettings.stepMode`）も一緒に変わります。
    errors: [MotorNotHiZ, CommandIgnored]
    changes:
      - {version: "2.2.0", en: "The outputs must be HiZ; otherwise `/error/command MotorNotHiZ` is replied and nothing is applied.", ja: "出力は無励磁でなければなりません。そうでないときは`/error/command MotorNotHiZ`を返し、何も適用されません。"}
      - {version: "2.2.0", en: "The mode is changed only if the driver took it (STEP_MODE is read back); otherwise `/error/command CommandIgnored`. Before, the stored mode was changed while the driver kept the old one, so [[/setKval]] and [[/setTval]] then wrote the wrong registers.", ja: "ドライバがモードを受け付けたとき（STEP_MODEを読み戻して確認します）だけモードを変更します。そうでないときは`/error/command CommandIgnored`を返します。以前は、ドライバが元のモードのままなのに保存されるモードだけが変わっていたため、その後の[[/setKval]]と[[/setTval]]が誤ったレジスタに書き込んでいました。"}
    see_also: [/setVoltageMode, /setMicrostepMode]

  - address: /setTval
    group: drive_mode
    args:
      - use: motorID
      - name: holdTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_HOLD
        description: {en: TVAL when stopped, ja: 停止時のTVAL}
      - name: runTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_RUN
        description: {en: TVAL in constant speed operation, ja: 一定速運転時のTVAL}
      - name: accTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_ACC
        description: {en: TVAL during acceleration, ja: 加速時のTVAL}
      - name: decTVAL
        type: int
        range: [0, 64]
        setting: currentMode.TVAL_DEC
        description: {en: TVAL during deceleration, ja: 減速時のTVAL}
    boards: [STEP400]
    timing: always
    description:
      en: |
        Sets the four TVALs together.
        In STEP400, the TVAL is as follows.

        A value outside 0-64 is not rejected: it is limited to 0-64. The upper limit 64 (about 5 A) is a safety limit of the firmware.

        In the voltage mode only the stored setting changes; [[/setCurrentMode]] writes it to the registers.
      ja: |-
        TVAL4種をまとめて設定します。

        STEP400では、TVALは以下のようになっています。

        0〜64の範囲外の値は拒否されず、0〜64に制限されます。上限の64（約5A）はファームウェアの安全上の上限です。

        電圧モードでは、保存される設定だけが変わります。[[/setCurrentMode]]でレジスタに書き込まれます。
    see_also: [/getTval, /getTval_mA, /setHoldTval, /setRunTval, /setAccTval, /setDecTval]
    tables:
      - columns: [TVAL, {en: "Setting value[mA]", ja: "設定値[mA]"}]
        rows:
          - [0, 78mA]
          - [1, 156mA]
          - ["...", "..."]
          - [127, "9,984mA"]

  - address: /getTval
    group: drive_mode
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: |-
        Get the four TVAL types together.

        With the electromagnetic brake enabled and the current mode, TVAL_HOLD is raised to at least half of TVAL_RUN whenever the motor is energized again (from engaged, engaging or after [[/free]]), and this command returns the raised value. In the voltage mode KVAL_HOLD is raised instead.
      ja: |-
        TVAL4種をまとめて取得します。

        電磁ブレーキが有効で電流モードのとき、モータが再び励磁されるたびに（保持、保持への移行中、`/free`の後から）TVAL_HOLDがTVAL_RUNの半分以上に引き上げられ、このコマンドは引き上げられた値を返します。電圧モードでは、代わりにKVAL_HOLDが引き上げられます。
    response: [/tval]
    changes:
      - {version: "2.2.0", en: "Returns the settings (what [[/setTval]] sets and `/saveConfig` saves) instead of the driver registers. In the voltage mode the TVAL registers keep the value from before. TVAL_HOLD raised for a motor with the electromagnetic brake is returned too.", ja: "ドライバのレジスタではなく、設定（[[/setTval]]で設定し、`/saveConfig`で保存される値）を返します。電圧モードではTVALのレジスタは以前の値のままです。電磁ブレーキのモータで引き上げられたTVAL_HOLDも返されます。"}
    see_also: [/getTval_mA]

  - address: /getTval_mA
    group: drive_mode
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: Get the four TVAL types together. Not in register values but in the actual current values in [mA].
      ja: TVAL4種をまとめて取得します。レジスタの値ではなく単位[mA]の設定値で返します。
    response: [/tval_mA]
    changes:
      - {version: "2.2.0", en: "Returns the settings (what [[/setTval]] sets and `/saveConfig` saves) instead of the driver registers. In the voltage mode the TVAL registers keep the value from before. TVAL_HOLD raised for a motor with the electromagnetic brake is returned too.", ja: "ドライバのレジスタではなく、設定（[[/setTval]]で設定し、`/saveConfig`で保存される値）を返します。電圧モードではTVALのレジスタは以前の値のままです。電磁ブレーキのモータで引き上げられたTVAL_HOLDも返されます。"}
    see_also: [/getTval]

  - address: /setDecayModeParam
    group: drive_mode
    args:
      - use: motorID
      - name: T_FAST
        type: int
        range: [0, 255]
        setting: currentMode.T_FAST
        description: {en: T_FAST register value, ja: T_FASTレジスタの値}
      - name: TON_MIN
        type: int
        range: [0, 127]
        setting: currentMode.TON_MIN
        description: {en: TON_MIN register value, ja: TON_MINレジスタの値}
      - name: TOFF_MIN
        type: int
        range: [0, 127]
        setting: currentMode.TOFF_MIN
        description: {en: TOFF_MIN register value, ja: TOFF_MINレジスタの値}
    boards: [STEP400]
    timing: hiz
    description:
      en: |-
        Sets registers for the current control algorithm parameters. For the each register values, refer the datasheet of the PowerSTEP01.

        The outputs must be HiZ; otherwise `MotorNotHiZ` is replied and nothing is applied.

        TON_MIN and TOFF_MIN are 7 bit (0-127): a value outside it replies `CommandIgnored` and nothing is applied. A T_FAST outside 0-255 is limited to 0-255.
      ja: |-
        電流制御アルゴリズムのパラメータのレジスタを設定します。各レジスタの設定値についてはPowerSTEP01のデータシートを参照してください。

        出力は無励磁でなければなりません。そうでないときは`MotorNotHiZ`を返し、何も適用されません。

        TON_MINとTOFF_MINは7ビット（0〜127）です。範囲外の値には`CommandIgnored`を返し、何も適用されません。0〜255の範囲外のT_FASTは0〜255に制限されます。
    errors: [MotorNotHiZ, CommandIgnored]
    changes:
      - {version: "2.2.0", en: "TON_MIN and TOFF_MIN are 0-127 (7 bit); a value outside it replies `/error/command CommandIgnored` and nothing is applied. Before, 128-255 were taken modulo 128 by the driver while the saved value stayed 128-255. T_FAST is 0-255 as before.", ja: "TON_MINとTOFF_MINは0〜127（7ビット）です。範囲外の値には`/error/command CommandIgnored`を返し、何も適用されません。以前は、128〜255はドライバで128の剰余として扱われる一方、保存される値は128〜255のままでした。T_FASTは以前と同じく0〜255です。"}
      - {version: "2.2.0", en: "The outputs must be HiZ; otherwise `/error/command MotorNotHiZ` and nothing is applied.", ja: "出力は無励磁でなければなりません。そうでないときは`/error/command MotorNotHiZ`を返し、何も適用されません。"}
    see_also: [/getDecayModeParam]

  - address: /getDecayModeParam
    group: drive_mode
    args: [{use: motorID}]
    boards: [STEP400]
    timing: always
    description:
      en: Retrieves the register values for the current control algorithm parameters.
      ja: 電流制御アルゴリズムのパラメータを設定するレジスタ値を取得します。
    response: [/decayModeParam]

