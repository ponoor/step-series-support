# 日本語の訳語表。tools/validate_spec.py が検査に使う。
# use: 使う語。avoid: 使わない語（部分一致）。avoid_regex: 正規表現で書く avoid。
# allow: avoid が出てもよい文脈（正規表現）。
# level: error（省略時。文脈によらず使わない。検査が失敗する）／review（文脈で正しいことがある。一覧に出すだけ）。
# unless_sentence: 同じ文（。か改行で区切る）がこれに当たるときは出さない（正規表現）。
# 確認して「これでよい」と決めた箇所は spec/glossary_ja_reviewed.yaml に書く。
# 検査の対象と除外は tools/validate_spec.py の docstring を参照。
terms:
  # ---- error
  - use: モータ
    concept: モータ（長音なし）
    avoid: [モーター]
  - use: センサ
    concept: センサ（長音なし）
    avoid: [センサー]
  - use: 解放
    concept: ブレーキを外す。外した状態は「解放中」
    avoid: [開放]
  - use: 即停止
    concept: 即座に止める停止（/hardStop）
    avoid: [ハードストップ, 即時停止]
  - use: 減速停止
    concept: 減速してから止める停止（/softStop）
    avoid: [ソフトストップ]
  - use: 無励磁
    concept: "HiZ（文中で状態を言うとき。「（HiZ）」は添えない。定義は「OSCコマンドリファレンス: 共通の決まり」と機能ガイドに書く）"
    avoid: [ハイインピーダンス]
  - use: 最大速度
    concept: 速度（向きは「回転方向」）
    avoid: [最大速さ, 最小速さ, 速さ]
  - use: スピードプロファイル
    concept: 加速度・減速度・最大速度の組
    avoid: [速度プロファイル]
  - use: 返信
    concept: 問い合わせ（コマンド）への返事。問い合わせなしにボードが送るものは「通知」
    avoid: [返答, 返送]
  - use: 引数
    concept: argument
    avoid: [アーギュメント]
  - use: 移行時間
    concept: transition duration
    avoid: [遷移時間]
  - use: 設定ファイル
    concept: configuration file。configuration は「設定」「設定ファイル」「設定名」と書く
    avoid: [コンフィギュレーション]
  - use: JSON
    concept: 大文字で書く（Json と書かない。ArduinoJson などの名前の一部、コード、ファイル名 *.json は対象外）
    avoid_regex: ['(?<![A-Za-z0-9_.])Json(?![A-Za-z0-9_])']
  - use: HOMEスイッチ
    concept: HOME 端子につなぐもの（センサでも）
    avoid: [HOMEセンサ, Homeセンサ, ホームセンサ]
  - use: LIMITスイッチ
    concept: LIMIT 端子につなぐもの（センサでも）
    avoid: [LIMITセンサ, Limitセンサ, リミットセンサ]
  - use: HOME端子
    concept: 「HOMEスイッチ端子」とは書かない（スイッチの状態は「HOMEスイッチがオン」）
    avoid: [HOMEスイッチ端子, LIMITスイッチ端子]
  - use: オン
    concept: スイッチの状態（オン = 入力が Low）。オフはその反対
    avoid: [作動している, 反応している, 押されている]
  - use: マイクロステップ
    concept: microstep
    avoid: [マイクロステッピング]
  - use: ボード
    concept: STEP400・STEP800 の総称。「本デバイス」「本機」は使わない
    avoid: [本デバイス, 本機]
    allow: ["本機能"]
  - use: MCU
    concept: microcontroller
    avoid: [マイコン]
  - use: CPU動作異常
    concept: CPU のフォルト（HardFault はそのまま）
    avoid: [CPU異常, CPUフォルト]
  - use: 過熱遮断
    concept: thermal / bridge / device shutdown
    avoid: [温度の遮断]
  - use: STATUSレジスタ
    concept: 「STATUSレジスタ」または「状態」と書く
    avoid: [ステータス]
  - use: ラッチされたフラグ
    concept: latched flags
    avoid: [警告フラグ]
  - use: 位置レポート
    concept: 機能名。「位置通知」とは書かない
    avoid: [位置通知]
  - use: 従って
    concept: 「従って」にそろえる
    avoid: [にしたがって]
  - use: すべて
    concept: 「すべて」にそろえる
    avoid: [全て]
  # ---- group names（avoid なし。YAML の groups の ja と、リファレンスのページの題をそろえる）
  - use: 位置管理
    concept: "グループ position の名称（英語は Position management）。文中の「座標」は座標の意味で使うので avoid にしない"
  # ---- review
  - use: ボード
    level: review
    concept: 「基板」は寸法・端子・部品の配置など、物としての基板の話だけ
    avoid: [基板]
  - use: 返信
    level: review
    concept: 返信（コマンドへの返事）／通知（問い合わせなしに送る）。ネットワークの「応答」は ARP などに限る
    avoid: [応答, 報告]
    allow: ["ARPの応答", "応答時間"]
  - use: 一周する
    level: review
    concept: 「範囲外の値は最大値の次を0として数え直した値になる」と書く。1回転の意味なら「1回転」
    avoid: [一周]
  - use: ストール
    level: review
    concept: stall。「脱調」は但書の「脱調（ステップのずれ）」だけ
    avoid: [脱調]
    allow: ["脱調（ステップのずれ）"]
  - use: 拒否
    level: review
    concept: エラーを送って受け付けないものは「拒否」。エラーを送らずに捨てるものだけ「無視」
    avoid: [無視]
  - use: 保持
    level: review
    concept: ブレーキにだけ使う。モータは「励磁して位置を保つ」
    avoid: [保持]
    unless_sentence: ["ブレーキ", "保持中", "保持状態", "保持への"]
  - use: 無励磁
    level: review
    concept: 文中の HiZ。コード・アドレス・エラー名・値の名前の HiZ はそのまま
    avoid_regex: ['(?<![A-Za-z0-9/_])HiZ(?![A-Za-z0-9_])']
spacing:
  # 英数字（A-Z a-z 0-9）と日本語の文字（全角の記号・括弧を含む）の間、および日本語の文字どうしの間に
  # 半角空白を入れない。インラインコードと [[...]] のリンクの前後も同じ。error。
  no_space_between_ascii_and_ja: true
  # 日本語の文（かな・漢字を含む行）の中では、数字と単位の間にも半角空白を入れない（64mA、5ms）。error。
  # 英語の文字列、日本語を含まない ja、表の「範囲 / 単位」の列は対象外。
  # 日本語の文字の隣にある半角の括弧 ( ) は全角（ ）にする。error。インラインコードの中は対象外。
  fullwidth_parentheses: true
  units: [ms, s, us, "µs", ns, mA, A, mV, V, V/us, "V/µs", Hz, kHz, MHz, "%", "℃", "°C", mm, step, steps, step/s, step/s/s, microstep, LSB, bit, byte, bytes]
