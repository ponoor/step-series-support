# New in v2.2.0 (not in python-step-series v1.0.0): only what cannot be derived from the YAML.
# `kind` is derived (Get if the command has an unconditional response) unless given here.
new_commands:
  /saveConfig: {kind: Get}

# YAML argument name -> existing field name, where they differ.
field_names:
  /setTval: {decTVAL: setDecTVAL}

# Commands that carry a `response_cls` although the YAML has no unconditional `response` / `notifies`
# for it (kept as in v1.0.0).
response_cls:
  /resetDevice: [/booted]
  /enableLowSpeedOptimize: [/lowSpeedOptimizeThreshold]

# Arguments that the library accepts as optional (default None) although the YAML lists them as plain arguments.
optional:
  /error/command: [motorID]

# Fields the library has but the YAML does not (appended after the YAML arguments).
extra_fields:
  /error/osc:
    - {name: motorID, type: int, default: "None", doc: "The motor ID the error refers to, if any."}

# Fields written out by hand instead of taken from the YAML (parsing special cases).
fields:
  /version:
    - {name: firmware_name, type: str, doc: Name of the firmware.}
    - {name: firmware_version, type: str, doc: Version of the firmware.}
    - {name: compile_date, type: str, doc: Compile date of the firmware.}
    - raw: |
        # Custom regex to breakout
        compile_date_re: re.Pattern = field(
            default=re.compile(r"\w+ ? \d{1,2} \d{4} .+"),
            init=False,
            repr=False,
        )
