# Checks of the spec, the generated pages and the site (the same as tools/hooks/pre-commit, plus pytest and the build).
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            requirements-docs.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt -r requirements-docs.txt pytest
      - name: Validate the spec and the Japanese texts
        run: python tools/validate_spec.py --ja
      - name: Generated pages are up to date
        run: python tools/generate.py --check --defaults both --coverage
      - name: The .htaccess redirects are up to date
        run: python tools/gen_htaccess.py --check
      - name: Tests
        run: pytest -q
      - name: Build the site
        run: mkdocs build --strict
      - name: Build the trial site
        run: mkdocs build --strict -f mkdocs.preview.yml
